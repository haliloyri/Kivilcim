<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2340" viewBox="0 0 1080 2340">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fcf9f4"/>
      <stop offset="100%" stop-color="#f7f2e8"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#D8C08F"/>
      <stop offset="100%" stop-color="#BE9347"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.12" flood-color="#6e5f4f"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="0" y="0" width="100%" height="120" fill="#fcf9f4"/>
  <text x="60" y="78" font-family="Georgia, serif" font-size="42" fill="#823b18">Spark ✦</text>
  <text x="60" y="130" font-family="Arial, sans-serif" font-size="30" fill="#7D6F5E">Kıvılcım Yolu · Keşif Yolu</text>

  
  <rect x="60" y="190" rx="32" ry="32" width="960" height="420" fill="url(#hero)"/>
  <rect x="60" y="190" rx="32" ry="32" width="960" height="420" fill="#202D62" opacity="0.88"/>
  <circle cx="865" cy="330" r="170" fill="#F5C96B" opacity="0.14"/>
  <circle cx="855" cy="420" r="74" fill="none" stroke="#F5C96B" stroke-width="3" opacity="0.72"/>
  <path d="M610,520 C700,392 812,580 962,360" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.44"/>
  <circle cx="855" cy="420" r="40" fill="#F5C96B" opacity="0.25"/>
  <text x="100" y="294" font-family="Arial, sans-serif" font-size="30" fill="#fff" opacity="0.78">YOL ARAÇLARI</text>
  <text x="100" y="374" font-family="Georgia, serif" font-size="62" fill="#fff">Keşif Yolu</text>
  <text x="100" y="430" font-family="Arial, sans-serif" font-size="29" fill="#fff" opacity="0.84">Merakının seni nereye götürdüğünü gör</text>
  <text x="836" y="438" font-family="Georgia, serif" font-size="70" fill="#F5C96B">⌁</text>

  <text x="60" y="700" font-family="Georgia, serif" font-size="44" fill="#1A1A1A">Bu haftanın rotası</text>
  <text x="60" y="744" font-family="Arial, sans-serif" font-size="26" fill="#7D6F5E">Üç erişilebilir kategoriden sakin bir rota</text>
  
  <g filter="url(#shadow)">
    <rect x="60" y="780" rx="28" ry="28" width="960" height="150" fill="#ffffff" stroke="#E8E3DA"/>
    <text x="88" y="844" font-family="Georgia, serif" font-size="40" fill="#1A1A1A">Hızlı Düşün, Yavaş Karar Ver</text>
    <text x="88" y="888" font-family="Arial, sans-serif" font-size="28" fill="#7D6F5E">○  Psikoloji</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="60" y="950" rx="28" ry="28" width="960" height="150" fill="#ffffff" stroke="#E8E3DA"/>
    <text x="88" y="1014" font-family="Georgia, serif" font-size="40" fill="#1A1A1A">İş Modeli Tasarımı</text>
    <text x="88" y="1058" font-family="Arial, sans-serif" font-size="28" fill="#7D6F5E">✓  Kariyer ve Başarı</text>
  </g>
  
  <g filter="url(#shadow)">
    <rect x="60" y="1120" rx="28" ry="28" width="960" height="150" fill="#ffffff" stroke="#E8E3DA"/>
    <text x="88" y="1184" font-family="Georgia, serif" font-size="40" fill="#1A1A1A">Bilinçli Dikkat</text>
    <text x="88" y="1228" font-family="Arial, sans-serif" font-size="28" fill="#7D6F5E">○  Bilim</text>
  </g>
  
  <rect x="60" y="1550" rx="28" ry="28" width="960" height="230" fill="#F7F2E9" stroke="#E8E3DA"/>
  <text x="96" y="1624" font-family="Georgia, serif" font-size="42" fill="#1A1A1A">Bilgelik Atlası</text>
  <text x="96" y="1672" font-family="Arial, sans-serif" font-size="27" fill="#7D6F5E">4 kategori · 12 tamamlanan hikâye</text>
  <text x="96" y="1738" font-family="Arial, sans-serif" font-size="25" fill="#823b18">Psikoloji  ·  Bilim  ·  Liderlik  ·  Tarih</text>
