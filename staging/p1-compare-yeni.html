<script>const D=[{"id": 1784, "title": "Sonuna Kadar İyi Yaşamak", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>25</em></h4><p>Atul Gawande yıllarca hastaları ameliyat masasında iyileştirmeye çalıştı. Ölmekte olan bir hastaya ne soracağını ise tıp eğitimi ona pek öğretmemişti. Kitabı bu eksikliğin etrafında şekillenir.</p></section><section class=\"s s-story\"><h4>story <em>233</em></h4><p>Cerrah Atul Gawande, <i>Being Mortal</i> kitabında modern tıbbın ölüme nasıl baktığını kendi mesleğinden anlatır. Hastane düzeni hastalığı yenmeye kuruludur. Tedavi seçenekleri sıralanır, hasta onay verir, süreç ilerler. Kalan zamanın nasıl geçmesini istediği ise çoğu zaman sorulmaz.</p><p>Gawande, bu eksikliğin ölçülebilir bir karşılığını gösteren bir çalışmayı aktarır. İleri evre akciğer kanseri olan hastaların bir bölümüne standart tedavinin yanında erken dönemde palyatif bakım verilir. Bu ekip hastayla yalnızca tedaviyi değil, hastanın endişelerini ve hedeflerini de konuşur.</p><p>Sonuç şaşırtıcıdır. Bu hastalar yaşamlarının sonuna doğru daha az yoğun müdahale seçer, yaşam kaliteleri daha iyi ölçülür ve ortalamada birkaç ay daha uzun yaşarlar.</p><p class=\"hl\">Gawande&#x27;nin işaret ettiği nokta şudur: iyi bir yaşam sonunu konuşmak, ömrü kısaltmak anlamına gelmez.</p><p>Kitap bu konuşmaların nasıl yapıldığını da gösterir. Hastaya hastalığını nasıl anladığı sorulur. Neyden korktuğu, kalan zamanda neyi istediği ve bunun için nelerden vazgeçmeye razı olduğu sorulur. Bu sorular karar masasını doktorun seçenek listesinden hastanın kendi önceliklerine taşır.</p><p>Gawande&#x27;ye göre sıkıntı, hekimlerin kötü niyetinden çok alışkanlıktan gelir. Hekim iyileştirmeyi öğrenmiştir, kalan zamanı kimin için neyin değerli kıldığını sormayı değil. Konuşma erken yapıldığında hasta da yakınları da kararların neye dayandığını bilir.</p><p>Gawande bu konuşmaların kolay olmadığını da kabul eder. Hekim için bir seçenek sunmak, hastanın korkularını dinlemekten daha rahattır. Hasta ve yakınları için de ölüm konusunu açmak çoğu zaman ertelenir. Gawande&#x27;ye göre konuşma ertelendikçe kararlar aceleyle, yoğun bakımın koşullarında ve hastanın yerine başkaları tarafından verilir.</p><p>Kitabın çağrısı, kalan zamanın ölçütünü hastanın kendisinin koymasıdır.</p></section><section class=\"s s-lessons\"><h4>lessons <em>51</em></h4><div class=\"lesson\"><b>İyi bir son, önce nelerin vazgeçilmez olduğunu bilmekle başlar.</b> Bir ailede dedenin evde mi kalacağı, bakım evine mi gideceği konuşulurken herkes seçenek sayar ama dedeye en çok neyi sevdiği sorulmaz. Önce o soru sorulursa seçenekler kendiliğinden ayıklanır ve yakınlarınız neyi korumaya çalıştığınızı bilir. Böylece zor karar, korkulardan çok önceliklerle verilmiş olur.</div></section><section class=\"s s-reflect\"><h4>reflect <em>13</em></h4><div class=\"ask\">Kalan zamanınız kısalsaydı günlerinizin hangi kısmı vazgeçilmez olurdu ve yakınlarınız bunu biliyor mu?</div></section><section class=\"s s-use\"><h4>use <em>75</em></h4><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Yaşlı bir yakınınızın bakımı konuşulurken herkes seçenek sayıyor</p><p class=\"say\">&quot;Önce ona soralım: senin için iyi bir gün nasıl geçer, en çok neyden korkuyorsun? Sonra seçeneklere bakarız.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Hasta bir arkadaşınız tedavisinden bahsediyor</p><p class=\"say\">&quot;Gawande&#x27;nin kitabında hekimler hastanın hedeflerini de soruyormuş. Senin için bu süreçte vazgeçilmez olan ne?&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Kendi isteklerinizi yakınlarınıza hiç anlatmadınız</p><p class=\"say\">&quot;Sana bir şey söylemek istiyorum. Benim için iyi bir gün şöyle bir şey ve bunu bilmeni isterim.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Tedavi listesinden önce şunu sorun: bu insan için iyi bir gün nasıl görünür?</div></section>", "counts": {"open": 25, "story": 233, "lessons": 51, "reflect": 13, "use": 75, "pocket": 13}, "total": 410, "var": "<div class=\"v\"><b>punchline</b> Gawande, ağır hastaya önce hangi tedaviyi değil, iyi bir günün ona nasıl göründüğünü sormayı öğütler.</div><div class=\"v\"><b>thirty_sec</b> Cerrah Atul Gawande, modern tıbbın ölümü bir yenilgi gibi gördüğünü fark eder. Kitabında ileri evre akciğer kanseri hastalarına standart tedavinin yanında erken palyatif bakım verilen bir çalışmayı aktarır. Bu hastalar daha az yoğun müdahale seçmiş, yaşam kaliteleri daha iyi çıkmış ve ortalamada birkaç ay daha uzun yaşamışlar. Hekimler onlara neden korktuklarını, ne istediklerini ve nelerden vazgeçebileceklerini sormuş.</div><div class=\"v\"><b>key_contrast</b> Süre ve anlam</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>18</em></h4><p>Cerrah Atul Gawande yıllarca ağır hastaların hayatını uzatmaya çalıştı. Ölmekte olan biriyle ne konuşacağını ise ona hiç öğretmemişlerdi.</p></section><section class=\"s s-story\"><h4>story <em>243</em></h4><p>Cerrah Atul Gawande, <i>Being Mortal</i> (2014) kitabında tıp eğitiminin ona ölmekte olan biriyle nasıl konuşulacağını öğretmediğini yazar. Modern hastane bakımı hastalığa karşı savaşmak üzerine kurulmuştur. Hastanın kalan zamanda neye değer verdiği ise çoğu kez hiç sorulmaz. Gawande kendini de bu tabloya katar: bir cerrah olarak hastalığı nasıl tedavi edeceğini biliyordu, ama hastanın kalan günlerinde neyin önemli olduğunu sormayı öğrenmemişti.</p><p>Gawande bu boşluğu bir çalışmayla gösterir. Çalışmada ileri evre akciğer kanseri olan hastaların bir kısmı, standart tedavinin yanında erken dönemde palyatif bakım aldı. Bu bakımın özü bir konuşmadır ve seçeneklerin sıralanmasından önce gelir. Hastayla hastalığı nasıl anladığı, nelerden korktuğu, neleri hedeflediği ve bunun için hangi ödünleri verebileceği konuşulur.</p><p class=\"hl\">Bu hastalar yaşamın sonuna doğru daha az yıpratıcı bakımı seçti, yaşam kalitesi daha iyiydi ve ortalama olarak birkaç ay daha uzun yaşadı.</p><p>Gawande kesin bir süre vermez, yalnızca yönü gösterir: daha az saldırgan bakım ile daha iyi bir yaşam kalitesi ve biraz daha uzun bir ömür aynı hastalarda yan yana gelmiştir. Yani konuşma, tedaviden vazgeçmek anlamına gelmemiş, tedaviyi hastanın istediği şeye bağlamıştır.</p><p>Gawande&#x27;ye göre sonu konuşmak ömrü kısaltmaz. Konuşmayı ertelemek ise kararların son anda ve aceleyle verilmesine yol açar. O noktada seçenekler çoktur, zaman azdır ve hastanın neyi istediği hâlâ sorulmamış olabilir.</p><p>Kitabın çağrısı şudur: kalan zamanın ölçüsünü hasta koysun. Tedavi listesi hazırlanmadan önce, o listenin neye hizmet etmesi gerektiği sorulur. Cevap kişiden kişiye değişir. Bakım ise o cevaba göre şekillenir. Hasta böylece tedavinin amacını kendi cümleleriyle söylemiş olur, doktor da listeyi bu amaca göre kurar.</p></section><section class=\"s s-lessons\"><h4>lessons <em>52</em></h4><div class=\"lesson\"><b>İyi bir sonu, vazgeçemeyeceğiniz şeyi bilmekle başlatın.</b> Annesi için hastane seçeneklerini araştıran bir kızın elinde uzun bir liste vardır, ama annesinin en çok neyi kaybetmekten korktuğunu belki hiç sormamıştır. Bu soruyu sorduğunuzda her seçeneği aynı ölçüyle tartarsınız ve karar kolaylaşır. Aynı soruyu kendinize sormak da, sizin yerinize başkalarının karar vermesi ihtimalini azaltır.</div></section><section class=\"s s-reflect\"><h4>reflect <em>15</em></h4><div class=\"ask\">Kalan zamanınız şimdikinden kısa olsaydı, günlerinizin hangi kısımlarından vazgeçmezdiniz ve yakınlarınız bunu biliyor olurdu mu?</div></section><section class=\"s s-use\"><h4>use <em>76</em></h4><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Bir yakınınızın bakımı konuşuluyor ve herkes seçenekleri sıralıyor</p><p class=\"say\">&quot;Önce ona soralım: iyi bir gün onun için nasıl geçer, en çok neden korkuyor? Seçeneklere sonra bakarız.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Hasta bir arkadaşınız tedavisini anlatıyor</p><p class=\"say\">&quot;Gawande&#x27;nin anlattığı çalışmada doktorlar da önce bunu sormuş: Bu süreçte senin için en önemli şey ne?&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Dileklerinizi şimdiye kadar kimseye anlatmadınız</p><p class=\"say\">&quot;Benim için iyi bir gün şöyle geçer. Bunu bilmeni istedim, çünkü gerektiğinde karar verirken işine yarar.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Tedavi listesinden önce şunu sorun: bu insan için iyi bir gün neye benzer?</div></section>", "counts": {"open": 18, "story": 243, "lessons": 52, "reflect": 15, "use": 76, "pocket": 13}, "total": 417, "var": "<div class=\"v\"><b>punchline</b> Gawande&#x27;ye göre ağır hastaya hangi tedaviyi istediğini sormadan önce, iyi bir günün ona neye benzediğini sormak gerekir.</div><div class=\"v\"><b>thirty_sec</b> Cerrah Atul Gawande ağır hastayla nasıl konuşulacağını okulda öğrenmemişti. Anlattığı çalışmada ileri evre akciğer kanserli hastalar erken palyatif bakımda korkularını ve hedeflerini konuştu. Daha az yıpratıcı bakımı seçtiler, yaşam kaliteleri daha iyiydi ve ortalama birkaç ay daha uzun yaşadılar. Önerisi, kalan zamanın ölçüsünü hastanın koymasıdır.</div><div class=\"v\"><b>key_contrast</b> Süre ve anlam</div>"}}, {"id": 1786, "title": "Dört Bin Haftalık Ömür", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>27</em></h4><p>Dört bin hafta. Oliver Burkeman&#x27;a göre sıradan bir insan ömrü kabaca bu kadardır. Yıllarca verimlilik yazan bir gazeteci bu sayıyı hesapladığında, denediği tekniklerin hiçbirini aynı gözle görmedi.</p></section><section class=\"s s-story\"><h4>story <em>237</em></h4><p>Oliver Burkeman gazetecilik yaparken yıllarca verimlilik üzerine yazdı. Kendi yazdığı tekniklerin çoğunu denedi: yapılacaklar listeleri, zaman çizelgeleri, e-posta düzenleri. <i>Four Thousand Weeks</i> kitabında bu denemelerin sonunda vardığı yeri anlatır.</p><p>İlk bulgu bir sayıydı. Yaklaşık seksen yıl yaşayan bir insan kabaca dört bin hafta yaşar. Bu rakam soyut bir fikir olarak değil, bir takvim olarak görüldüğünde zamana bakışı değiştirir.</p><p>İkinci bulgu, Burkeman&#x27;ın verimlilik tuzağı dediği şeydi. E-postalara daha hızlı cevap verdikçe daha çok e-posta gelir. Listeyi boşalttığınız anda yenisi dolar. Bu yüzden daha verimli olmak insanı rahatlatmaz, üzerine daha çok iş çeker. Bitiş çizgisi, koşucuyla birlikte uzar.</p><p class=\"hl\">Burkeman&#x27;ın vardığı sonuç, her şeye yetişme hayalini bırakmaktır.</p><p>Sınırlı bir varlık olduğunuzu kabul ettiğinizde &quot;her şeyi nasıl sığdırırım&quot; sorusu anlamını yitirir. Yerine daha zor bir soru gelir: hangi birkaç şeye gerçekten yer açacaksınız ve hangilerini bilerek ihmal edeceksiniz? Burkeman bu ihmali seçimin kaçınılmaz bedeli olarak görür. Her evet, başka bir şeye söylenmiş bir hayırdır.</p><p>Bu kabul Burkeman&#x27;ın kitabında kaygı verici olmaktan çok rahatlatıcı bir şey olarak anlatılır. Her şeyi yapamayacağınız zaten baştan bellidir. Yetişemediğiniz şeyler bir başarısızlığın işareti olmaktan çıkar, sınırlı bir ömrün olağan sonucu olur. Burkeman bu yüzden önemli işlere yer açmak için sıradan, hatta hoş işlerden vazgeçmeyi göze almak gerektiğini söyler.</p><p>Rahatlama da bitmeyecek bir listeyle barışmaktan gelir. Seçtiğiniz işe daha rahat dikkat verirsiniz, çünkü öbürlerini bilerek bir kenara koymuşsunuzdur. Burkeman&#x27;ın kitabı yetişemediğiniz şeylerle ilgili suçluluğu azaltmayı da amaçlar: yetişilemeyecek bir listeyle yarışmaktan vazgeçmek, kendi ölçülerinizle yaşamaya yer açar.</p></section><section class=\"s s-lessons\"><h4>lessons <em>44</em></h4><div class=\"lesson\"><b>Zamanı yönetmek, neyi bırakacağınıza karar vermektir.</b> Küçük bir atölye sahibi her müşterinin her isteğine evet derse hiçbir işi güzel yapamaz. Birkaç işi seçip diğerlerine açıkça hayır dediğinde elindeki işe gerçekten zaman ayırabilir. Aynı seçimi kendi gününüzde yaptığınızda, yapamadıklarınız sizi suçlu hissettirmeden önceliklerinizi görmenizi sağlar.</div></section><section class=\"s s-reflect\"><h4>reflect <em>12</em></h4><div class=\"ask\">Bu hafta hangi işe ya da isteğe açıkça ve bilerek hayır diyeceksiniz?</div></section><section class=\"s s-use\"><h4>use <em>76</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekibinize bir proje daha ekleniyor</p><p class=\"say\">&quot;Bir ömür dört bin hafta ise bu proje o haftalardan birkaçı. Bunu alırsak hangisinden vazgeçeceğimizi birlikte seçelim, yoksa şimdilik hayır diyorum.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Yapılacaklar listeniz her gün yeniden doluyor</p><p class=\"say\">&quot;Bu listeyi bitirmeyeceğim. Bugün yalnızca iki işe gerçekten yer ayırıyorum, gerisi bilerek beklesin.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Her çağrıya evet demekten yoruldunuz</p><p class=\"say\">&quot;Hafta sonu için iki şeyi seçtim. Diğerlerine hayır diyorum ve bunu açıkça söylemek bana daha doğru geliyor.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Dört bin haftalık bir ömürde her evet bir hayırdır; neyi bilerek bıraktığınızı yazın.</div></section>", "counts": {"open": 27, "story": 237, "lessons": 44, "reflect": 12, "use": 76, "pocket": 13}, "total": 409, "var": "<div class=\"v\"><b>punchline</b> Ortalama bir ömür yaklaşık dört bin hafta sürüyor, e-posta kutunuz ise hiç boşalmıyor.</div><div class=\"v\"><b>thirty_sec</b> Gazeteci Oliver Burkeman yıllarca verimlilik üzerine yazdı ve tekniklerin hepsini denedi. Sonunda iki şeyi gördü: insan ömrü kabaca dört bin hafta ve verimli oldukça işin azalmıyor, e-posta ve liste yeniden doluyor. Çıkış olarak her şeye yetişme hayalini bıraktı. Önemli birkaç işe yer açıp gerisini bilerek ihmal etmeyi seçti.</div><div class=\"v\"><b>key_contrast</b> Yetişmek yerine seçmek</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>25</em></h4><p>Ortalama bir ömür yaklaşık dört bin hafta eder. Yıllarca verimlilik üzerine yazan Oliver Burkeman bu sayıyı kendi hayatına uyguladığında, listesinin hiç bitmeyeceğini de kabul etti.</p></section><section class=\"s s-story\"><h4>story <em>232</em></h4><p>Oliver Burkeman gazeteci olarak yıllarca verimlilik üzerine yazdı ve önerdiği tekniklerin çoğunu kendi üzerinde denedi. <i>Four Thousand Weeks</i> (2021) kitabında vardığı sonuç, bu tekniklerin onu rahatlatmadığıdır. Ortalama bir ömür yaklaşık seksen yıl sürer. Bu da kabaca dört bin hafta eder. Ömrü haftalarla saymak onu uçsuz bir zaman olmaktan çıkarır ve sayılabilir bir şeye çevirir. Bir haftayı nasıl harcadığınız artık küçük bir mesele gibi durmaz.</p><p>Burkeman&#x27;ın verimlilik tuzağı dediği şey şöyle işler. E-postaları daha hızlı yanıtlarsanız daha çok e-posta gelir. Yapılacaklar listesini bitirirseniz yerine yeni bir liste yazılır. Verimli olmak, rahatlama getirmek yerine yeni işi kendine çeker. Teknikleri kendi günlerinde deneyen biri için bu, kuramsal bir uyarı değil, tekrar eden bir deneyimdi.</p><p class=\"hl\">Burkeman&#x27;ın çıkış yolu, her şeyin üstesinden gelme hayalini bırakmak ve sınırlı bir ömre sahip olduğunuzu kabul etmektir.</p><p>Bu kabulden sonra yapılacak şey bellidir. Önemli olan birkaç şeye yer açarsınız, geri kalanını bilerek ihmal edersiniz. İhmal etmek burada başarısızlık sayılmaz, bir seçim sayılır. Sınırlı bir hayatta her evet, başka bir şeye söylenmiş bir hayırdır.</p><p>Bu yüzden bazı şeyleri kaçırmak, sonlu bir hayatın olağan sonucudur. Gidilmeyen her davet, okunmayan her kitap, cevaplanmayan her mesaj aynı bedelin parçasıdır. Hepsine yetişmenin mümkün olmamasının nedeni sizin yavaş olmanız değil, haftaların yetmemesidir.</p><p>Burkeman&#x27;ın önerdiği zaman yönetimi bu yüzden bir hız meselesi sayılmaz. Listeniz ne kadar uzarsa uzasın, haftalarınızın sayısı aynı kalır. Hangi işe ve hangi kişiye ayıracağınıza siz karar vermezseniz, bu kararı gelen kutusu sizin yerinize verir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>47</em></h4><div class=\"lesson\"><b>Zaman yönetimini, neyi yapmayacağınıza karar vermek olarak görün.</b> Küçük bir atölyede çalışan bir terzi her siparişi kabul ederse en özenle dikeceği işi aksatabilir. Baştan &quot;bu ay yalnızca şu işleri alıyorum&quot; derse geri çevirdiği işlerin bedelini bilerek ödemiş olur. Böylece kaçırdıklarınız sizi şaşırtmaz, çünkü onları kendi isteğinizle bırakmışsınızdır.</div></section><section class=\"s s-reflect\"><h4>reflect <em>19</em></h4><div class=\"ask\">Bu hafta hangi işe ya da isteğe açıkça ve bilerek hayır diyeceksiniz ki daha önemli bir şeye yer açılsın?</div></section><section class=\"s s-use\"><h4>use <em>59</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekibe yeni bir proje daha ekleniyor</p><p class=\"say\">&quot;Hepimizin haftası sınırlı. Bunu alırsak hangisini bırakıyoruz? Önce onu konuşalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Yapılacaklar listeniz her gün yeniden doluyor</p><p class=\"say\">&quot;Bugün yalnızca iki iş seçiyorum. Geri kalanı bilerek bekleyecek.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Her davete evet demekten yoruldunuz</p><p class=\"say\">&quot;Bu hafta sonu için iki şey seçtim, diğerlerine hayır diyorum. İlkini seninle yapmak istiyorum.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>12</em></h4><div class=\"pocket\">Dört bin haftalık bir hayatta her evet bir hayırdır; neyi bıraktığınızı yazın.</div></section>", "counts": {"open": 25, "story": 232, "lessons": 47, "reflect": 19, "use": 59, "pocket": 12}, "total": 394, "var": "<div class=\"v\"><b>punchline</b> Ortalama bir ömür yaklaşık dört bin hafta ediyor, gelen kutusu ise hiç boşalmıyor.</div><div class=\"v\"><b>thirty_sec</b> Gazeteci Oliver Burkeman yıllarca verimlilik üzerine yazdı, ama e-postaları hızlandırdıkça daha çok e-posta, listeyi bitirdikçe yeni liste geldi. Sonra ömrün yaklaşık dört bin hafta olduğunu hesapladı. Her şeye yetişme hayalini bıraktı, önemli birkaç şeye yer açtı ve gerisini bilerek ihmal etti.</div><div class=\"v\"><b>key_contrast</b> Yetişmek yerine seçmek</div>"}}, {"id": 1787, "title": "Suyun Sessiz Gücü", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>29</em></h4><p>Tao Te Ching&#x27;e göre dünyada sudan yumuşak bir şey yoktur. Yine de sert ve güçlü olanı aşındırmakta ondan iyisi de yoktur. Metin bu çelişkiyi bir güç tarifi olarak sunar.</p></section><section class=\"s s-story\"><h4>story <em>261</em></h4><p><i>Tao Te Ching</i>, geleneksel olarak Lao Tzu&#x27;ya atfedilen, seksen bir kısa bölümden oluşan bir metindir. Çoğu bölüm birkaç satırdır ve güçten yönetime, yaşamdan ölüme kadar geniş bir alanı sade imgelerle anlatır. En bilinen imgesi sudur.</p><p>Metne göre su, içine konduğu kabın biçimini alır. Hiçbir kalıba direnmez. Herkesin kaçındığı alçak yerlere akar. Yine de sert ve güçlü olanı aşındırmada ondan iyisi yoktur. Yumuşak olan, sert olanı yener.</p><p class=\"hl\">Metnin iddiası, gücün sertlikte değil esneklikte yattığıdır.</p><p>Bölümlerde aynı yöntem tekrar eder: alışılmış değere tersinden bakılır. Metne göre bir çömlek balçıktan yapılır ama işe yarayan içindeki boşluktur. Bir odayı işe yarar kılan da duvarlar kadar aralarındaki boşluktur. Su örneği de bu çizgidedir: en yumuşak olan, sert olanın yapamadığını yapar.</p><p>Aynı düşünce, metinden çıkarılan &quot;wu wei&quot; kavramında toplanır. Genellikle &quot;zorlamadan eylemek&quot; diye anlaşılır. Bir işi akışına karşı zorlamak yerine akışı okuyup ona göre davranmak olarak yorumlanır.</p><p>Bir bölümde en yüksek iyilik de suya benzetilir. Su her şeye fayda sağlar ve onlarla yarışmaz. Başkalarının kaçındığı yerlere yerleşir. Metin bu imgeyle, gücün gösterişten uzakta ve fark edilmeden çalışabileceğini söyler.</p><p>Başka bir bölümde metin bu ayrımı yaşamla ilişkilendirir. Canlı bitkinin yumuşak ve nemli, ölü olanın kuru ve sert olduğunu söyler. Sert ve esnemeyen olan ölümün yoldaşıdır, yumuşak ve boyun eğen olan yaşamın. Bu cümleler, gücü sertlikle ölçmeye alışkın bir okur için tuhaf gelir.</p><p>Tao Te Ching&#x27;in bu imgelerde savunduğu şey, pasif kalmak değildir. Su da hareket eder, aşındırır, yol bulur. Fark, gücünü karşısındakine yüklenerek değil, bulunduğu yerin biçimine uyup sürekli akarak kullanmasıdır. Metin birçok farklı çeviriyle okunur ve ifadeler çeviriye göre değişir, ama su imgesi hepsinde aynı yerde durur.</p></section><section class=\"s s-lessons\"><h4>lessons <em>44</em></h4><div class=\"lesson\"><b>Zorlamadan önce akışı okuyun.</b> Ekip arkadaşınız her önerinize cephe alıyorsa sesinizi yükseltmek direnci artırır. Önce onun neye itiraz ettiğini dinlediğinizde konuyu başka bir yönden açabilir ve aynı yere daha az sürtünmeyle varabilirsiniz. Böylece inada giden güç, doğru anı beklemeye ve doğru yerden başlamaya ayrılır.</div></section><section class=\"s s-reflect\"><h4>reflect <em>12</em></h4><div class=\"ask\">Şu anda zorladığınız hangi işte bir adım geri çekilip akışını izlemeyi deneyebilirsiniz?</div></section><section class=\"s s-use\"><h4>use <em>74</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Karşı fikirdeki biri her önerinizi geri çeviriyor</p><p class=\"say\">&quot;Sert konuşmak yerine neyi korumaya çalıştığını dinleyeyim. Sonra aynı hedefe başka bir yoldan gitmeyi önerebilirim.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Evde bir konuda kimse geri adım atmıyor</p><p class=\"say\">&quot;Tao Te Ching&#x27;de su kayayı zorlayarak değil, sürekli akarak aşındırıyor. Bugün konuyu kapatalım, yarın yeniden konuşalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Bir işi zorlayarak ilerletmeye çalışıyorsunuz</p><p class=\"say\">&quot;Bu iş bugün zorla ilerlemiyor. Yarım saat başka bir işe geçip akışın nereye gittiğine bakacağım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>11</em></h4><div class=\"pocket\">Su kalıba uyar ve kayayı aşındırır; zorlamadan önce işin akışını okuyun.</div></section>", "counts": {"open": 29, "story": 261, "lessons": 44, "reflect": 12, "use": 74, "pocket": 11}, "total": 431, "var": "<div class=\"v\"><b>punchline</b> Tao Te Ching&#x27;e göre dünyadaki en yumuşak şey olan su, sert olanı aşındırmakta hâlâ en etkilisidir.</div><div class=\"v\"><b>thirty_sec</b> Tao Te Ching, seksen bir kısa bölümden oluşan eski bir metindir ve en bilinen imgesi sudur. Su hiçbir kalıba direnmez, her kabın biçimini alır, en alçak yere akar. Yine de sert olanı aşındırmada ondan iyisi yoktur. Metin gücü sertlikte değil esneklikte arar. Wu wei denen fikir de bunu anlatır: bir işi zorlamak yerine akışını okuyup ona göre davranmak.</div><div class=\"v\"><b>key_contrast</b> Sertlik ve esneklik</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>28</em></h4><p>Dünyada su kadar yumuşak bir şey yoktur, yine de sert ve güçlü olanı aşındırmada onu geçen de yoktur. Bu çelişki, eski bir Çin metninin en çok anlattığı şeydir.</p></section><section class=\"s s-story\"><h4>story <em>237</em></h4><p>Geleneğe göre Lao Tzu&#x27;ya atfedilen <i>Tao Te Ching</i>, seksen bir kısa bölümden oluşur. Metnin yazarı ve yazılış tarihi tartışmalıdır, çevirilerde de ifadeler birbirinden ayrılır. Ama su imgesi hemen hemen her çeviride aynı yerde durur ve metnin geri kalanını okumanın anahtarı gibi çalışır.</p><p>Su, konulduğu kabın biçimini alır. Hiçbir kalıba direnmez ve kendiliğinden alçak yerlere doğru akar. Metne göre dünyada sudan yumuşak bir şey yoktur, ama sert ve güçlü olanı aşındırmada sudan üstün bir şey de yoktur.</p><p class=\"hl\">Metin en yüksek iyiliği suya benzetir: her şeye fayda sağlar ve hiçbir şeyle çekişmez.</p><p>Aynı kitap, gücü başka bir yerde de yumuşak olanda arar. Bir çömlek kilden yapılır, ama onu kullanışlı kılan, içindeki boşluktur. Kil ne kadar kalın olursa olsun, su ya da tahıl o boşluğa konur. Bir oda da duvarlarla değil, duvarların arasındaki boşlukla işe yarar. Yapının kendisi, görünmeyen yanıyla değer kazanır. Katı olan kısım yalnızca boşluğu çevreler.</p><p>Bir diğer örnek bitkilerdir. Canlı bir bitki yumuşak ve nemlidir, ölü bir bitki kuru ve serttir. Metne göre sertlik ölüme, yumuşaklık yaşama aittir. Katılaşan kırılır, esneyen sürer. Bitkiyi canlı tutan şey de, rüzgâra karşı eğilebilmesidir. Metin bu imgeleri art arda koyarak gücün sertlikte değil, esneklikte aranması gerektiğini söyler.</p><p>Bu bakış, Tao düşüncesinde <i>wu wei</i> adıyla anılan kavramla birleşir. Çoğu zaman zorlamadan eylem olarak anlaşılır. Burada amaç hiçbir şey yapmamak değil, akışı okumak ve ona karşı itmek yerine onunla birlikte ilerlemektir. Su da taşa vurup durmaz, dönüp etrafından geçer ve zamanla taşı aşındırır.</p></section><section class=\"s s-lessons\"><h4>lessons <em>54</em></h4><div class=\"lesson\"><b>Zorlamadan önce akışı okuyun.</b> Her önerisini reddeden bir iş arkadaşıyla konuşan biri, aynı noktaya tekrar tekrar bastırırsa karşısında yalnızca sertleşen bir duvar bulur. Onun neyi korumaya çalıştığını dinleyip aynı hedefe başka bir yoldan gitmeyi önerdiğinde, ikisi de yerinden oynamadan bir geçiş açılabilir. Bu yaklaşım size hemen sonuç vermeyebilir, ama itme gücünüzü boşa harcamamanızı sağlar.</div></section><section class=\"s s-reflect\"><h4>reflect <em>15</em></h4><div class=\"ask\">Üzerine çok bastırdığınız bir sorun varsa, zorlamak yerine akışını okusaydınız onun hangi tarafını farklı görürdünüz?</div></section><section class=\"s s-use\"><h4>use <em>64</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Bir iş arkadaşınız her öneriyi reddediyor</p><p class=\"say\">&quot;Neyi korumaya çalıştığını anlamak istiyorum. Aynı hedefe başka bir yoldan gidebilir miyiz?&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Evde kimse geri adım atmak istemiyor</p><p class=\"say\">&quot;Bu konuyu bu akşam bırakalım, yarın yeniden konuşalım. Böyle ikimiz de sadece itiyoruz.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Zorladıkça yerinden kıpırdamayan bir işiniz var</p><p class=\"say\">&quot;Yarım saat başka bir işe geçeyim, sonra bu işin nerede akacağına bakarım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Su kabın biçimini alır ve yine de taşı aşındırır; zorlamadan önce akışı okuyun.</div></section>", "counts": {"open": 28, "story": 237, "lessons": 54, "reflect": 15, "use": 64, "pocket": 13}, "total": 411, "var": "<div class=\"v\"><b>punchline</b> Tao Te Ching&#x27;e göre dünyanın en yumuşak şeyi olan su, en sert olanı aşındırır.</div><div class=\"v\"><b>thirty_sec</b> Lao Tzu&#x27;ya atfedilen Tao Te Ching seksen bir kısa bölümden oluşur. Su her kabın biçimini alır, hiçbir kalıba direnmez, yine de sert olanı aşındırır. Metin gücü esnekte arar: canlı bitki yumuşak, ölü bitki serttir. Wu wei de zorlamak yerine akışı okumak olarak anlaşılır.</div><div class=\"v\"><b>key_contrast</b> Sertlik ve esneklik</div>"}}, {"id": 1788, "title": "Aslandan Kaçan Zebra", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>24</em></h4><p>Aslan gittiğinde zebra otlamaya geri döner. Robert Sapolsky&#x27;ye göre insanla zebra arasındaki asıl fark tam burada başlar: zebra alarmı kapatabilir, insan çoğu zaman kapatamaz.</p></section><section class=\"s s-story\"><h4>story <em>231</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> kitabına savanadaki bir sahneyle girer. Zebra otlarken bir aslan belirir ve zebra kaçmaya başlar. O anda beden bir acil durum planına geçer. Kalp hızlanır, kaslara enerji gider, sindirim gibi o an gerekmeyen işler askıya alınır. Bu düzen, tehlikeden kurtulmak için çok iyi çalışır.</p><p>Sonra ya zebra kaçar ya da yenir. Kaçarsa birkaç dakika içinde sakinleşir ve yine ot yer. Alarm kapanmıştır.</p><p class=\"hl\">İnsan bu alarmı aslan olmadan da çalıştırabilir.</p><p>Sapolsky&#x27;ye göre insanlar yalnızca düşünerek bile aynı stres tepkisini devreye sokar. Kira ödemesini, yaklaşan bir sınavı ya da yıllar sonraki bir riski düşünürken beden, sanki bir aslandan kaçıyormuş gibi hazırlanır. Üstelik bu düşünceler aslan gibi gelip gitmez. Günlerce, aylarca sürebilir.</p><p>Zebra için stres kaynağı çoğunlukla fiziksel bir acil durumdur: kaçar ya da yakalanır. İnsanın stres kaynakları ise çoğu zaman fiziksel olmayan, psikolojik ve toplumsal şeylerdir: iş, ilişkiler, para. Beden bunları da bir aslanmış gibi karşılar ama koşacak bir yer yoktur. Hazırlanan enerji kullanılmaz, alarm açık kalır.</p><p>Kitabın adını veren fark da burada ortaya çıkar. Zebra için stres kısa ve nadirdir, çünkü tehlike gerçekten bittiğinde tepki de biter. İnsanda tehlike kafada yaşadığı için tepki bitmez. Sürekli koşmaya hazırlanıp hiç koşmayan bir beden, zamanla bunun bedelini öder.</p><p>Sapolsky bu bedelin neler olduğunu kitabın geri kalanında ayrıntılarıyla anlatır. Bu bölümün sorusu daha basittir: bedeninizi şu an harekete geçiren şey gerçek bir tehlike mi, yoksa sizin kurduğunuz bir düşünce mi?</p></section><section class=\"s s-lessons\"><h4>lessons <em>48</em></h4><div class=\"lesson\"><b>Alarmı çalıştıranın aslan mı düşünce mi olduğuna bakın.</b> Yarınki toplantıda müşterinin kızacağını düşünen kişinin kalbi bugünden hızlanır. Düşünce gerçek bir tehlikeymiş gibi bedeni harekete geçirir ama koşacak bir yer yoktur. Bunu fark ettiğinizde ortada gerçekten çözülecek bir şey olup olmadığını sorabilir ya da kısa bir yürüyüşle alarmı kapatabilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>15</em></h4><div class=\"ask\">Bugün bedeninizi alarma geçiren şey gerçek bir aslan mıydı, yoksa kafanızda dönen bir düşünce mi?</div></section><section class=\"s s-use\"><h4>use <em>72</em></h4><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Akşam yatağa girince yarınki sunum aklınıza geliyor</p><p class=\"say\">&quot;Kalbim hızlandı ama ortada aslan yok, bu bir düşünce. Yarınki işi sabaha bırakıp nefesimi yavaşlatıyorum.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Eşiniz mali bir kaygıyla geriliyor</p><p class=\"say\">&quot;Sapolsky&#x27;nin zebrası aslan gidince rahatlıyor. Rakamlara birlikte bakalım, bu akşam kapatıp yarın devam edelim.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Ekip arkadaşınız sürekli tetikte görünüyor</p><p class=\"say\">&quot;Son zamanlarda hep gergin görünüyorsun. Bu gerçekten acil bir şey mi, yoksa bir endişe mi? Birlikte ayıralım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>11</em></h4><div class=\"pocket\">Zebra tehlike bitince rahatlar; kafanızdaki aslan için alarmı kendiniz kapatmayı deneyin.</div></section>", "counts": {"open": 24, "story": 231, "lessons": 48, "reflect": 15, "use": 72, "pocket": 11}, "total": 401, "var": "<div class=\"v\"><b>punchline</b> Zebra aslan gidince rahatlar; insan aynı alarmı yalnızca bir düşünceyle günlerce açık tutabilir.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky, savanada aslandan kaçan bir zebrayı anlatır. Kalbi hızlanır, kasları enerji alır, sindirimi durur. Aslan gidince alarm kapanır ve zebra yine otlar. İnsanda ise aynı tepki kira, sınav ya da gelecek düşüncesiyle bile devreye girer ve günlerce kapanmaz. Sapolsky&#x27;ye göre sorun alarmın kendisi değil, tehlike kafada yaşadığı için hiç kapanmamasıdır.</div><div class=\"v\"><b>key_contrast</b> Aslan ya da düşünce</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>23</em></h4><p>Aslan gittikten birkaç dakika sonra zebra yine otluyor. Kalp hızı normale dönmüş, alarm kapanmış. İnsan için aynı alarmı kapatmak neden bu kadar zor?</p></section><section class=\"s s-story\"><h4>story <em>233</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> (1994) kitabına bir zebranın aslan görmesiyle başlar. Vücut o anda acil duruma geçer: kalp hızlanır, kaslara enerji gider, sindirim durur. Tehlike gerçektir ve vücut ona tam zamanında, tam ihtiyaç duyduğu biçimde hazırlanır.</p><p>Zebra kaçabilirse, birkaç dakika içinde sakinleşir ve yine otlamaya döner. Aslan gidince alarm da biter.</p><p>İnsan vücudu aynı acil durum planına sahiptir. Ama insanı harekete geçiren şey çoğu zaman aslan değildir. Kira, sınav ya da uzak bir gelecek hakkında düşünmek bile aynı tepkiyi başlatabilir. Üstelik bu düşünceler günlerce, hatta aylarca sürebilir. Beden düşüncenin gerçek bir aslan mı yoksa bir endişe mi olduğunu ayırt etmeden aynı şekilde hazırlanır.</p><p class=\"hl\">Zebra için stres kısa ve fizikseldir. İnsan için çoğu zaman psikolojik ve sosyaldir, bu yüzden süresi uzar.</p><p>Sorun burada başlar. Beden, koşmadan koşmaya hazırlanır. Kalbi hızlanır, sindirimi yavaşlar, ama ortada kaçılacak bir aslan yoktur. Sapolsky&#x27;ye göre bu hazırlık uzadıkça beden zamanla bir bedel öder. Kitabın adı da bu açıklamaya dayanır: zebra stresini bitirebildiği için ülsere yakalanmaz, insan ise bitiremeyebilir.</p><p>Zebra bu bedeli ödemez, çünkü tehlike bitince kalbi yavaşlar, sindirimi yeniden başlar ve otlamaya döner. İnsan ise tehlike geçmiş olsa bile düşünce geçmedikçe alarmı açık tutar. Fark aslanda değil, alarmı kapatma biçimindedir.</p><p>Bu bakış, sorunun kaynağını değiştirir. Soru artık nasıl daha çok dayanacağınız değil, alarmı neyin çaldığıdır. Tehlike gerçekse alarm işini yapmıştır. Gerçek değilse, yani yalnızca bir düşünceyse, aynı hazırlık hiçbir şeye karşı koruma sağlamadan bedenin kaynaklarını tüketir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>52</em></h4><div class=\"lesson\"><b>Alarmı aslanın mı, düşüncenin mi çaldığına bakın.</b> Yarınki sunum için gece yarısı hâlâ uyuyamayan biri, bedeninin hazırlandığı şeyin gerçek bir tehlike olup olmadığını kendine sorabilir. Cevap yalnızca bir düşünceyse, o gece yapabileceği bir şey kalmamıştır ve alarmı bilerek kapatabilir. Bu, endişeyi yok saymak anlamına gelmez, ona yalnızca sabahtan önce yanıt vermemeyi seçmektir.</div></section><section class=\"s s-reflect\"><h4>reflect <em>19</em></h4><div class=\"ask\">Bugün bedeninizi alarma geçiren şey gerçek bir aslan mıydı, yoksa kafanızdaki bir düşünce mi, ve bu ayrım neyi değiştirirdi?</div></section><section class=\"s s-use\"><h4>use <em>59</em></h4><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Yarınki sunum sizi uyutmuyor</p><p class=\"say\">&quot;Ortada aslan yok, yalnızca bir düşünce var. Yarınki iş sabaha kalsın.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Eşiniz paradan dolayı gergin</p><p class=\"say\">&quot;Zebra aslan gidince sakinleşir. Bu akşam rakamlara bakmayalım, yarın birlikte bakarız.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Bir ekip arkadaşınız sürekli diken üstünde</p><p class=\"say\">&quot;Şu an gerçekten acil bir şey mi var, yoksa içini yiyen bir endişe mi?&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>11</em></h4><div class=\"pocket\">Zebra tehlike geçince alarmı kapatır; kafanızdaki aslan için alarmı siz kapatın.</div></section>", "counts": {"open": 23, "story": 233, "lessons": 52, "reflect": 19, "use": 59, "pocket": 11}, "total": 397, "var": "<div class=\"v\"><b>punchline</b> Zebra aslan gidince alarmı kapatır, insan ise tek bir düşünceyle aynı alarmı günlerce açık tutabilir.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky kitabına bir zebranın aslandan kaçışıyla başlar. Zebranın kalbi hızlanır, kaslarına enerji gider, sindirimi durur. Kaçınca sakinleşir ve yine otlar. İnsan aynı tepkiyi kira ya da sınav gibi düşüncelerle de tetikleyebilir ve bu düşünceler günlerce sürebilir. Fark, alarmın kapanıp kapanmamasındadır.</div><div class=\"v\"><b>key_contrast</b> Aslan ya da düşünce</div>"}}, {"id": 1789, "title": "Bedenin Yakıtı Yanlış Yere Akınca", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>30</em></h4><p>Beyin tehlike algıladığı anda beden, o an gerekmeyen her şeyi kapatmaya başlar: sindirimi, büyümeyi, üremeyi. Robert Sapolsky bu düzeni bir kaynak yönetimi olarak anlatır ve asıl tehlikeyi kapatma tuşunda arar.</p></section><section class=\"s s-story\"><h4>story <em>246</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> kitabında stres tepkisini bir kaynak yönetimi olarak anlatır. Beyin bir tehlike algıladığında adrenalin ve kortizol salgılanır. Kalp hızlanır, kaslara şeker ve yağ gönderilir, tansiyon yükselir.</p><p>Tepkinin bir hızlı, bir de daha yavaş kolu vardır. Adrenalin saniyeler içinde devreye girer. Kortizol biraz sonra gelir ve daha uzun süre etkili olur.</p><p>Aynı anda beden uzun vadeli işleri askıya alır. Sindirim yavaşlar, büyüme ve üreme ile ilgili süreçler bekler, bağışıklık sisteminin bazı işleri geriye çekilir. Mantığı açıktır: kaçarken yemek sindirmenin ya da dokuyu onarmanın sırası değildir. Kısa bir kaçış için bu düzen çok verimlidir, çünkü enerjinin tamamı acil işe yönelir.</p><p class=\"hl\">Asıl sorun, sistemin kapanmayıp haftalarca açık kalmasıdır.</p><p>Sapolsky bu durumun nasıl yıpratıcı hâle geldiğini adım adım gösterir. Uzun süre yüksek kalan stres hormonları tansiyonu ve kalp-damar sistemini zorlar, bağışıklığı zayıflatır, hafızayla ilişkili beyin bölgelerini etkiler ve sindirimi bozar. Bu zararların her biri, o an ertelenmesi mantıklı olan işlerin aylarca ertelenmesinden doğar.</p><p>Sağlık sorunlarının çoğu bu yavaş birikimden gelir: tek bir büyük darbeden değil, her gün biraz daha ertelenen onarımlardan.</p><p>Sapolsky&#x27;nin savı şudur: stresle ilişkili hastalıkların çoğu, tepkinin kendisinden değil, onun gereğinden uzun süre açık kalmasından doğar. Tansiyonun kaçış anında yükselmesi akıllıca bir hamledir. Aynı yükseklik yıllarca sürdüğünde damarlar zorlanır. Savunma, saldıran bir güce dönüşür.</p><p>Bu yüzden Sapolsky stresin kendisini düşman olarak sunmaz. Kısa süreli stres hayat kurtarır. Zarar veren, kapatma düğmesine hiç basılmamasıdır. Bugünkü hayatta düğmeyi açık tutan şey çoğunlukla bir aslan olmaz, bitmeyen küçük baskılar olur: iş yükü, belirsizlik, uykusuz geceler.</p></section><section class=\"s s-lessons\"><h4>lessons <em>44</em></h4><div class=\"lesson\"><b>Ertelediğiniz onarımlar bir gün sıraya gelir.</b> Aylarca yoğun çalışan bir esnaf bu süre boyunca uykusunu, düzenli yemeğini ve hastayken dinlenmeyi erteler. Bunlar bedenin onarım işleridir ve yoğunluk geçmeden yapılmazlar. Bunu bildiğinizde uzun süren bir yoğunluğun içinde bile bir onarım işine küçük bir yer açabilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>9</em></h4><div class=\"ask\">Sürekli acil durum modundaysanız bedeniniz hangi onarımı erteliyor olabilir?</div></section><section class=\"s s-use\"><h4>use <em>67</em></h4><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Haftalardır yeterince uyuyamıyorsunuz</p><p class=\"say\">&quot;Beden acil durumda onarımı erteliyor. Bu hafta iki akşam uykuya öncelik veriyorum, gerisi sıraya girsin.&quot;</p></div><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekip aylardır sürekli yetiştirme modunda</p><p class=\"say\">&quot;Sürekli acil durum herkesin onarımını erteliyor. Bu teslimden sonra bir hafta yeni iş almayalım, toparlanalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Yakınınız yoğunluktan sürekli hasta oluyor</p><p class=\"say\">&quot;Yoğunluk bitmiyor diye bedenin toparlanmasına yer bırakmamak zor. Bu hafta sonu hiçbir plan yapmayalım, dinlenelim.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>9</em></h4><div class=\"pocket\">Stres alarmı hayat kurtarır; kapatmayı unuttuğunuz alarm onarımları erteler.</div></section>", "counts": {"open": 30, "story": 246, "lessons": 44, "reflect": 9, "use": 67, "pocket": 9}, "total": 405, "var": "<div class=\"v\"><b>punchline</b> Sapolsky&#x27;ye göre stres alarmı hayat kurtarır; zarar veren alarmın çalması değil, kapanmamasıdır.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky stres tepkisini bir kaynak yönetimi olarak anlatır. Tehlike algılanınca adrenalin ve kortizol salgılanır, kalp hızlanır, kaslara enerji gider. Aynı anda sindirim, büyüme ve onarım gibi uzun vadeli işler askıya alınır. Kısa bir kaçış için bu mükemmeldir. Haftalarca açık kaldığında ise tansiyon, bağışıklık ve hafıza yıpranır.</div><div class=\"v\"><b>key_contrast</b> Alarm ve onarım</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>23</em></h4><p>Tehlike sezildiği anda beden sindirimi durdurur, büyümeyi ve üremeyi bekletir. Robert Sapolsky&#x27;ye göre bu ani vazgeçişler, uzun sürdüğünde sağlığın en pahalı kalemi olur.</p></section><section class=\"s s-story\"><h4>story <em>240</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> (1994) kitabında stres tepkisini bir kaynak yönetimi olarak anlatır. Beyin tehlike sezdiğinde adrenalin ve kortizol salgılanır. Kalp hızlanır, kaslara şeker ve yağ gönderilir, tansiyon yükselir. Beden kaçmaya ya da dövüşmeye hazırlanır. Burada enerji sınırlıdır ve önce şimdiye harcanır, gelecek beklemeye alınır.</p><p>Bu hazırlığın bir bedeli vardır. Uzun vadeli işler ertelenir: sindirim yavaşlar, büyüme ve üreme beklemeye alınır, bağışıklık sisteminin bazı işlevleri geri plana itilir. Beden, şu an hayatta kalmak için gerekmeyen her şeyi askıya alır. Bu bir arıza değil, bilinçsiz bir önceliklendirmedir: kalbin ve kasların işi ilk sıraya, yarının işleri son sıraya geçer.</p><p>İki hormonun hızı farklıdır. Adrenalin saniyeler içinde devreye girer. Kortizol biraz sonra gelir ve daha uzun süre etkisini sürdürür. Kısa bir kaçış için bu düzen verimlidir, çünkü tehlike geçince sistem kapanır ve ertelenen işlere dönülür. Birkaç dakikalık bir kovalamaca beden için yönetilebilir bir harcamadır.</p><p class=\"hl\">Sorun, bu sistemin haftalarca açık kalmasıdır.</p><p>Sapolsky&#x27;ye göre stres hormonlarının uzun süre yüksek kalması damarlar ve tansiyon üzerinde baskı yapmakla, bağışıklığın zayıflamasıyla, bellekle ilgili beyin bölgelerinin ve sindirimin etkilenmesiyle ilişkilidir. Bunların her biri, tehlike sırasında ertelenen bir işin bedelidir.</p><p>Bu yüzden Sapolsky stresle ilgili hastalıkların çoğunu tepkinin kendisine değil, süresine bağlar. Aynı mekanizma kovalamaca sırasında hayat kurtarır. Kapanmadığında ise o sırada ertelenen onarımlar sırasını bekler.</p><p>Kitabın bakış açısı alarmı suçlamaz. Alarm işini yapar. Asıl soru, ne zaman kapanacağıdır. Kısa süreli bir alarm beden için sıradan bir olaydır. Haftalarca süren bir alarmda ise ertelenen her iş birikir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>61</em></h4><div class=\"lesson\"><b>Ertelenen onarımlar eninde sonunda sıraya girer.</b> Aylardır akşam geç saatlere kadar çalışan bir muhasebeci, bedeninin o sırada yapmadığı bakımları bir sabah yorgunluk ya da sık hastalık olarak geri alır. Sürekli acil durumda yaşayan bir sistem, uyku ve dinlenme gibi onarım işlerini her zaman bir sonraki haftaya bırakır. Bu yüzden iyileşmeyi, işlerin bittiği bir günden sonraya değil, o haftanın içine yazmak gerekir.</div></section><section class=\"s s-reflect\"><h4>reflect <em>12</em></h4><div class=\"ask\">Bedeniniz sürekli acil durum modundaysa, hangi onarımları sizin için sonraya bırakıyor olabilir?</div></section><section class=\"s s-use\"><h4>use <em>63</em></h4><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Haftalardır az uyuyorsunuz</p><p class=\"say\">&quot;Beden acil durumda onarımları erteliyor. Bu hafta iki akşam uykuyu işin önüne koyuyorum.&quot;</p></div><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekip aylardır acele modunda çalışıyor</p><p class=\"say\">&quot;Bu teslimattan sonra bir hafta yeni iş almayalım. Aylardır koşuyoruz, ertelenen şeylerin toparlanması lazım.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Yoğun bir dönemde bir yakınınız sürekli hastalanıyor</p><p class=\"say\">&quot;Bu hafta sonu hiçbir planımız olmasın. Beden bir süre dinlenmeye ihtiyaç duyuyor.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>10</em></h4><div class=\"pocket\">Stres alarmı kovalamacada hayat kurtarır; kapatmayı unuttuğunuz alarm onarımları erteler.</div></section>", "counts": {"open": 23, "story": 240, "lessons": 61, "reflect": 12, "use": 63, "pocket": 10}, "total": 409, "var": "<div class=\"v\"><b>punchline</b> Sapolsky&#x27;ye göre zarar, stres alarmının çalmasından değil, bir türlü kapanmamasından gelir.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky stresi kaynak yönetimi olarak anlatır. Tehlike anında kalp hızlanır, kaslara enerji gider, sindirim, büyüme ve bazı onarımlar ertelenir. Kısa bir kaçış için bu çok verimlidir. Ama sistem haftalarca açık kalırsa damarlar, bağışıklık, bellek ve sindirim bunun bedelini öder.</div><div class=\"v\"><b>key_contrast</b> Alarm ve onarım</div>"}}, {"id": 1790, "title": "Serengeti'de Bir Pavyan Sürüsü", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>16</em></h4><p>Robert Sapolsky yazlarını Doğu Afrika&#x27;da yabani pavyan sürülerini izleyerek geçirdi. Bu hayvanları aslanlar değil, birbirleri yoruyordu.</p></section><section class=\"s s-story\"><h4>story <em>230</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> kitabında laboratuvardan çok sahada geçen bir araştırmasını anlatır. Yıllarca yazlarını Doğu Afrika&#x27;da yabani pavyan sürülerini izleyerek geçirdi. Pavyanlar günün büyük kısmını yiyecek aramak ve dinlenmekle geçirir. Gündelik gerilimlerinin çoğu, sürüdeki diğer hayvanlardan gelir.</p><p>Sapolsky sürüde kimin kime baskı kurduğunu, kimin kimden kaçtığını gözlemledi. Aynı hayvanların kanındaki stres hormonlarını da ölçtü.</p><p class=\"hl\">Pek çok durumda tablo şuydu: hiyerarşinin altındaki erkekler, peşlerinde hiçbir aslan olmasa bile daha yüksek stres hormonu taşıyordu.</p><p>Sürekli tetikte olmak, baskı görmek ve kontrolün başkasında olması bedene bir bedel yazıyordu. Ama Sapolsky basit bir &quot;alttakiler hep yıpranır&quot; tablosu çizmedi. Rütbenin kendisi kadar, o rütbenin nasıl yaşandığı önemliydi. Sürünün düzeninin istikrarlı olup olmaması, hayvanın gerçek bir tehditle zararsız bir hareketi ayırt edebilmesi, gerginliğini bir başkasına boşaltabilmesi ve sosyal bağlarının bulunması stres hormonu düzeyini etkiliyordu.</p><p>Aynı konumdaki iki pavyan çok farklı bir yük taşıyabiliyordu. Bu gözlem, Sapolsky&#x27;nin insanlarla ilgili anlattıklarının da arka planını kurar. Sapolsky bunu doğrudan insana taşımaz ama benzer örüntüleri insanlarda da arar: yıpratan çoğu zaman ünvan ya da basamak olmaz, o konumun nasıl deneyimlendiği olur.</p><p>Sapolsky&#x27;nin gözlemlerine göre bazı hayvanlar yenildikten sonra gerginliklerini kendilerinden alttaki bir hayvana yöneltiyordu ve bunu yapabilenlerin stres hormonu daha düşük çıkıyordu. Başkaları ise tımar yoluyla başka hayvanlarla yakınlık kuruyordu. Yani aynı sürü içinde gerginlikle baş etmenin birden fazla yolu vardı, ve her hayvan bunlardan aynı ölçüde yararlanamıyordu.</p><p>Kontrol, öngörülebilirlik ve destek duygusu, aynı basamağın yükünü hafifletebilir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>48</em></h4><div class=\"lesson\"><b>Konumunuzdan çok o konumda nasıl yaşadığınız yıpratır.</b> İki kişi aynı yoğun serviste çalışabilir; birinin yanında güvendiği bir iş arkadaşı vardır, diğeri her vardiyada yalnızdır. Aynı yük birinde hafifler, ötekinde ağırlaşır. Bunu bildiğinizde ünvanınızı ya da yoğunluğunuzu hemen değiştiremeseniz bile güvendiğiniz biriyle konuşmak gibi küçük bir çıkış yolu açabilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>15</em></h4><div class=\"ask\">Kendi sürünüzde gerginliğinizi boşaltabildiğiniz ve güvendiğiniz biri var mı, yoksa hepsini tek başınıza mı taşıyorsunuz?</div></section><section class=\"s s-use\"><h4>use <em>63</em></h4><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Ekibinizden biri sürekli gergin görünüyor</p><p class=\"say\">&quot;Bu işi taşımak kolay değil. Bu ekipte gerginliğini boşaltabildiğin, güvendiğin biri var mı?&quot;</p></div><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Yeni kurallarla ekip belirsizlik yaşıyor</p><p class=\"say\">&quot;Sapolsky&#x27;nin pavyanlarında istikrarsız düzen stres yaratıyordu. Hangi kararın kimde olduğunu yazalım, herkes ne beklediğini bilsin.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Arkadaşınız yoğunluktan yakınıyor</p><p class=\"say\">&quot;Yük ağır, görüyorum. Bu hafta bir akşam yürüyüşe çıkıp sadece konuşsak ister misin?&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Aynı yük, yanınızda güvendiğiniz biri olunca daha hafiftir; bu hafta o insanı arayın.</div></section>", "counts": {"open": 16, "story": 230, "lessons": 48, "reflect": 15, "use": 63, "pocket": 13}, "total": 385, "var": "<div class=\"v\"><b>punchline</b> Sapolsky&#x27;nin pavyanlarını aslanlar değil, birbirleri yoruyordu.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky yıllarca yazlarını Doğu Afrika&#x27;da yabani pavyanları izleyerek geçirdi ve hayvanların stres hormonlarını ölçtü. Sürünün altındaki erkeklerde hormon çoğu zaman daha yüksekti, hiçbir aslan peşlerinde olmasa bile. Ama rütbe tek başına belirleyici değildi. Düzenin istikrarı, gerginliği boşaltabilmek ve sosyal bağlar da fark yaratıyordu.</div><div class=\"v\"><b>key_contrast</b> Rütbe ve yaşanış</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>20</em></h4><p>Yabani babunların etrafında aslan yoktu, yine de bazılarının kanında stres hormonu fazlaydı. Sapolsky bunun nedenini yıllarca yaz aylarında izleyerek aradı.</p></section><section class=\"s s-story\"><h4>story <em>230</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> (1994) kitabında Doğu Afrika&#x27;da yıllarca yaz aylarını yabani babunları izleyerek geçirdiğini anlatır. Babunlar günün çoğunu yiyecek arayarak ve dinlenerek geçirir, yani gün aslında sakin akar. Günlük gerilimin büyük kısmı ise aslanlardan değil, diğer babunlardan gelir.</p><p>Sapolsky uzun süre kimin kime baskı yaptığını izledi ve aynı hayvanların stres hormonlarını ölçtü. Birçok durumda hiyerarşide alt sıralarda olan erkeklerin stres hormonu düzeyi daha yüksekti. Bu, babun topluluğunda kimin kime baskı kurduğuna bakınca anlaşılır bir tablodur: alt sıradaki hayvan her gün üstündekilerle yüzleşir. Ortada bir aslan olmadığı hâlde, rütbesi düşük olanlar daha fazla yük taşıyordu.</p><p class=\"hl\">Ama rütbe tek başına belirleyici değildi.</p><p>Hiyerarşinin ne kadar kararlı olduğu, hayvanın gerçek bir tehdidi zararsız bir olaydan ayırabilmesi (ona yönelen her hareket saldırı değildir), gerilimi boşaltabileceği yollar ve sosyal bağları da önemliydi. Bazı babunlar gerilimlerini kendilerinden daha alt sıradakilere yönlendirir ve bu sayede daha düşük hormon düzeyleri taşırdı. Bazıları ise bakım yaparak, yani birbirinin tüyünü temizleyerek yakınlık kurardı.</p><p>Sapolsky&#x27;nin gördüğü şey, aynı konumda duran iki babunun çok farklı yükler taşıyabilmesidir. İkisi de aynı basamakta durur, ama biri çok daha yorgun olabilir.</p><p>Bu bulgular rütbenin önemsiz olduğu anlamına gelmez. Birçok durumda düşük rütbe daha fazla stres demektir. Ama konumu yaşama biçimi, konumun kendisinden daha çok şey söyler. Kararlı bir düzen, tehditleri ayırt etme yeteneği ve rahatlama yolları aynı yükün daha hafif taşınmasını sağlar. Sapolsky&#x27;nin ölçümleri bu farkı doğrudan hayvanların hormon düzeyinde gösterir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>43</em></h4><div class=\"lesson\"><b>Konumunuzdan çok, o konumu nasıl yaşadığınıza bakın.</b> Aynı kademede çalışan iki kişiden birinin yanında dertleşebileceği bir iş arkadaşı vardır, ötekinin yoktur. Yük aynıdır, ama ilkinin gün sonunda omzu daha hafiftir. Gerilimi paylaşabileceğiniz bir kişi bulmak, işinizi küçültmeden onu taşımanın en kolay yollarından biridir.</div></section><section class=\"s s-reflect\"><h4>reflect <em>15</em></h4><div class=\"ask\">Gerilimi birine boşaltabildiğiniz biri var mı, yoksa her şeyi şu sıralar tek başınıza mı taşıyorsunuz?</div></section><section class=\"s s-use\"><h4>use <em>61</em></h4><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Ekipten biri sürekli gergin görünüyor</p><p class=\"say\">&quot;Ekipte derdini rahatça anlatabildiğin biri var mı? Böyle zamanlarda yanında biri olması çok şey değiştiriyor.&quot;</p></div><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Yeni kurallar ekipte belirsizlik yaratıyor</p><p class=\"say\">&quot;Kimin neye karar verdiğini yazalım. Sapolsky&#x27;nin babunlarında hiyerarşi belirsizleşince gerilim artıyordu.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Bir arkadaşınız iş yükünden yakınıyor</p><p class=\"say\">&quot;Bu akşam yürüyüşe çıkalım mı? Çözüm aramak zorunda değiliz, sadece konuşalım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>12</em></h4><div class=\"pocket\">Aynı yük, yanında güvendiğiniz biri varken hafifler; bu hafta o kişiyi arayın.</div></section>", "counts": {"open": 20, "story": 230, "lessons": 43, "reflect": 15, "use": 61, "pocket": 12}, "total": 381, "var": "<div class=\"v\"><b>punchline</b> Sapolsky&#x27;nin babunlarını yoran şey aslanlar değil, birbirleriydi.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky yıllarca Doğu Afrika&#x27;da yabani babunları izledi ve stres hormonlarını ölçtü. Birçok durumda alt sıradaki erkeklerin hormon düzeyi yüksekti, ama rütbe tek başına belirleyici değildi. Hiyerarşinin kararlılığı, gerilimi boşaltma yolları ve sosyal bağlar da önemliydi. Aynı konumdaki iki babun çok farklı yükler taşıyabiliyordu.</div><div class=\"v\"><b>key_contrast</b> Rütbe ve yaşanış</div>"}}, {"id": 1791, "title": "Aynı Elektrik, İki Farklı Sıçan", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>26</em></h4><p>İki sıçana aynı şok, aynı sıklıkta veriliyor. Yalnızca birine şoktan önce bir uyarı işareti geliyor. Sapolsky&#x27;ye göre bu küçük fark, hangisinin bedeninin daha çok yıpranacağını belirliyor.</p></section><section class=\"s s-story\"><h4>story <em>247</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> kitabında stresin ağırlığını şoktan çok şokun etrafındaki koşullara bağlayan bir deneyi anlatır. İki sıçana aynı şiddette elektrik şoku, aynı sıklıkta verilir. Fiziksel olarak yaşadıkları aynıdır. Tek fark, birinin şoktan önce bir uyarı işareti alması, ötekinin hiçbir şey duymadan şoka yakalanmasıdır.</p><p class=\"hl\">Uyarı alan sıçan, uyarı almayana göre belirgin biçimde daha az ülser geliştirir.</p><p>Deneyin değeri, olayın kendisini sabit tutmasıdır. Şokun sayısı ve şiddeti iki hayvanda aynı olduğu için fark yalnızca hayvanın yaşadığı koşuldan gelir. Sapolsky bunun insanlarda da böyle olabileceğini düşünür: aynı iş yükü iki kişiyi farklı biçimde yıpratabilir.</p><p>Şok aynıdır ama öngörülebilirlik farklıdır. Şokun ne zaman geleceğini bilen hayvan, aradaki zamanlarda gevşeyebilir. Uyarı alamayan hayvan ise sürekli bir sonraki şoku bekler ve bedeni bu bekleyişle yıpranır.</p><p>Sapolsky benzer deneyleri bir araya getirerek stresin ağırlığını belirleyen birkaç etken sayar. Olayın ne kadar öngörülebilir olduğu, üzerinde kontrol olduğu duygusu ve gerginliği boşaltacak bir çıkış bunların başındadır. Durumun daha kötüye gitmediği hissi ve sosyal destek de listeye girer.</p><p>Sapolsky bu bulguyu önemli bir ayrıma bağlar. Gerçek bir tehdit karşısında alarmın açılması yerindedir. Yıpratan olan, tehdit gelmediği zamanlarda da sürekli gelecekmiş gibi beklemektir. Öngörülebilirlik bu beklemeyi kısaltır. Uyarı işareti, şokun gelmediği zamanlarda hayvana güvenli bir alan tanır.</p><p>Bu etkenlerin her biri aynı olayı hafifletebilir. Kitabın gösterdiği, yükün büyüklüğü kadar bedenin o yük karşısında ne kadar hazırlıksız ve çaresiz kaldığıdır. Bir deney hayvanına çevirebileceği bir tekerlek verildiğinde ya da bir insana işini ne zaman yapacağına kendisinin karar verdiği söylendiğinde, aynı yük daha az yıpratıcı olabilir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>54</em></h4><div class=\"lesson\"><b>Belirsizliği küçültmek yükü hafifletir.</b> Bir terzi müşterinin elbiseyi hangi gün isteyeceğini biliyorsa o güne kadar rahat çalışır; &quot;bir gün gelir&quot; denirse her kapı çalışında gerilir. Aynı işi tarihi netleşmiş hâlde yapan kişi, aynı yükü daha az yıpranarak taşır. Kendi işinize bir tarih, bir ön uyarı ya da küçük bir karar alanı eklemek gerginliği azaltabilir.</div></section><section class=\"s s-reflect\"><h4>reflect <em>18</em></h4><div class=\"ask\">Sizi en çok yoran durumda gerçekten çaresiz misiniz, yoksa küçük bir kontrol ya da öngörü alanı açabilir misiniz?</div></section><section class=\"s s-use\"><h4>use <em>70</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Teslim tarihi sürekli belirsiz kalıyor</p><p class=\"say\">&quot;Sıçan deneyindeki fark bir uyarı işaretiydi. Bize de bir tarih lazım: teslim ne zaman, değişirse kim haber verecek?&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Çocuğunuz yarınki sınavdan korkuyor</p><p class=\"say\">&quot;Önce neyi bildiğimizi netleştirelim: sınav kaçta, ne çıkabilir, sen neyi çalıştın? Bilinmeyen azalınca korku da azalır.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Bir sonuç beklerken geriliyorsunuz</p><p class=\"say\">&quot;Sonucun ne zaman çıkacağını öğrenip o güne kadar kendi elimde olan iki şeyi yazacağım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>14</em></h4><div class=\"pocket\">Şok aynıyken uyarı alan sıçanın ülseri azdı; belirsiz işlerinize bir tarih ve uyarı ekleyin.</div></section>", "counts": {"open": 26, "story": 247, "lessons": 54, "reflect": 18, "use": 70, "pocket": 14}, "total": 429, "var": "<div class=\"v\"><b>punchline</b> İki sıçan aynı şoku yedi, ama şoku önceden bilenin ülseri çok daha azdı.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky iki sıçanın aynı şiddette ve sıklıkta elektrik şoku aldığı bir deneyi anlatır. Tek fark, birinin şoktan önce uyarı alması. Uyarı alan sıçan belirgin biçimde daha az ülser geliştirir. Sapolsky&#x27;ye göre bedeni yıpratan yalnızca olay değil, o olayın ne kadar öngörülebilir, kontrol edilebilir ve boşaltılabilir olduğudur.</div><div class=\"v\"><b>key_contrast</b> Şok ve öngörü</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>20</em></h4><p>İki sıçan, aynı şiddette ve aynı sıklıkta elektrik şoku alıyor. Yalnızca birinin kulağına, her şoktan önce bir uyarı sesi geliyor.</p></section><section class=\"s s-story\"><h4>story <em>238</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> (1994) kitabında stresle ilgili bir deneyi anlatır. İki sıçana aynı şiddette ve aynı sıklıkta elektrik şoku verilir. Fark yalnızca tek bir ayrıntıdadır: sıçanlardan biri her şoktan önce bir uyarı sinyali duyar, ötekine hiçbir işaret verilmez.</p><p>Sonuç dikkat çekicidir. Uyarı alan sıçanda belirgin biçimde daha az ülser gelişir. Şokların şiddeti de sıklığı da iki sıçan için aynıdır, yani fark yükün büyüklüğünde ya da sayısında değildir. Fark yalnızca birinin şokun ne zaman geleceğini bilmesidir.</p><p class=\"hl\">Aynı şoku öngörebilen sıçan, öngöremeyene göre çok daha az ülser geliştirdi.</p><p>Uyarı sinyali, hayvana şoklar arasında güvenli bir dönem kazandırır. Sinyal gelmediği sürece rahat edebilir. Sinyal almayan sıçanın ise böyle bir sığınağı yoktur, çünkü şokun ne zaman geleceğini bilemez. Öngörü, yükü ortadan kaldırmaz, ama yükün bedenden geçtiği süreyi daraltır.</p><p>Sapolsky bu deneyden yola çıkarak bir yükün ne kadar ağır hissedileceğini belirleyen etkenleri sıralar. Öngörülebilirlik bunların ilkidir. Ardından bir kontrol duygusu, hayal kırıklığını boşaltabileceğiniz bir çıkış yolu, sosyal destek ve işlerin daha da kötüye gitmediği hissi gelir.</p><p>Aynı yük bu etkenlerden biri eklendiğinde hafifler, çünkü beden yükü karşılayabilecek bir dayanak bulur. Bir sıçana koşabileceği bir tekerlek ya da kemirebileceği bir şey verildiğinde, aynı şok daha kolay taşınır. İnsanlarda ise bazen işin zamanlamasını kendisi belirleyebilmek aynı işi daha dayanılır kılar, çünkü ne zaman başlayıp biteceği kişinin elindedir.</p><p>Yani stres yalnızca yükün büyüklüğüyle ölçülmez. Aynı yükün ne zaman geleceğini, onu nasıl karşılayacağınızı ve yanınızda kimin olduğunu bilmek, bedenin ödeyeceği bedeli de değiştirir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>55</em></h4><div class=\"lesson\"><b>Belirsizliği azaltmak yükü hafifletir.</b> Sonuç açıklanacak diye günlerce bekleyen biri, açıklanma gününü öğrendiği anda bir miktar rahatlar, çünkü bekleyişin sonu belli olmuştur. İşin kendisi aynı kalır, ama artık her an gelebilecek bir şey için tetikte durmak zorunda değildir. Bu yüzden kendi işlerinizde de tarih, sıra ve uyarı gibi küçük işaretler eklemek, işi küçültmeden gerginliği düşürür.</div></section><section class=\"s s-reflect\"><h4>reflect <em>21</em></h4><div class=\"ask\">Sizi en çok yoran durumda gerçekten çaresiz misiniz, yoksa küçük bir öngörü ya da kontrol alanı açabileceğiniz bir yer var mı?</div></section><section class=\"s s-use\"><h4>use <em>65</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Teslim tarihleri hep belirsiz kalıyor</p><p class=\"say\">&quot;Uyarı alan sıçan daha az ülser geliştirmiş. Bize de bir tarih ve değişirse kimin haber vereceği lazım.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Çocuğunuz yarınki sınavdan korkuyor</p><p class=\"say\">&quot;Bildiklerimizi yazalım: saat kaçta, hangi konular, neleri çalıştın. Belirsiz kalan kısım küçülsün.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Bir sonucu bekliyorsunuz</p><p class=\"say\">&quot;Sonucun ne zaman geleceğini öğreneyim. O zamana kadar elimde olan iki işi yazıp onlara bakacağım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>14</em></h4><div class=\"pocket\">Uyarılan sıçan daha az ülser geliştirdi; belirsiz işlere bir tarih ve bir uyarı ekleyin.</div></section>", "counts": {"open": 20, "story": 238, "lessons": 55, "reflect": 21, "use": 65, "pocket": 14}, "total": 413, "var": "<div class=\"v\"><b>punchline</b> İki sıçan aynı şoku aldı, ama şoktan önce uyarı duyan sıçan çok daha az ülser geliştirdi.</div><div class=\"v\"><b>thirty_sec</b> Sapolsky&#x27;nin anlattığı deneyde iki sıçana aynı şiddette ve sıklıkta elektrik şoku verilir. Yalnızca birine her şoktan önce bir uyarı sesi gelir. O sıçanda belirgin biçimde daha az ülser gelişir. Sapolsky buradan yola çıkıp öngörülebilirliğin, kontrol duygusunun, bir çıkış yolunun ve sosyal desteğin yükü hafiflettiğini söyler.</div><div class=\"v\"><b>key_contrast</b> Şok ve öngörü</div>"}}, {"id": 1792, "title": "Barışı Öğrenen Sürü", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>18</em></h4><p>Bir pavyan sürüsünün en saldırgan erkekleri aynı hastalıktan öldü. Geride kalan sürü, Robert Sapolsky&#x27;nin beklemediği bir yöne gitti.</p></section><section class=\"s s-story\"><h4>story <em>261</em></h4><p>Robert Sapolsky, Doğu Afrika&#x27;da yıllarca izlediği Orman Sürüsü adlı bir pavyan grubunu anlatır. Her pavyan sürüsü gibi bu grubu da en saldırgan erkekler yönetiyordu. Alttakilerin hayatı zordu.</p><p>Önceki düzende üst sıradakilerin alttakilere saldırması sıradan bir olaydı ve alttakiler bu yükü bedenlerinde taşıyordu. Sapolsky bunu o yıllarda sürünün normali olarak gözlemliyordu.</p><p>Sonra beklenmedik bir şey oldu. Sürünün yakınındaki bir turist lokantasının çöplüğünde bulaşmış et vardı. Bu etle beslenen en saldırgan erkekler tüberküloza yakalanıp öldü. Geride daha yumuşak huylu erkekler ve dişiler kaldı.</p><p class=\"hl\">Sürünün tarzı değişti: daha az zorbalık, daha çok tımarlaşma, daha az gerginlik.</p><p>Dikkat çekici olan bu değişimin kalıcı olmasıydı. Sürüye dışarıdan yeni erkekler katıldığında bile bu erkekler zamanla sürünün sakin düzenine uyum sağladı. Alttaki bireylerin ölçülen stres hormonları da düştü. Yani değişim davranıştan bedene kadar indi.</p><p>Alttaki bireyler için bunun anlamı basitti: günün içinde daha az tehdit, daha çok dinlenme ve temas. Sapolsky, değişimin hormon ölçümlerinde de görünmesini önemli bulur, çünkü bu, davranıştaki değişimin bedene de ulaştığını gösterir.</p><p>Sapolsky&#x27;nin bundan çıkardığı sonuç, kitabın en umut verici fikirlerinden biridir: bir grubun stres düzeyi biyolojik bir kader değildir. Grubun kültürü değişebilir ve bu değişim bireylerin bedenindeki yükü de değiştirir.</p><p>Bu bir deney değil, rastlantının yarattığı bir durumdur. Sapolsky tek bir sürüyü yıllar içinde izlemiştir ve benzer bir olayı isteyerek üretmek mümkün değildir. Bu yüzden hikâye kesin bir kural değil, bir olasılık gösterir: sürünün tarzı, içindeki bireylerin tek tek biyolojisinden bağımsız biçimde değişebilir.</p><p>Sapolsky bunu insan toplulukları için doğrudan bir tarif gibi sunmaz. Yine de pavyanların hikâyesi, gerginliğin yalnızca bireyin karakterinden değil, çevresindeki toplumsal düzenden de beslendiğini gösterir. Düzen değişince beden de değişir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>47</em></h4><div class=\"lesson\"><b>Bir grubun gerginlik düzeyi öğrenilmiş bir kültürdür.</b> Bir mutfakta şef sürekli bağırıyorsa herkes kendi rolünü korkuyla oynar. Şef değişince ya da biri yeni bir tavır başlatınca aynı mutfak daha sakin çalışabilir. Bunu bildiğinizde bulunduğunuz grubun tonunu sabit saymak yerine, kendi payınıza düşen küçük bir tavır değişikliğini seçebilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>11</em></h4><div class=\"ask\">İçinde bulunduğunuz grupta gerginliği azaltan küçük bir alışkanlığı siz başlatabilir misiniz?</div></section><section class=\"s s-use\"><h4>use <em>66</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Toplantılar hep gergin geçiyor</p><p class=\"say\">&quot;Pavyan sürüsü saldırgan erkekler gidince sakinleşti. Bu hafta herkes konuşmadan önce bir şey için teşekkür etsin, tonu deneyelim.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Evde herkes sinirli</p><p class=\"say\">&quot;Akşam yemeğinde telefonları kaldıralım ve herkes günün iyi geçen bir yanını anlatsın. Bir hafta deneyip bakalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Arkadaş grubunda dedikodu yayılıyor</p><p class=\"say\">&quot;Geçen sefer konuşulanlar bana iyi gelmedi. Bu akşam başka bir şeyden konuşsak?&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>11</em></h4><div class=\"pocket\">Sürünün tarzı değişebildi; bulunduğunuz grupta gerginliği düşüren ilk adımı siz atın.</div></section>", "counts": {"open": 18, "story": 261, "lessons": 47, "reflect": 11, "use": 66, "pocket": 11}, "total": 414, "var": "<div class=\"v\"><b>punchline</b> Bir pavyan sürüsünün en saldırgan erkekleri hastalıktan ölünce geriye kalan sürü sakinleşti ve bu sakinlik yıllarca sürdü.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky&#x27;nin izlediği Orman Sürüsü&#x27;nde en saldırgan erkekler bulaşmış etten tüberküloza yakalanıp öldü. Geriye daha yumuşak huylu erkekler ve dişiler kaldı. Zorbalık azaldı, tımarlaşma arttı. Sürüye sonradan katılan erkekler de bu sakin düzene uydu ve alttakilerin stres hormonları düştü. Sapolsky için bu, stres kültürünün bir kader olmadığını gösterir.</div><div class=\"v\"><b>key_contrast</b> Kader değil kültür</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>18</em></h4><p>Bir babun sürüsünün en saldırgan erkekleri aynı hastalıktan öldü. Geriye kalanların sürüyü nasıl yaşattığı, yıllar sonra bile hatırlandı.</p></section><section class=\"s s-story\"><h4>story <em>230</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> (1994) kitabında Orman Sürüsü adını verdiği bir babun grubunu yıllarca izlediğini anlatır. Bu uzun gözlem sayesinde olayın öncesini ve sonrasını karşılaştırabildi. Doğu Afrika&#x27;daki bu grup, çoğu sürü gibi en saldırgan erkekler tarafından yönetiliyordu. Onlar alt sıradakilerin hayatını zorlaştırıyordu ve sürünün genel havasını da belirliyordu.</p><p>Sonra sürünün en saldırgan erkekleri, bir turist lokantasının çöplüğünden aldıkları bozuk etle beslendi ve tüberkülozdan öldü. Geriye kalan erkekler ve dişiler daha yumuşak huyluydu. Yani sürünün en çok baskı kuran üyeleri bir anda ortadan kalkmıştı.</p><p class=\"hl\">Sürünün tarzı değişti ve değişmiş olarak kaldı.</p><p>Zorbalık azaldı, birbirinin tüyünü temizleme çoğaldı, gerilim düştü. Bu sakin kültür saldırgan erkekler gittikten sonra da sürdü. Sürüye sonradan katılan yeni erkekler de zamanla aynı tarzı benimsedi. Sapolsky, alt sıradaki hayvanların ölçülen stres hormonlarının da düştüğünü yazar. Yani değişim yalnızca davranışta değil, bedende de görülür.</p><p>Bu olay bir deney değildir, koşulların yarattığı bir tesadüftür. Sapolsky da bunu bir kural olarak değil, bir olasılık olarak sunar. Her sürüde aynı şeyin olacağı anlamına gelmez. Ama bir sürünün gerilim düzeyinin sabit bir doğa yasası olmadığını, öğrenilmiş bir tarz olarak değişebileceğini gösterir.</p><p>Anlatının dikkat çeken yanı, değişimin kalıcı olmasıdır. Yeni gelenlerin de sürünün sakin tarzına uyması, bir grubun havasının yalnızca bireylerin huyundan değil, yerleşmiş alışkanlıklardan da oluştuğunu düşündürür.</p><p>Bu hikâyeyi doğrudan insan gruplarına uygulamak dikkat ister. Ama gerilimin yalnızca tek tek üyelerin kişiliğine bağlı olmadığını, yaşanan düzenin de rol oynadığını hatırlatır.</p></section><section class=\"s s-lessons\"><h4>lessons <em>43</em></h4><div class=\"lesson\"><b>Bir grubun gerilimi öğrenilmiş bir tarzdır ve değişebilir.</b> Her toplantısı gergin geçen bir ekipte herkes bunun kişilerin huyundan geldiğini düşünebilir. Oysa toplantıyı her konuşmacının önce birine teşekkür ettiği küçük bir alışkanlık, havayı zamanla değiştirebilir. Bunu başlatmak çoğu zaman bir kişinin ilk adımına bağlıdır.</div></section><section class=\"s s-reflect\"><h4>reflect <em>17</em></h4><div class=\"ask\">Bulunduğunuz bir grupta gerilimi düşüren küçük bir alışkanlığı ilk siz başlatsanız, bu ne olurdu ve nasıl başlardınız?</div></section><section class=\"s s-use\"><h4>use <em>57</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Toplantılar hep gergin geçiyor</p><p class=\"say\">&quot;Bir deneme yapalım: konuşmadan önce herkes birine teşekkür etsin. Sapolsky&#x27;nin babun sürüsü de tarzını değiştirmişti.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Evde herkes huysuz</p><p class=\"say\">&quot;Yemekte telefonları kaldıralım ve herkes günün güzel bir anını anlatsın.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Arkadaş grubunda dedikodu artıyor</p><p class=\"say\">&quot;Son sohbet bana pek iyi gelmedi. Bu akşam başka bir şeyden konuşsak?&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>12</em></h4><div class=\"pocket\">Sürünün tarzı değişti ve kaldı; grubunuzda gerilimi düşüren ilk adımı siz atın.</div></section>", "counts": {"open": 18, "story": 230, "lessons": 43, "reflect": 17, "use": 57, "pocket": 12}, "total": 377, "var": "<div class=\"v\"><b>punchline</b> Bir babun sürüsünün en saldırgan erkekleri ölünce geriye kalanlar sakinleşti ve bu sakinlik yıllarca sürdü.</div><div class=\"v\"><b>thirty_sec</b> Sapolsky&#x27;nin izlediği Orman Sürüsü&#x27;nde en saldırgan erkekler turist lokantasının çöplüğünden bozuk et yedi ve tüberkülozdan öldü. Sürü daha sakin bir tarza geçti: zorbalık azaldı, bakım arttı, alt sıradakilerin stres hormonu düştü. Sonradan gelen erkekler de bu tarzı benimsedi. Bu bir deney değil bir tesadüftü, ama gerilimin değişebileceğini gösterdi.</div><div class=\"v\"><b>key_contrast</b> Kader değil kültür</div>"}}];

 history.replaceState(null,'','#'+d.id)}
