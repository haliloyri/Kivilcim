<script>const D=[{"id": 1783, "title": "Bay Piyasa", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>27</em></h4><p>Bay Piyasa her sabah kapıya gelir ve payınız için bir fiyat söyler. Bazen çok yüksek, bazen neredeyse bedava. Aradaki günlerde işletmenin yaptığı iş ise hiç değişmemiş olabilir.</p></section><section class=\"s s-story\"><h4>story <em>238</em></h4><p>Benjamin Graham, 1949 tarihli <i>The Intelligent Investor</i> kitabında yatırımcıdan küçük, özel bir işletmenin ortağı olduğunu hayal etmesini ister. Öbür ortağın adı Bay Piyasa. Her gün kapınıza gelir ve ya kendi payını size satmayı ya da sizin payınızı almayı önerir. Fiyatı da kendisi söyler.</p><p>Bay Piyasa&#x27;nın ruh hali durmadan değişir. Coşkulu günlerde geleceği parlak görür ve payı için fahiş bir fiyat ister. Kötümser günlerde yalnızca sıkıntı görür ve aynı payı yok pahasına vermeye razı olur. İşletmenin bilançosu, kazancı ve işleyişi bu iki sabah arasında değişmemiştir. Değişen tek şey, ortağın o günkü keyfidir.</p><p>Bunu bir örnekle görelim. Bu örnek kitapta geçmez, yalnızca mantığı göstermek içindir. Ortak olduğunuz işletme bir fırın olsun. Fırın pazartesi de perşembe de aynı miktarda ekmek satıyor. Bay Piyasa pazartesi payınıza çok yüksek, perşembe çok düşük bir fiyat biçiyor. Kasaya giren para ikisinde de aynı.</p><p class=\"hl\">Graham&#x27;a göre Bay Piyasa&#x27;nın teklifine uymak zorunda değilsiniz.</p><p>Teklifi duyup geçebilirsiniz, çünkü Bay Piyasa ertesi sabah yeni bir fiyatla yine gelecektir. Fiyat işletmenin kazancının ve varlıklarının gösterdiği değerin çok üstüne çıktığında satmayı, çok altına indiğinde almayı düşünebilirsiniz. Ortada büyük bir fark yoksa kapıyı kapatıp kendi işinize dönersiniz. Graham&#x27;ın ifadesiyle Bay Piyasa size hizmet etmek için vardır, size yol göstermek için değil.</p><p>Graham aynı kitapta yatırımcının en büyük sorununun, hatta en büyük düşmanının çoğu zaman kendisi olduğunu yazar. Bay Piyasa&#x27;nın sesi bu yüzden tehlikelidir: coşkuya ya da korkuya katılma isteği yatırımcının kendi içinden doğar. Warren Buffett&#x27;ın da bu bölüme çok değer verdiği bilinir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>53</em></h4><div class=\"lesson\"><b>Fiyatı bir teklif olarak okuyun.</b> İkinci el bisikletini satan biri, ilk arayanın çok düşük teklifinden bisikletin bozuk olduğu sonucunu çıkarmaz. Teklifi dinler, bisikletin gerçek durumuna bakar ve ona göre cevap verir. Ekrandaki bir rakamı da başkasının o günkü fikri olarak okuduğunuzda, işin değerini kendi hesabınızla yapıp ne zaman beklemeniz gerektiğini daha net görürsünüz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>17</em></h4><div class=\"ask\">Sizi en son telaşlandıran fiyat düşüşünde, işin kendisinde tam olarak neyin değiştiğini söylemek için hangi bilgiye bakardınız?</div></section><section class=\"s s-use\"><h4>use <em>79</em></h4><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Portföyünüz sert düştü ve satmak istiyorsunuz</p><p class=\"say\">&quot;Bay Piyasa bugün karamsar. Ama şirket dün ne kazanıyorsa bugün de onu kazanıyor, önce onun hesabına bakacağım.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Eşiniz haberlerdeki bir yükselişe kapılıp yatırım yapmak istiyor</p><p class=\"say\">&quot;Bu fiyat coşkulu bir ortağın teklifi olabilir. Bir hafta bekleyelim, bu arada şirketin kazancına birlikte bakalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Arkadaşınız borsadaki panikten bahsediyor</p><p class=\"say\">&quot;Graham&#x27;ın Bay Piyasa&#x27;sını duydun mu? Her sabah ruh haline göre fiyat söyleyen bir ortak. Teklifini kabul etmek zorunda değilsin.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>15</em></h4><div class=\"pocket\">Fiyat, Bay Piyasa&#x27;nın o sabahki ruh halidir; işin değerini kendiniz hesaplayana kadar teklifi cevapsız bırakın.</div></section>", "counts": {"open": 27, "story": 238, "lessons": 53, "reflect": 17, "use": 79, "pocket": 15}, "total": 429, "var": "<div class=\"v\"><b>punchline</b> Bay Piyasa her sabah fiyat söyler, ama Graham&#x27;a göre o teklifi duymazdan gelme hakkı yalnızca sizdedir.</div><div class=\"v\"><b>thirty_sec</b> Benjamin Graham yatırımcıya Bay Piyasa adında bir iş ortağı hayal ettirir. Bu ortak her sabah gelip elindeki pay için bir fiyat söyler. Bazı günler coşkuyla fahiş bir fiyat ister, bazı günler paniğe kapılıp yok pahasına satmaya çalışır. İşletme ise aynı kalır. Graham&#x27;ın önerisi şu: teklifi kabul etmek zorunda değilsiniz. Fiyat çok yüksekse satmayı, çok düşükse almayı düşünür, aksi hâlde ortağı dinlemezsiniz.</div><div class=\"v\"><b>key_contrast</b> Fiyat ve ruh hali</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>35</em></h4><p>Her sabah aynı ortak kapınıza gelir ve aynı payınız için bir rakam söyler. Dünkü rakam yüksekti, bugünküne bakınca neredeyse bedava. İşletme ise hiçbir şey yapmamış gibi yerinde duruyor ve ortağın yarın ne diyeceğini kimse bilmiyor.</p></section><section class=\"s s-story\"><h4>story <em>232</em></h4><p>Benjamin Graham, 1949 tarihli <i>The Intelligent Investor</i> kitabında okurdan küçük, özel bir işletmenin ortağı olduğunu düşünmesini ister. Ortaklardan biri sizsiniz, öbürü Bay Piyasa. Bay Piyasa her gün uğrar ve bir fiyat söyler: ya sizin payınızı o fiyata alır ya da kendi payını o fiyata size satar.</p><p>Fiyat günden güne tutarsızdır, çünkü Bay Piyasa&#x27;nın ruh hali tutarsızdır. Coşkulu bir sabahta geleceği parlak görür ve yüksek bir rakam ister. Kasvetli bir sabahta yalnızca sıkıntı görür ve aynı pay için çok düşük bir rakama razı olur. İki sabah arasında işletmenin bilançosu, kazancı ve işleyişi yerinde kalmıştır. Değişen tek şey, kapıdaki ortağın o günkü havasıdır.</p><p class=\"hl\">Bay Piyasa&#x27;nın teklifine uymak zorunda değilsiniz.## Rakamı dinleyip geçebilirsiniz, çünkü ertesi sabah başka bir rakamla yine kapıdadır. Graham&#x27;a göre o, size hizmet etmek için vardır; size yol göstermek için değil.</p><p>Yol gösterecek olan işletmenin kendisidir. Bilançosuna, kazancına ve nasıl çalıştığına bakıp payın değerini kendiniz tartarsınız, Bay Piyasa&#x27;nın her sabahki rakamını da bu değerle karşılaştırırsınız. Rakam değerin çok üstüne çıkmışsa, yani Bay Piyasa coşkulu bir sabahtaysa, payınızı ona satmayı düşünürsünüz. Rakam değerin çok altına inmişse, yani kasvetli bir sabahtaysa, onun payını ucuza almayı düşünürsünüz. İkisi arasında kalan günlerde kapıyı kapatıp kendi işinize dönersiniz.</p><p>Graham, yatırımcının en büyük sorununun, hatta en büyük düşmanının büyük olasılıkla yine kendisi olduğunu söyler. Rakamı dayatan Bay Piyasa değildir. Coşkusuna ya da kasvetine kapılıp o rakama göre davranan, yatırımcının kendisidir. Warren Buffett&#x27;ın da bu bölüme değer verdiği bilinir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>68</em></h4><div class=\"lesson\"><b>Bir fiyatı teklif olarak okuyun.</b> Eski baskı kitapları satan bir sahaf, bir müşteri rafındaki kitaba çok düşük bir fiyat söylediğinde kitabın değersiz olduğunu düşünmez. Baskısına, cildine ve kaç kopya kaldığına bakar, kendi hesabına göre cevap verir, gerekirse &quot;hayır&quot; der. Ekrandaki bir fiyatı da başkasının o günkü teklifi gibi okuduğunuzda, karar vermeden önce işin değerini kendi bilginizle tartacak zamanı kendinize bırakmış olursunuz. Cevabınız bu tartıdan çıkar, ekrandaki rakamdan değil.</div></section><section class=\"s s-reflect\"><h4>reflect <em>17</em></h4><div class=\"ask\">Sizi en son telaşlandıran bir fiyat düşüşünde, işin kendisinin gerçekten değişip değişmediğini anlamak için hangi bilgiye bakabilirdiniz?</div></section><section class=\"s s-use\"><h4>use <em>85</em></h4><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Portföyünüz sert düştü ve hepsini satmak istiyorsunuz</p><p class=\"say\">&quot;Bay Piyasa bugün kasvetli. Bu şirket dün ne kazanıyorsa bugün de onu kazanıyor mu, önce bilançosuna bakayım.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Eşiniz haberlerdeki bir yükselişe bakıp hemen yatırım yapmak istiyor</p><p class=\"say\">&quot;Bu fiyat coşkulu bir ortağın rakamı olabilir. Şirketin ne kazandığına birlikte bakalım, karar için bir hafta var.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Bir arkadaşınız borsadaki panikten yakınıyor</p><p class=\"say\">&quot;Graham&#x27;ın anlattığı bir ortak var, her sabah ruh haline göre bir fiyat söylüyor. Kabul etmek zorunda değilsin, önce kendi hesabını yap.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>14</em></h4><div class=\"pocket\">Fiyat, Bay Piyasa&#x27;nın o sabahki ruh halidir. Cevap vermeden önce işin değerini kendiniz hesaplayın.</div></section>", "counts": {"open": 35, "story": 232, "lessons": 68, "reflect": 17, "use": 85, "pocket": 14}, "total": 451, "var": "<div class=\"v\"><b>punchline</b> Graham&#x27;ın Bay Piyasa&#x27;sı her sabah aynı payın başka bir fiyatını söyler. Değişen şirket değil, onun ruh halidir.</div><div class=\"v\"><b>thirty_sec</b> Benjamin Graham yatırımcıdan küçük bir işletmenin ortağı olduğunu düşünmesini ister. Öbür ortak Bay Piyasa her sabah gelir ve payınız için bir fiyat söyler. Coşkulu günde yüksek, kasvetli günde çok düşük bir rakam çıkar, oysa bilanço ve kazanç aynıdır. Graham&#x27;a göre rakamı kabul etmek zorunda değilsiniz. Önce işletmenin değerine bakarsınız; fiyat bunun çok üstündeyse satmayı, çok altındaysa almayı düşünürsünüz.</div><div class=\"v\"><b>key_contrast</b> Fiyat ve değer</div>"}}];
function cnt(c){return ['open','story','lessons','reflect','use','pocket'].map(k=>k+' '+(c[k]||0)).join(' · ')}
function show(n){const d=D[n];document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('on',i==n));
 for(const [id,k,label] of [['L','claude','Eski sürüm (v2, yedek, veritabanında)'],['R','argon','Yeni sürüm (v3, yeniden yazıldı)']]){const x=d[k];
 document.getElementById(id).innerHTML='<h2>'+label+'</h2><div class="meta">#'+d.id+' · toplam '+x.total+' kelime<br>'+cnt(x.counts)+'</div>'+x.body+'<div class="s"><h4>variants</h4>'+x.var+'</div>'}
 history.replaceState(null,'','#'+d.id)}
D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d.id;b.onclick=()=>show(i);tabs.appendChild(b)});
show(Math.max(0,D.findIndex(d=>'#'+d.id==location.hash)));

</script></body></html>
