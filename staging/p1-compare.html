<script>const D=[{"id": 1783, "title": "Bay Piyasa ile Ortaklık", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>27</em></h4><p>Bay Piyasa her sabah kapıya gelir ve payınız için bir fiyat söyler. Bazen çok yüksek, bazen neredeyse bedava. Aradaki günlerde işletmenin yaptığı iş ise hiç değişmemiş olabilir.</p></section><section class=\"s s-story\"><h4>story <em>238</em></h4><p>Benjamin Graham, 1949 tarihli <i>The Intelligent Investor</i> kitabında yatırımcıdan küçük, özel bir işletmenin ortağı olduğunu hayal etmesini ister. Öbür ortağın adı Bay Piyasa. Her gün kapınıza gelir ve ya kendi payını size satmayı ya da sizin payınızı almayı önerir. Fiyatı da kendisi söyler.</p><p>Bay Piyasa&#x27;nın ruh hali durmadan değişir. Coşkulu günlerde geleceği parlak görür ve payı için fahiş bir fiyat ister. Kötümser günlerde yalnızca sıkıntı görür ve aynı payı yok pahasına vermeye razı olur. İşletmenin bilançosu, kazancı ve işleyişi bu iki sabah arasında değişmemiştir. Değişen tek şey, ortağın o günkü keyfidir.</p><p>Bunu bir örnekle görelim. Bu örnek kitapta geçmez, yalnızca mantığı göstermek içindir. Ortak olduğunuz işletme bir fırın olsun. Fırın pazartesi de perşembe de aynı miktarda ekmek satıyor. Bay Piyasa pazartesi payınıza çok yüksek, perşembe çok düşük bir fiyat biçiyor. Kasaya giren para ikisinde de aynı.</p><p class=\"hl\">Graham&#x27;a göre Bay Piyasa&#x27;nın teklifine uymak zorunda değilsiniz.</p><p>Teklifi duyup geçebilirsiniz, çünkü Bay Piyasa ertesi sabah yeni bir fiyatla yine gelecektir. Fiyat işletmenin kazancının ve varlıklarının gösterdiği değerin çok üstüne çıktığında satmayı, çok altına indiğinde almayı düşünebilirsiniz. Ortada büyük bir fark yoksa kapıyı kapatıp kendi işinize dönersiniz. Graham&#x27;ın ifadesiyle Bay Piyasa size hizmet etmek için vardır, size yol göstermek için değil.</p><p>Graham aynı kitapta yatırımcının en büyük sorununun, hatta en büyük düşmanının çoğu zaman kendisi olduğunu yazar. Bay Piyasa&#x27;nın sesi bu yüzden tehlikelidir: coşkuya ya da korkuya katılma isteği yatırımcının kendi içinden doğar. Warren Buffett&#x27;ın da bu bölüme çok değer verdiği bilinir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>53</em></h4><div class=\"lesson\"><b>Fiyatı bir teklif olarak okuyun.</b> İkinci el bisikletini satan biri, ilk arayanın çok düşük teklifinden bisikletin bozuk olduğu sonucunu çıkarmaz. Teklifi dinler, bisikletin gerçek durumuna bakar ve ona göre cevap verir. Ekrandaki bir rakamı da başkasının o günkü fikri olarak okuduğunuzda, işin değerini kendi hesabınızla yapıp ne zaman beklemeniz gerektiğini daha net görürsünüz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>17</em></h4><div class=\"ask\">Sizi en son telaşlandıran fiyat düşüşünde, işin kendisinde tam olarak neyin değiştiğini söylemek için hangi bilgiye bakardınız?</div></section><section class=\"s s-use\"><h4>use <em>79</em></h4><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Portföyünüz sert düştü ve satmak istiyorsunuz</p><p class=\"say\">&quot;Bay Piyasa bugün karamsar. Ama şirket dün ne kazanıyorsa bugün de onu kazanıyor, önce onun hesabına bakacağım.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Eşiniz haberlerdeki bir yükselişe kapılıp yatırım yapmak istiyor</p><p class=\"say\">&quot;Bu fiyat coşkulu bir ortağın teklifi olabilir. Bir hafta bekleyelim, bu arada şirketin kazancına birlikte bakalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Arkadaşınız borsadaki panikten bahsediyor</p><p class=\"say\">&quot;Graham&#x27;ın Bay Piyasa&#x27;sını duydun mu? Her sabah ruh haline göre fiyat söyleyen bir ortak. Teklifini kabul etmek zorunda değilsin.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>15</em></h4><div class=\"pocket\">Fiyat, Bay Piyasa&#x27;nın o sabahki ruh halidir; işin değerini kendiniz hesaplayana kadar teklifi cevapsız bırakın.</div></section>", "counts": {"open": 27, "story": 238, "lessons": 53, "reflect": 17, "use": 79, "pocket": 15}, "total": 429, "var": "<div class=\"v\"><b>punchline</b> Bay Piyasa her sabah fiyat söyler, ama Graham&#x27;a göre o teklifi duymazdan gelme hakkı yalnızca sizdedir.</div><div class=\"v\"><b>thirty_sec</b> Benjamin Graham yatırımcıya Bay Piyasa adında bir iş ortağı hayal ettirir. Bu ortak her sabah gelip elindeki pay için bir fiyat söyler. Bazı günler coşkuyla fahiş bir fiyat ister, bazı günler paniğe kapılıp yok pahasına satmaya çalışır. İşletme ise aynı kalır. Graham&#x27;ın önerisi şu: teklifi kabul etmek zorunda değilsiniz. Fiyat çok yüksekse satmayı, çok düşükse almayı düşünür, aksi hâlde ortağı dinlemezsiniz.</div><div class=\"v\"><b>key_contrast</b> Fiyat ve ruh hali</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>40</em></h4><p>Benjamin Graham 1949&#x27;da yayımlanan <i>The Intelligent Investor (Akıllı Yatırımcı)</i> kitabında yatırımcılara alışılmadık bir iş ortağı tanıştırır. Adı Bay Piyasa&#x27;dır. Bu ortağın tek bir huyu vardır: her sabah kapınızı çalar ve ortak olduğunuz şirketteki payınız için size yeni bir fiyat söyler.</p></section><section class=\"s s-story\"><h4>story <em>268</em></h4><p>Benjamin Graham&#x27;ın kurduğu bu benzetmede küçük bir işletmenin yüzde ellisine sahipsinizdir. Diğer yüzde elli ise Bay Piyasa&#x27;nın elindedir. Bay Piyasa son derece yardımsever bir ortaktır; her sabah elinde bir rakamla masanıza gelir. İsterseniz kendi payınızı o fiyattan ona satabilirsiniz, isterseniz onun payını aynı fiyattan satın alabilirsiniz.</p><p>Sorun Bay Piyasa&#x27;nın iş bilgisi değil, ruh hâlidir. Bazı sabahlar ufukta yalnızca büyüme ve kâr görür. Heyecana kapılır ve işletmedeki payı için çok yüksek bir bedel ister; elinizdeki hisseyi de ne pahasına olursa olsun sizden almaya hazırdır. Birkaç gün sonra ise aynı ortak kapınıza bambaşka bir yüzle gelir. Kötü bir haber duymuştur, şirketin yakın zamanda batacağından emindir ve elindeki payı yok pahasına size devretmek için neredeyse yalvarır.</p><p class=\"hl\">Bay Piyasa&#x27;nın her sabah söylediği rakam, şirketin kasasındaki gerçek değeri değil, onun o sabahki korkusunu ya da coşkusunu ölçer.</p><p>Graham burada yatırımcıyı durdurup şu soruyu sorar: İşletmenin bilançosunu ve ne ürettiğini bildiğiniz hâlde, sırf bu dengesiz ortak her gün bağırıyor diye kendi payınızın değerini onun ağzından çıkan rakama göre mi hesaplarsınız? Normal şartlarda kimse böyle bir ortağın paniğine kapılıp sağlam dükkanını ucuza kapatmaz.</p><p>Borsada ise insanlar tam olarak bunu yapar. Ekranda fiyat düştüğünde Bay Piyasa&#x27;nın kendilerinden daha çok şey bildiğini sanır ve paniğe katılırlar. Fiyat yükseldiğinde ise treni kaçırma korkusuyla pahalıdan alım yaparlar.</p><p>Graham&#x27;ın çizdiği sınır açıktır. Bay Piyasa ile ortaklık kurmanın en güzel yanı, ona cevap verme zorunluluğunuzun olmamasıdır. Teklifi hoşunuza gitmezse kapıyı kapatıp işinize bakarsınız. Onun sabah nöbetleri size yol göstermek için değil, fiyat gerçek değerden koptuğunda bundan yararlanmanız için vardır. Warren Buffett dahil kuşaklar boyu değer yatırımcıları, piyasa ekranını bir pusula yerine duygusal bir ortağın teklif defteri olarak okumayı bu hikâyeden öğrendi.</p></section><section class=\"s s-lessons\"><h4>lessons <em>55</em></h4><div class=\"lesson\"><b>Kalabalığın gürültüsü bir ölçüm aracı değildir.</b> İkinci el arabasını satılığa çıkaran biri, ilk gün gelen öfkeli bir alıcının yarı fiyat teklifine bakıp arabasının motorundan şüphe etmez; sadece o alıcıya teşekkür edip telefonu kapatır. Bir varlığın ya da işin ne ürettiğini önceden kendi hesabınızla belirlediğinizde, dışarıdaki günlük dalgalanmaları bir tehdit olarak görmek yerine kendi lehinize kullanabilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>25</em></h4><div class=\"ask\">Son zamanlarda kendi hesabınıza güvenmek yerine sırf çevrenizdekiler telaşlandı ya da heyecanlandı diye değiştirdiğiniz bir kararınız oldu mu, geriye dönüp baktığınızda orada gerçek değer neydi?</div></section><section class=\"s s-use\"><h4>use <em>104</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekip tek bir günlük veriye veya rakip hamlesine bakarak bütün planı değiştirmek istiyor</p><p class=\"say\">&quot;Graham&#x27;ın Bay Piyasa benzetmesindeki gibi günlük fiyata değil asıl değere bakalım. Bu tek veri işin temelini gerçekten değiştirdi mi, yoksa sadece bugünkü havayı mı yansıtıyor?&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Piyasada veya yürüttüğünüz bir işte sert bir dalgalanma gördüğünüzde</p><p class=\"say\">&quot;Şu an kapıyı çalan rakam işin gerçek değeri mi, yoksa geçici bir panik mi? Karar vermeden önce temel tabloyu tekrar açıp okuyacağım.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Bir arkadaşınız herkesin konuştuğu popüler bir yatırıma girmek için acele ediyor</p><p class=\"say\">&quot;Fiyatın her gün konuşulması değerinin arttığı anlamına gelmez. O şirketin gerçekten ne kazandığına baktın mı?&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Bay Piyasa her sabah yeni bir fiyat bağırır; kapıyı açıp açmamak sizin elinizdedir.</div></section>", "counts": {"open": 40, "story": 268, "lessons": 55, "reflect": 25, "use": 104, "pocket": 13}, "total": 505, "var": "<div class=\"v\"><b>punchline</b> Benjamin Graham&#x27;ın Bay Piyasa&#x27;sı her sabah kapınızı çalıp yeni bir fiyat söyler, ama o rakam şirketin değerini değil ortağın o günkü ruh hâlini ölçer.</div><div class=\"v\"><b>thirty_sec</b> Benjamin Graham 1949&#x27;da yatırımcılara Bay Piyasa adlı bir ortak hayal ettirir. Bu ortak her sabah kapınızı çalar ve şirketteki payınız için bir fiyat söyler. Bazı günler coşkuya kapılıp fahiş fiyatlar verir, bazı günler paniğe düşüp elindeki payı yok pahasına satmaya çalışır. Graham&#x27;a göre bu ortağa uymak zorunda değilsiniz; piyasa size akıl vermek için değil, fiyat saçmalaştığında bundan yararlanmanız için vardır.</div><div class=\"v\"><b>key_contrast</b> Sabah fiyatı ve gerçek değer</div>"}}, {"id": 1784, "title": "Sonuna Kadar İyi Yaşamak", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>25</em></h4><p>Atul Gawande yıllarca hastaları ameliyat masasında iyileştirmeye çalıştı. Ölmekte olan bir hastaya ne soracağını ise tıp eğitimi ona pek öğretmemişti. Kitabı bu eksikliğin etrafında şekillenir.</p></section><section class=\"s s-story\"><h4>story <em>233</em></h4><p>Cerrah Atul Gawande, <i>Being Mortal</i> kitabında modern tıbbın ölüme nasıl baktığını kendi mesleğinden anlatır. Hastane düzeni hastalığı yenmeye kuruludur. Tedavi seçenekleri sıralanır, hasta onay verir, süreç ilerler. Kalan zamanın nasıl geçmesini istediği ise çoğu zaman sorulmaz.</p><p>Gawande, bu eksikliğin ölçülebilir bir karşılığını gösteren bir çalışmayı aktarır. İleri evre akciğer kanseri olan hastaların bir bölümüne standart tedavinin yanında erken dönemde palyatif bakım verilir. Bu ekip hastayla yalnızca tedaviyi değil, hastanın endişelerini ve hedeflerini de konuşur.</p><p>Sonuç şaşırtıcıdır. Bu hastalar yaşamlarının sonuna doğru daha az yoğun müdahale seçer, yaşam kaliteleri daha iyi ölçülür ve ortalamada birkaç ay daha uzun yaşarlar.</p><p class=\"hl\">Gawande&#x27;nin işaret ettiği nokta şudur: iyi bir yaşam sonunu konuşmak, ömrü kısaltmak anlamına gelmez.</p><p>Kitap bu konuşmaların nasıl yapıldığını da gösterir. Hastaya hastalığını nasıl anladığı sorulur. Neyden korktuğu, kalan zamanda neyi istediği ve bunun için nelerden vazgeçmeye razı olduğu sorulur. Bu sorular karar masasını doktorun seçenek listesinden hastanın kendi önceliklerine taşır.</p><p>Gawande&#x27;ye göre sıkıntı, hekimlerin kötü niyetinden çok alışkanlıktan gelir. Hekim iyileştirmeyi öğrenmiştir, kalan zamanı kimin için neyin değerli kıldığını sormayı değil. Konuşma erken yapıldığında hasta da yakınları da kararların neye dayandığını bilir.</p><p>Gawande bu konuşmaların kolay olmadığını da kabul eder. Hekim için bir seçenek sunmak, hastanın korkularını dinlemekten daha rahattır. Hasta ve yakınları için de ölüm konusunu açmak çoğu zaman ertelenir. Gawande&#x27;ye göre konuşma ertelendikçe kararlar aceleyle, yoğun bakımın koşullarında ve hastanın yerine başkaları tarafından verilir.</p><p>Kitabın çağrısı, kalan zamanın ölçütünü hastanın kendisinin koymasıdır.</p></section><section class=\"s s-lessons\"><h4>lessons <em>51</em></h4><div class=\"lesson\"><b>İyi bir son, önce nelerin vazgeçilmez olduğunu bilmekle başlar.</b> Bir ailede dedenin evde mi kalacağı, bakım evine mi gideceği konuşulurken herkes seçenek sayar ama dedeye en çok neyi sevdiği sorulmaz. Önce o soru sorulursa seçenekler kendiliğinden ayıklanır ve yakınlarınız neyi korumaya çalıştığınızı bilir. Böylece zor karar, korkulardan çok önceliklerle verilmiş olur.</div></section><section class=\"s s-reflect\"><h4>reflect <em>13</em></h4><div class=\"ask\">Kalan zamanınız kısalsaydı günlerinizin hangi kısmı vazgeçilmez olurdu ve yakınlarınız bunu biliyor mu?</div></section><section class=\"s s-use\"><h4>use <em>75</em></h4><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Yaşlı bir yakınınızın bakımı konuşulurken herkes seçenek sayıyor</p><p class=\"say\">&quot;Önce ona soralım: senin için iyi bir gün nasıl geçer, en çok neyden korkuyorsun? Sonra seçeneklere bakarız.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Hasta bir arkadaşınız tedavisinden bahsediyor</p><p class=\"say\">&quot;Gawande&#x27;nin kitabında hekimler hastanın hedeflerini de soruyormuş. Senin için bu süreçte vazgeçilmez olan ne?&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Kendi isteklerinizi yakınlarınıza hiç anlatmadınız</p><p class=\"say\">&quot;Sana bir şey söylemek istiyorum. Benim için iyi bir gün şöyle bir şey ve bunu bilmeni isterim.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Tedavi listesinden önce şunu sorun: bu insan için iyi bir gün nasıl görünür?</div></section>", "counts": {"open": 25, "story": 233, "lessons": 51, "reflect": 13, "use": 75, "pocket": 13}, "total": 410, "var": "<div class=\"v\"><b>punchline</b> Gawande, ağır hastaya önce hangi tedaviyi değil, iyi bir günün ona nasıl göründüğünü sormayı öğütler.</div><div class=\"v\"><b>thirty_sec</b> Cerrah Atul Gawande, modern tıbbın ölümü bir yenilgi gibi gördüğünü fark eder. Kitabında ileri evre akciğer kanseri hastalarına standart tedavinin yanında erken palyatif bakım verilen bir çalışmayı aktarır. Bu hastalar daha az yoğun müdahale seçmiş, yaşam kaliteleri daha iyi çıkmış ve ortalamada birkaç ay daha uzun yaşamışlar. Hekimler onlara neden korktuklarını, ne istediklerini ve nelerden vazgeçebileceklerini sormuş.</div><div class=\"v\"><b>key_contrast</b> Süre ve anlam</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>48</em></h4><p>İleri evre akciğer kanseri hastalarının bir kısmına, standart tedavinin yanında erken aşamada palyatif bakım verildi. Bu gruptaki hastalar son aylarında daha az agresif müdahale seçti ve daha az acı çekti. Cerrah Atul Gawande&#x27;nin <i>Being Mortal (Ölümlü Olmak)</i> kitabında aktardığı asıl sürpriz ise bu hastaların yaşam süresinde ortaya çıktı.</p></section><section class=\"s s-story\"><h4>story <em>276</em></h4><p>Cerrah Atul Gawande, <i>Being Mortal (Ölümlü Olmak)</i> kitabında modern tıbbın yaşlanma ve ölüm karşısındaki çaresizliğini kendi mesleğinin içinden anlatır. Tıp eğitimi doktorlara tek bir görev yüklemiştir: ne pahasına olursa olsun hayatı uzatmak. Hastanelerdeki bütün cihazlar, yoğun bakım üniteleri ve son dakika ameliyatları bu hedef için çalışır. Oysa o uzatılan günlerin hasta için nasıl geçtiği çoğu zaman kimsenin gündemine girmez.</p><p>Gawande bu kör noktayı somutlaştırmak için 2010 yılında yapılan dikkat çekici bir klinik çalışmayı ele alır. İleri evre akciğer kanseri teşhisi konmuş hastalar iki gruba ayrılır. Birinci grup yalnızca standart onkoloji tedavisi görür. İkinci grup ise standart tedavinin yanı sıra erken aşamada palyatif bakım uzmanlarıyla görüşmeye başlar; yani ağrı kontrolü, yaşam kalitesi ve kendi öncelikleri üzerine konuşurlar.</p><p>Sonuçlar tıp dünyasındaki yaygın varsayımı tersine çevirdi. Erken palyatif destek alan hastalar, hastalık ilerlediğinde kemoterapiyi ve solunum cihazına bağlanmayı daha erken bıraktı. Daha az acı çektiler, depresyon oranları daha düşük kaldı ve buna rağmen standart tedavi grubuna kıyasla ortalamada yaklaşık yüzde yirmi beş daha uzun yaşadılar.</p><p class=\"hl\">Tedaviyi her şeye rağmen sürdürmeyi bırakanlar, günlerini hastanede geçirenlerden daha kısa değil, daha uzun yaşadı.</p><p>Gawande&#x27;ye göre aradaki farkı mucizevi bir ilaç değil, zamanında sorulan birkaç sade soru yaratır. Doktorlar seçenek listelerini sıralamak yerine hastayla karşı karşıya oturup şunu konuştuğunda tablo değişir:\n&gt; Senin için vazgeçilmez olan ne? En çok neyden korkuyorsun? İyi bir gün senin için nasıl görünür?</p><p>Kimi hasta için vazgeçilmez olan şey torununun düğününde bulunmaktır, kimi içinse kendi koltuğunda oturup dondurma yiyebilmektir. Bu öncelikler konuşulmadığında tıp makinesi kendi bildiği tek işi yapar ve hastanın son haftalarını kablolar arasında tüketir. Gawande&#x27;nin vardığı sonuç açıktır: iyi bir tıp, sadece ölümü geciktiren değil, kişinin kendi ölçütleriyle sonuna kadar anlamlı bir gün geçirmesini koruyan tıptır.</p></section><section class=\"s s-lessons\"><h4>lessons <em>56</em></h4><div class=\"lesson\"><b>Öncelikleri sormadan yapılan her müdahale, korumak istediği şeyi tüketebilir.</b> Yaşlı annesinin güvenliği için onu çok sevdiği bahçeli evinden alıp apartman dairesine taşıyan bir aile, kadının düşme riskini azaltırken onu hayata bağlayan günlük uğraşı elinden almış olur. Birine yardım etmeye çalışırken önce onun için iyi bir günün ne anlama geldiğini sormak, iyi niyetli ama yıkıcı kararları önler.</div></section><section class=\"s s-reflect\"><h4>reflect <em>19</em></h4><div class=\"ask\">Sizin için gerçekten &quot;iyi bir gün&quot; hangi iki-üç vazgeçilmez şeyden oluşuyor ve bunu en yakınlarınıza hiç açıkça söylediniz mi?</div></section><section class=\"s s-use\"><h4>use <em>97</em></h4><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Ailede yaşlı veya hasta bir yakınınızın bakımı hakkında zor bir karar konuşuluyor</p><p class=\"say\">&quot;Gawande&#x27;nin kitabındaki soruyu soralım: Onun için iyi bir gün ne demek ve neden vazgeçemez? Kararı sadece güvenliğe göre değil, buna göre verelim.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Çok yoğun çalışan bir ekip arkadaşınız tükenme noktasına gelmiş</p><p class=\"say\">&quot;Bütün işleri yetiştirmeye çalışıyoruz ama senin için bu işte vazgeçilmez olan kısım hangisi? Geri kalan yükü biraz azaltalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Kendi haftanızı tamamen zorunluluklarla doldurduğunuzu fark ettiğinizde</p><p class=\"say\">&quot;Daha çok iş sığdırmak günü daha iyi yapmıyor. Bugün benim için iyi bir gün sayılacak tek bir saati nereye koyabilirim?&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>16</em></h4><div class=\"pocket\">Daha çok müdahale her zaman daha çok yaşam getirmez; önce iyi bir günün neye benzediğini sorun.</div></section>", "counts": {"open": 48, "story": 276, "lessons": 56, "reflect": 19, "use": 97, "pocket": 16}, "total": 512, "var": "<div class=\"v\"><b>punchline</b> Erken palyatif bakım alıp agresif müdahaleleri daha erken bırakan ileri evre akciğer kanseri hastaları, hem daha az acı çekti hem de ortalamada daha uzun yaşadı.</div><div class=\"v\"><b>thirty_sec</b> Cerrah Atul Gawande, modern tıbbın ömrü uzatmaya odaklanırken o ömrün nasıl geçtiğini sormadığını anlatır. Aktardığı bir çalışmada, standart tedavinin yanında erken palyatif bakım alan ileri evre akciğer kanseri hastaları son dönemde daha az agresif müdahale seçti, daha az acı çekti ve ortalamada daha uzun yaşadı. Gawande&#x27;ye göre dönüm noktası hastaya &#x27;İyi bir gün senin için nasıl görünür?&#x27; diye sormaktır.</div><div class=\"v\"><b>key_contrast</b> Ömrü uzatmak ve iyi bir gün</div>"}}, {"id": 1785, "title": "Suçlamanın Altındaki İhtiyaç", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>20</em></h4><p>Marshall Rosenberg çatışmaların çoğunda aynı şeyi gördü: insanlar ihtiyaçlarını söylemek yerine karşısındakini yargılıyordu. Yargılayan cümle çabuk çıkar, ama konuşmayı kapatır.</p></section><section class=\"s s-story\"><h4>story <em>262</em></h4><p>Klinik psikolog Marshall Rosenberg, <i>Nonviolent Communication</i> kitabında günlük konuşmanın çatışmayı nasıl büyüttüğünü anlatır. Ona göre insanlar canları yandığında ihtiyaçlarını dile getirmek yerine karşısındakini etiketler: tembel, bencil, saygısız. Etiket karşı tarafı savunmaya iter ve konuşma asıl derdine hiç gelmeden kilitlenir.</p><p>Rosenberg&#x27;in önerdiği yol dört parçadan oluşur: gözlem, duygu, ihtiyaç ve rica. Gözlem, olanı değerlendirme katmadan söylemektir. Duygu, o sırada ne hissettiğinizdir. İhtiyaç, o duygunun arkasındaki karşılanmamış şeydir. Rica ise karşı tarafın yapabileceği somut ve açık bir istektir.</p><p>Bunu tanıdık bir durumda görelim. Aşağıdaki cümleler kitabın kendi örneği değil, onun mantığını gösteren bir çizimdir. Biri üst üste toplantılara geç geliyor olsun. Yargılı cümle şudur: &quot;Sen beni hiç umursamıyorsun.&quot; Dört parçalı hâli ise şöyle olabilir: &quot;Son üç toplantıya yarım saat geç geldin. Beklerken kaygılandım, çünkü işimizin zamanında ilerlemesine ihtiyacım var. Bir dahaki sefer başlama saatinde gelebilir misin?&quot;</p><p class=\"hl\">Rosenberg&#x27;e göre her yargının altında karşılanmamış bir ihtiyaç yatar ve onu adlandırmak çatışmanın tonunu yumuşatır.</p><p>İkinci cümlede karşıdaki kişi hâlâ bir davranışla yüzleşir. Ama karakteri hakkında verilmiş bir hüküm yoktur. Elinde bir olay, bir duygu ve yapabileceği bir rica vardır. Bu yüzden savunmaya geçmek için bir neden azalır.</p><p>Rosenberg ihtiyaçları herkeste ortak olan temel şeyler olarak görür: anlaşılmak, güvende olmak, saygı görmek gibi. İhtiyaç herkesçe tanınabildiği için karşı taraf onu duyduğunda ne dendiğini anlar. Yargı ise yalnızca bir tartışma konusu olur. Ricayı da talepten ayırır. Karşı taraf hayır diyebiliyorsa bu bir ricadır, hayır dediğinde suçlanıyorsa talep.</p><p>Rosenberg aynı dört adımı dinlerken de kullanmayı önerir. Karşınızdaki öfkeli konuşuyorsa onun neyi gördüğünü, ne hissettiğini ve neye ihtiyaç duyduğunu tahmin etmeye çalışırsınız. Böylece konuşma suçlamadan çıkıp iki tarafın ihtiyaçlarına doğru ilerler.</p></section><section class=\"s s-lessons\"><h4>lessons <em>39</em></h4><div class=\"lesson\"><b>Eleştirinin altındaki ihtiyacı arayın.</b> Ev arkadaşınız bulaşıkları lavaboda bırakıyorsa &quot;dağınıksın&quot; demek hızlı çıkar ama kapıyı kapatır. Görünen olayı söyleyip ardından düzene olan ihtiyacınızı belirtirseniz karşınızdaki savunmaya geçmeden dinleyebilir. Bu yol, yargıyı söylemeden önce kendi ihtiyacınızı fark etmenizi de sağlar.</div></section><section class=\"s s-reflect\"><h4>reflect <em>10</em></h4><div class=\"ask\">Son tartışmanızda karşınızdakine söylediğiniz yargının altında hangi karşılanmamış ihtiyaç vardı?</div></section><section class=\"s s-use\"><h4>use <em>85</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Bir iş arkadaşınız ortak dosyayı son anda hazırlıyor</p><p class=\"say\">&quot;Rosenberg&#x27;in dört adımını deniyorum: son iki toplantıda dosya bir saat önce geldi, bu beni geriyor, hazırlanmaya vaktime ihtiyacım var. Cuma öğlene kadar gönderebilir misin?&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Eşiniz yine geç kaldı</p><p class=\"say\">&quot;Bugün yemeğe yarım saat geç geldin, beklerken yalnız hissettim. Birlikte yemek benim için önemli. Geleceksen bir mesaj atar mısın?&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Biri size sert bir eleştiri yöneltti</p><p class=\"say\">&quot;Bunu söylerken yorgun muydun, bir şeye mi ihtiyacın vardı? Önce sana ne olduğunu anlamak istiyorum.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>12</em></h4><div class=\"pocket\">Yargıyı söylemeden önce olanı, hissettiğinizi, ihtiyacınızı ve tek bir ricayı sırayla söyleyin.</div></section>", "counts": {"open": 20, "story": 262, "lessons": 39, "reflect": 10, "use": 85, "pocket": 12}, "total": 428, "var": "<div class=\"v\"><b>punchline</b> Rosenberg&#x27;e göre &quot;sen hep geç kalıyorsun&quot; demek asıl derdi saklar ve karşınızdakini hemen savunmaya iter.</div><div class=\"v\"><b>thirty_sec</b> Psikolog Marshall Rosenberg, insanların canı yandığında ihtiyacını değil yargısını söylediğini gördü. Yargı karşı tarafı savunmaya iter ve konuşma kilitlenir. Önerdiği yol dört adımdır: ne olduğunu değerlendirmeden söyle, ne hissettiğini söyle, hangi ihtiyacın karşılanmadığını söyle ve açık bir rica yap. Ona göre her yargının altında karşılanmamış bir ihtiyaç var ve onu adlandırmak gerginliği yumuşatıyor.</div><div class=\"v\"><b>key_contrast</b> Yargı yerine ihtiyaç</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>40</em></h4><p>&quot;Sen zaten hep geç kalıyorsun, beni hiç umursamıyorsun.&quot; Bu cümle ağzınızdan çıktığı anda karşı taraf saate değil, kendi savunmasına bakar. Klinik psikolog Marshall Rosenberg, <i>Nonviolent Communication (Şiddetsiz İletişim)</i> kitabında onlarca yıllık arabuluculuk deneyimini bu tek cümlenin neden kilitlendiği üzerine kurar.</p></section><section class=\"s s-story\"><h4>story <em>266</em></h4><p>Marshall Rosenberg on yıllar boyunca okullarda, hapishanelerde, şirketlerde ve çatışma bölgelerinde birbirini dinlemeyi bırakmış grupların arasına girdi. Nereye giderse gitsin aynı dilsel alışkanlıkla karşılaştı: insanlar canları yandığında ya da bir eksiklik hissettiklerinde kendi ihtiyaçlarını söylemiyor, karşılarındaki insanın karakteri hakkında hüküm veriyordu.</p><p>Birine &quot;Bencilsin&quot;, &quot;Sorumsuzsun&quot; ya da &quot;Beni hiç dinlemiyorsun&quot; dediğinizde, karşı tarafın önünde yalnızca iki yol kalır. Ya suçlamayı kabul edip kendinden utanacaktır ya da anında karşı saldırıya geçip sizin bir kusurunuzu bulacaktır. İki durumda da sizin asıl istediğiniz şey konuşulmadan masada kalır.</p><p class=\"hl\">Rosenberg&#x27;in saptaması basittir: insanların birbirine fırlattığı her eleştiri ve yargı, aslında karşılanmamış bir ihtiyacın acemice ifade edilmiş hâlidir.</p><p>Rosenberg bu düğümü çözmek için konuşmayı dört somut adıma ayırır: yorum katmadan yapılan gözlem, bu gözlemin uyandırdığı duygu, o duygunun altındaki temel ihtiyaç ve karşı taraftan beklenen açık rica.</p><p>Başlangıçtaki o gergin buluşma sahnesini bu dört adımla yeniden kurduğunuzda cümle tamamen değişir:\n&gt; Son üç buluşmamıza yarım saat geç geldin. Beklerken kendimi önemsiz hissediyorum, çünkü zamanıma değer verildiğini bilmeye ihtiyacım var. Bir dahaki buluşmamızda tam saatinde gelebilir misin?</p><p>İlk cümlede &quot;hep&quot; diyerek abartı ve &quot;umursamıyorsun&quot; diyerek niyet okuma vardı. İkinci cümlede ise tartışılmaz bir olgu (&quot;son üç buluşmada yarım saat&quot;), kişiye ait bir duygu, açık bir ihtiyaç ve yapılabilir bir eylem var. Karşı taraf artık kötü bir insan olmadığını kanıtlamak zorunda kalmaz; doğrudan ricanıza yanıt verebilir.</p><p>Rosenberg bu yöntemin insanları her konuda uzlaştırmak için yazılmış sihirli bir formül olmadığını özellikle vurgular. Adımları mekanik bir şablon gibi ezbere söylediğinizde karşı taraf yine baskı hisseder. Mesele cümleyi süslemek değil, konuşmaya başlamadan önce &quot;Şu an onu neyle suçluyorum?&quot; sorusundan &quot;Şu an benim hangi ihtiyacım açıkta kaldı?&quot; sorusuna geçebilmektir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>69</em></h4><div class=\"lesson\"><b>Niyet okumak savunma başlatır, açık ihtiyaç ise konuşma başlatır.</b> Teslim tarihi geciken bir raporu incelerken ekip arkadaşına &quot;İşi ciddiye almıyorsun&quot; diyen bir yönetici, yarım saat boyunca mazeret dinlemek zorunda kalır; oysa &quot;Rapor geciktiğinde müşteriye karşı zor durumda kalıyorum, gecikmeyi bir gün önceden bilmeye ihtiyacım var&quot; dediğinde doğrudan çözüme geçilir. Bir gerginlik anında karşı tarafın karakterine sıfat takmak yerine kendi somut ihtiyacınızı ve ricanızı söylediğinizde, tartışmayı bir güç savaşından çıkarırsınız.</div></section><section class=\"s s-reflect\"><h4>reflect <em>19</em></h4><div class=\"ask\">Yakın zamanda birine içten içe ya da yüksek sesle yönelttiğiniz bir suçlamanın altında, aslında sizin hangi karşılanmamış ihtiyacınız duruyordu?</div></section><section class=\"s s-use\"><h4>use <em>104</em></h4><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Bir iş arkadaşınız toplantı hazırlığını eksik bırakıp geldiğinde</p><p class=\"say\">&quot;Rosenberg&#x27;in dört adımıyla söyleyeyim: Son iki toplantıya veriler olmadan girdik. Hazırlıksız yakalanmak beni geriyor, önceden net bir tabloya ihtiyacım var. Yarınki toplantıdan bir saat önce listeyi paylaşabilir misin?&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Evde eşiniz veya bir yakınınız siz konuşurken sürekli telefonuna baktığında</p><p class=\"say\">&quot;Sen beni hiç dinlemiyorsun demek yerine şunu söyleyeyim: Ben anlatırken ekrana baktığında kendimi yalnız hissediyorum, on dakika bölünmeden konuşmaya ihtiyacım var. Telefonu biraz kenara bırakabilir misin?&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Birine sert bir mesaj yazmak üzereyken durduğunuzda</p><p class=\"say\">&quot;Mesajdaki sıfatları ve &#x27;hep/hiç&#x27; kelimelerini sileceğim. Sadece ne olduğunu, neye ihtiyacım olduğunu ve ne istediğimi yazacağım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>12</em></h4><div class=\"pocket\">Karşı tarafın karakterine hüküm vermek yerine kendi ihtiyacınızı ve somut ricanızı söyleyin.</div></section>", "counts": {"open": 40, "story": 266, "lessons": 69, "reflect": 19, "use": 104, "pocket": 12}, "total": 510, "var": "<div class=\"v\"><b>punchline</b> Marshall Rosenberg&#x27;e göre insanların birbirine fırlattığı her suçlama, aslında karşılanmamış bir ihtiyacın ters yüz edilmiş hâlidir.</div><div class=\"v\"><b>thirty_sec</b> Klinik psikolog Marshall Rosenberg, on yıllar boyunca okullarda ve çatışma bölgelerinde arabuluculuk yaparken insanların ihtiyaçlarını söylemek yerine birbirini yargıladığını gördü. &#x27;Sen hep geç kalıyorsun&#x27; cümlesi karşı tarafı savunmaya iter. Rosenberg bunun yerine dört adım önerir: yorumsuz gözlem, duygu, ihtiyaç ve açık rica. &#x27;Son üç buluşmaya yarım saat geç geldin, zamanıma özen gösterilmesine ihtiyacım var&#x27; dediğinizde kavga yerine konuşma başlar.</div><div class=\"v\"><b>key_contrast</b> Suçlayan yargı ve adlandırılan ihtiyaç</div>"}}, {"id": 1786, "title": "Dört Bin Haftalık Ömür", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>27</em></h4><p>Dört bin hafta. Oliver Burkeman&#x27;a göre sıradan bir insan ömrü kabaca bu kadardır. Yıllarca verimlilik yazan bir gazeteci bu sayıyı hesapladığında, denediği tekniklerin hiçbirini aynı gözle görmedi.</p></section><section class=\"s s-story\"><h4>story <em>237</em></h4><p>Oliver Burkeman gazetecilik yaparken yıllarca verimlilik üzerine yazdı. Kendi yazdığı tekniklerin çoğunu denedi: yapılacaklar listeleri, zaman çizelgeleri, e-posta düzenleri. <i>Four Thousand Weeks</i> kitabında bu denemelerin sonunda vardığı yeri anlatır.</p><p>İlk bulgu bir sayıydı. Yaklaşık seksen yıl yaşayan bir insan kabaca dört bin hafta yaşar. Bu rakam soyut bir fikir olarak değil, bir takvim olarak görüldüğünde zamana bakışı değiştirir.</p><p>İkinci bulgu, Burkeman&#x27;ın verimlilik tuzağı dediği şeydi. E-postalara daha hızlı cevap verdikçe daha çok e-posta gelir. Listeyi boşalttığınız anda yenisi dolar. Bu yüzden daha verimli olmak insanı rahatlatmaz, üzerine daha çok iş çeker. Bitiş çizgisi, koşucuyla birlikte uzar.</p><p class=\"hl\">Burkeman&#x27;ın vardığı sonuç, her şeye yetişme hayalini bırakmaktır.</p><p>Sınırlı bir varlık olduğunuzu kabul ettiğinizde &quot;her şeyi nasıl sığdırırım&quot; sorusu anlamını yitirir. Yerine daha zor bir soru gelir: hangi birkaç şeye gerçekten yer açacaksınız ve hangilerini bilerek ihmal edeceksiniz? Burkeman bu ihmali seçimin kaçınılmaz bedeli olarak görür. Her evet, başka bir şeye söylenmiş bir hayırdır.</p><p>Bu kabul Burkeman&#x27;ın kitabında kaygı verici olmaktan çok rahatlatıcı bir şey olarak anlatılır. Her şeyi yapamayacağınız zaten baştan bellidir. Yetişemediğiniz şeyler bir başarısızlığın işareti olmaktan çıkar, sınırlı bir ömrün olağan sonucu olur. Burkeman bu yüzden önemli işlere yer açmak için sıradan, hatta hoş işlerden vazgeçmeyi göze almak gerektiğini söyler.</p><p>Rahatlama da bitmeyecek bir listeyle barışmaktan gelir. Seçtiğiniz işe daha rahat dikkat verirsiniz, çünkü öbürlerini bilerek bir kenara koymuşsunuzdur. Burkeman&#x27;ın kitabı yetişemediğiniz şeylerle ilgili suçluluğu azaltmayı da amaçlar: yetişilemeyecek bir listeyle yarışmaktan vazgeçmek, kendi ölçülerinizle yaşamaya yer açar.</p></section><section class=\"s s-lessons\"><h4>lessons <em>44</em></h4><div class=\"lesson\"><b>Zamanı yönetmek, neyi bırakacağınıza karar vermektir.</b> Küçük bir atölye sahibi her müşterinin her isteğine evet derse hiçbir işi güzel yapamaz. Birkaç işi seçip diğerlerine açıkça hayır dediğinde elindeki işe gerçekten zaman ayırabilir. Aynı seçimi kendi gününüzde yaptığınızda, yapamadıklarınız sizi suçlu hissettirmeden önceliklerinizi görmenizi sağlar.</div></section><section class=\"s s-reflect\"><h4>reflect <em>12</em></h4><div class=\"ask\">Bu hafta hangi işe ya da isteğe açıkça ve bilerek hayır diyeceksiniz?</div></section><section class=\"s s-use\"><h4>use <em>76</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekibinize bir proje daha ekleniyor</p><p class=\"say\">&quot;Bir ömür dört bin hafta ise bu proje o haftalardan birkaçı. Bunu alırsak hangisinden vazgeçeceğimizi birlikte seçelim, yoksa şimdilik hayır diyorum.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Yapılacaklar listeniz her gün yeniden doluyor</p><p class=\"say\">&quot;Bu listeyi bitirmeyeceğim. Bugün yalnızca iki işe gerçekten yer ayırıyorum, gerisi bilerek beklesin.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Her çağrıya evet demekten yoruldunuz</p><p class=\"say\">&quot;Hafta sonu için iki şeyi seçtim. Diğerlerine hayır diyorum ve bunu açıkça söylemek bana daha doğru geliyor.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Dört bin haftalık bir ömürde her evet bir hayırdır; neyi bilerek bıraktığınızı yazın.</div></section>", "counts": {"open": 27, "story": 237, "lessons": 44, "reflect": 12, "use": 76, "pocket": 13}, "total": 409, "var": "<div class=\"v\"><b>punchline</b> Ortalama bir ömür yaklaşık dört bin hafta sürüyor, e-posta kutunuz ise hiç boşalmıyor.</div><div class=\"v\"><b>thirty_sec</b> Gazeteci Oliver Burkeman yıllarca verimlilik üzerine yazdı ve tekniklerin hepsini denedi. Sonunda iki şeyi gördü: insan ömrü kabaca dört bin hafta ve verimli oldukça işin azalmıyor, e-posta ve liste yeniden doluyor. Çıkış olarak her şeye yetişme hayalini bıraktı. Önemli birkaç işe yer açıp gerisini bilerek ihmal etmeyi seçti.</div><div class=\"v\"><b>key_contrast</b> Yetişmek yerine seçmek</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>40</em></h4><p>Seksen yaşına kadar yaşayan bir insanın ömrü toplam dört bin haftadan biraz fazladır. Gazeteci Oliver Burkeman, yıllarca verimlilik köşesi yazıp her zaman yönetimi tekniğini kendi üzerinde denedikten sonra <i>Four Thousand Weeks (Dört Bin Hafta)</i> kitabında bu sayıyı masanın ortasına koyar.</p></section><section class=\"s s-story\"><h4>story <em>254</em></h4><p>Oliver Burkeman uzun yıllar boyunca gazetede verimlilik üzerine yazılar yazdı. Sabah rutinlerini, renkli yapılacaklar listelerini, gelen kutusunu sıfırlama yöntemlerini ve zaman bloklama tekniklerini tek tek denedi. Başlangıçta her yeni yöntem işe yarayacakmış gibi görünüyordu: doğru sistemi kurduğunda nihayet bütün işlerine yetişecek, zihni ferahlayacak ve asıl önem verdiği şeylere sıra gelecekti.</p><p>Ama o gün hiç gelmedi. Üstelik Burkeman ne kadar hızlanırsa o kadar bunaldığını fark etti.</p><p>Kitapta buna &quot;verimlilik tuzağı&quot; adını verir. E-postalara çok hızlı yanıt veren biri olarak tanındığınızda ne olur? İnsanlar size daha çok e-posta gönderir. Masanızdaki işleri herkesten çabuk bitirdiğinizde ödülünüz boş bir öğleden sonra değil, masanıza bırakılan yeni dosyalar olur. Yapılacaklar listesini boşaltmak için gaza bastıkça liste alttan yeniden dolar. Sınırsız talebi daha yüksek hızla eritmeye çalışmak, sadece çarkın daha hızlı dönmesine yol açar.</p><p class=\"hl\">Daha verimli olmak iş yükünü azaltmaz; üzerinize daha çok iş çeker.</p><p>Burkeman&#x27;a göre asıl yanılgı, zamanı bir gün tamamen kontrol altına alabileceğimiz ve önemli görünen her şeyi dört bin haftaya sığdırabileceğimiz hayalidir. Bu hayal sürdüğü sürece insan hiçbir seçimi tam olarak sahiplenemez; bir işi yaparken aklı hep dışarıda kalan diğer on işte kalır.</p><p>Çıkış yolu daha zekice bir uygulama indirmek değil, kendi sınırını baştan kabul etmektir. Zamanımız kısıtlı olduğu için her gün bir şeyleri yarım bırakmaya veya tamamen kaçırmaya zaten mahkûmuz. Bu gerçeği kabullendiğinizde soru kökten değişir: &quot;Bu hafta her şeyi nasıl yetiştireceğim?&quot; sorusu kapanır, yerine &quot;Bu hafta hangi işlerin yarım kalmasına bilerek ve gönül rahatlığıyla izin vereceğim?&quot; sorusu gelir.</p><p>Ancak neyi dışarıda bırakacağınıza kendiniz karar verdiğinizde, seçtiğiniz bir iki önemli işe gerçekten orada olarak zaman ayırabilirsiniz.</p></section><section class=\"s s-lessons\"><h4>lessons <em>54</em></h4><div class=\"lesson\"><b>Her şeye yetişme çabası, en önemli işinizi sıradan işlerin insafına bırakır.</b> Hafta sonu hem evi dip bucak temizlemeye, hem bütün mesajlara dönmeye, hem de çocuğuyla vakit geçirmeye çalışan bir ebeveyn, günü yorgun ve kimseye tam odaklanamamış hâlde kapatır. Yapamayacağınız işleri sabahın başında bilerek elediğinizde, geriye kalan tek işe suçluluk duymadan ve bölünmeden kendinizi verebilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>20</em></h4><div class=\"ask\">Bu hafta gerçekten önem verdiğiniz bir işe yer açmak için hangi ikincil işi bilerek ertelemeye ya da tamamen bırakmaya razısınız?</div></section><section class=\"s s-use\"><h4>use <em>101</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekip toplantısında zaten dolu olan haftalık plana üç yeni iş daha eklenmeye çalışılıyor</p><p class=\"say\">&quot;Burkeman&#x27;ın verimlilik tuzağı dediği yerdeyiz; listeyi hızla erittikçe üstüne yenisi biniyor. Bu üç işi alacaksak mevcut listeden hangisini bilerek dışarıda bırakıyoruz?&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Sabah uzun bir yapılacaklar listesine bakıp nereden başlayacağınızı şaşırdığınızda</p><p class=\"say\">&quot;Bugün bu listenin tamamı bitmeyecek. Şimdi en önemli iki işi seçeceğim, geri kalanların bugün yapılmamasına baştan razı olacağım.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Bir çalışma arkadaşınız her gelen talebe evet dediği için asıl projesini ilerletemiyor</p><p class=\"say\">&quot;Her talebe hızlı döndükçe sana daha çok iş geliyor. Asıl projeyi bitirene kadar hangi taleplere geç döneceğimizi birlikte seçelim.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Dört bin haftaya her şey sığmaz; zamanı yönetmek, neyi bilerek dışarıda bırakacağını seçmektir.</div></section>", "counts": {"open": 40, "story": 254, "lessons": 54, "reflect": 20, "use": 101, "pocket": 13}, "total": 482, "var": "<div class=\"v\"><b>punchline</b> Oliver Burkeman&#x27;a göre e-postalara ne kadar hızlı dönerseniz size o kadar çok e-posta gelir; verimlilik artışı boş zaman değil, yeni iş üretir.</div><div class=\"v\"><b>thirty_sec</b> Yıllarca verimlilik köşesi yazan Oliver Burkeman, ortalama insan ömrünün yaklaşık dört bin hafta olduğunu hatırlatır. Her tekniği denedikten sonra &#x27;verimlilik tuzağı&#x27;nı fark eder: işleri ne kadar hızlı bitirirseniz üzerinize o kadar çok iş gelir ve liste hiç boşalmaz. Burkeman&#x27;a göre çözüm her şeye yetişme hayalini bırakıp, önemli birkaç işe yer açmak için geri kalanları bilerek dışarıda bırakmaktır.</div><div class=\"v\"><b>key_contrast</b> Daha hızlı yetişmek ve bilerek vazgeçmek</div>"}}, {"id": 1787, "title": "Suyun Sessiz Gücü", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>29</em></h4><p>Tao Te Ching&#x27;e göre dünyada sudan yumuşak bir şey yoktur. Yine de sert ve güçlü olanı aşındırmakta ondan iyisi de yoktur. Metin bu çelişkiyi bir güç tarifi olarak sunar.</p></section><section class=\"s s-story\"><h4>story <em>261</em></h4><p><i>Tao Te Ching</i>, geleneksel olarak Lao Tzu&#x27;ya atfedilen, seksen bir kısa bölümden oluşan bir metindir. Çoğu bölüm birkaç satırdır ve güçten yönetime, yaşamdan ölüme kadar geniş bir alanı sade imgelerle anlatır. En bilinen imgesi sudur.</p><p>Metne göre su, içine konduğu kabın biçimini alır. Hiçbir kalıba direnmez. Herkesin kaçındığı alçak yerlere akar. Yine de sert ve güçlü olanı aşındırmada ondan iyisi yoktur. Yumuşak olan, sert olanı yener.</p><p class=\"hl\">Metnin iddiası, gücün sertlikte değil esneklikte yattığıdır.</p><p>Bölümlerde aynı yöntem tekrar eder: alışılmış değere tersinden bakılır. Metne göre bir çömlek balçıktan yapılır ama işe yarayan içindeki boşluktur. Bir odayı işe yarar kılan da duvarlar kadar aralarındaki boşluktur. Su örneği de bu çizgidedir: en yumuşak olan, sert olanın yapamadığını yapar.</p><p>Aynı düşünce, metinden çıkarılan &quot;wu wei&quot; kavramında toplanır. Genellikle &quot;zorlamadan eylemek&quot; diye anlaşılır. Bir işi akışına karşı zorlamak yerine akışı okuyup ona göre davranmak olarak yorumlanır.</p><p>Bir bölümde en yüksek iyilik de suya benzetilir. Su her şeye fayda sağlar ve onlarla yarışmaz. Başkalarının kaçındığı yerlere yerleşir. Metin bu imgeyle, gücün gösterişten uzakta ve fark edilmeden çalışabileceğini söyler.</p><p>Başka bir bölümde metin bu ayrımı yaşamla ilişkilendirir. Canlı bitkinin yumuşak ve nemli, ölü olanın kuru ve sert olduğunu söyler. Sert ve esnemeyen olan ölümün yoldaşıdır, yumuşak ve boyun eğen olan yaşamın. Bu cümleler, gücü sertlikle ölçmeye alışkın bir okur için tuhaf gelir.</p><p>Tao Te Ching&#x27;in bu imgelerde savunduğu şey, pasif kalmak değildir. Su da hareket eder, aşındırır, yol bulur. Fark, gücünü karşısındakine yüklenerek değil, bulunduğu yerin biçimine uyup sürekli akarak kullanmasıdır. Metin birçok farklı çeviriyle okunur ve ifadeler çeviriye göre değişir, ama su imgesi hepsinde aynı yerde durur.</p></section><section class=\"s s-lessons\"><h4>lessons <em>44</em></h4><div class=\"lesson\"><b>Zorlamadan önce akışı okuyun.</b> Ekip arkadaşınız her önerinize cephe alıyorsa sesinizi yükseltmek direnci artırır. Önce onun neye itiraz ettiğini dinlediğinizde konuyu başka bir yönden açabilir ve aynı yere daha az sürtünmeyle varabilirsiniz. Böylece inada giden güç, doğru anı beklemeye ve doğru yerden başlamaya ayrılır.</div></section><section class=\"s s-reflect\"><h4>reflect <em>12</em></h4><div class=\"ask\">Şu anda zorladığınız hangi işte bir adım geri çekilip akışını izlemeyi deneyebilirsiniz?</div></section><section class=\"s s-use\"><h4>use <em>74</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Karşı fikirdeki biri her önerinizi geri çeviriyor</p><p class=\"say\">&quot;Sert konuşmak yerine neyi korumaya çalıştığını dinleyeyim. Sonra aynı hedefe başka bir yoldan gitmeyi önerebilirim.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Evde bir konuda kimse geri adım atmıyor</p><p class=\"say\">&quot;Tao Te Ching&#x27;de su kayayı zorlayarak değil, sürekli akarak aşındırıyor. Bugün konuyu kapatalım, yarın yeniden konuşalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Bir işi zorlayarak ilerletmeye çalışıyorsunuz</p><p class=\"say\">&quot;Bu iş bugün zorla ilerlemiyor. Yarım saat başka bir işe geçip akışın nereye gittiğine bakacağım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>11</em></h4><div class=\"pocket\">Su kalıba uyar ve kayayı aşındırır; zorlamadan önce işin akışını okuyun.</div></section>", "counts": {"open": 29, "story": 261, "lessons": 44, "reflect": 12, "use": 74, "pocket": 11}, "total": 431, "var": "<div class=\"v\"><b>punchline</b> Tao Te Ching&#x27;e göre dünyadaki en yumuşak şey olan su, sert olanı aşındırmakta hâlâ en etkilisidir.</div><div class=\"v\"><b>thirty_sec</b> Tao Te Ching, seksen bir kısa bölümden oluşan eski bir metindir ve en bilinen imgesi sudur. Su hiçbir kalıba direnmez, her kabın biçimini alır, en alçak yere akar. Yine de sert olanı aşındırmada ondan iyisi yoktur. Metin gücü sertlikte değil esneklikte arar. Wu wei denen fikir de bunu anlatır: bir işi zorlamak yerine akışını okuyup ona göre davranmak.</div><div class=\"v\"><b>key_contrast</b> Sertlik ve esneklik</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>52</em></h4><p>Yaklaşık iki bin dört yüz yıl önce Çin&#x27;de derlenen <i>Tao Te Ching</i>, seksen bir kısa bölüm boyunca güç hakkında alışılmışın tam tersi bir iddia ortaya atar. Lao Tzu&#x27;ya göre dünyada sudan daha yumuşak ve daha uysal hiçbir şey yoktur; fakat sert ve katı olanı alt etmekte hiçbir şey suyun eline su dökemez.</p></section><section class=\"s s-story\"><h4>story <em>237</em></h4><p>Lao Tzu&#x27;nun <i>Tao Te Ching</i> metni, liderliğin ve gücün sertlikle, baskıyla ve boyun eğdirmeyle ölçüldüğü bir çağda kaleme alındı. Metin bu anlayışın karşısına doğadan çok sade bir gözlem çıkarır: yaşayan bir insanın bedeni, yeni filizlenen bir ot ya da genç bir dal yumuşak ve esnektir; öldüklerinde ise kurur, katılaşır ve kolayca kırılırlar. Yani katılık gücün değil, tükenişin işaretidir.</p><p>Metnin en bilinen imgesi sudur. Su, önüne çıkan kayayla kafa kafaya çarpışmaz. Girdiği kabın şeklini alır, kimsenin gitmek istemediği en alçak çukurlara doğru akar ve hiçbir biçime direnmez. Dışarıdan bakıldığında kayanın yanında tamamen güçsüz görünür. Oysa zaman içinde vadiyi biçimlendiren ve o sert kayayı delip geçen şey kayanın kendi ağırlığı değil, suyun vazgeçmeyen akışıdır.</p><p class=\"hl\">Sert olan kırılır; yumuşak ve esnek olan ise direnmeden aşındırarak kazanır.</p><p>Bu gözlem Tao düşüncesinin merkezindeki &quot;wu wei&quot; kavramında toplanır. Kelime anlamıyla &quot;zorlamadan eylemek&quot; ya da &quot;doğal akışa karşı kürek çekmemek&quot; demektir. Lao Tzu bunu hareketsiz kalmak veya tembellik etmek anlamında kullanmaz. İyi bir yüzücünün nehrin akıntısıyla kavga etmek yerine akıntının yönünü okuyup gücünü ona göre kullanması gibi, koşulların olgunlaşmasını beklemek ve gereksiz sürtüşmeden kaçınmaktır.</p><p>Bir yönetici, bir müzakereci ya da bir zanaatkâr bir engelle karşılaştığında ilk dürtüsü genellikle daha çok baskı uygulamak olur. Oysa baskı karşı tarafta anında direnç doğurur. <i>Tao Te Ching</i>, iki bin yılı aşkın süredir stratejiden gündelik ilişkilere kadar okuyan herkese aynı soruyu bıraktı: Önünüzdeki engeli kırmak için mi uğraşıyorsunuz, yoksa su gibi etrafından dolaşıp onu zamanla eritecek yolu mu arıyorsunuz?</p></section><section class=\"s s-lessons\"><h4>lessons <em>67</em></h4><div class=\"lesson\"><b>Kaba kuvvet direnç üretir, esnek ısrar ise engeli içeriden çözer.</b> Yeni bir çalışma yöntemini ekibine tek bir sert talimatla dayatan bir yönetici, görünürde itaat alsa bile perde arkasında ayak diremeyle karşılaşır; oysa yöntemi küçük bir alanda deneyip sonuçlarını göstererek ilerleyen biri, kimseyle bilek güreşine girmeden bütün ekibi dönüştürür. Bir engelle karşılaştığınızda ilk tepki olarak baskıyı artırmak yerine koşulun doğal akışını okumak, gücünüzü boşa harcamadan sonuç almanızı sağlar.</div></section><section class=\"s s-reflect\"><h4>reflect <em>16</em></h4><div class=\"ask\">Şu sıralar hayatınızda inatla zorlayarak çözmeye çalıştığınız hangi sorunu, baskıyı bırakıp su gibi etrafından dolaşarak aşabilirsiniz?</div></section><section class=\"s s-use\"><h4>use <em>90</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Müzakerede veya toplantıda karşı taraf kendi pozisyonunda katılaştığında</p><p class=\"say\">&quot;Lao Tzu&#x27;nun su benzetmesindeki gibi kafa kafaya çarpışmayalım. İkimizin de kabul edebileceği en küçük ortak adımdan başlayıp gerisini zamana yayalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Ekibinizden biri yeni bir sürece sert tepki gösterdiğinde</p><p class=\"say\">&quot;Seni hemen ikna etmeye çalışmayacağım. Sadece bu hafta bir kez deneyelim, aksayan yerleri cuma günü senin gözlemlerinle birlikte düzeltelim.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Bir işi zorlayarak çözmeye çalışırken tıkandığınızı hissettiğinizde</p><p class=\"say\">&quot;Aynı kapıyı daha sert yumruklamak işe yaramıyor. Bir adım geri çekilip bu işin en az dirençle akacağı yolu arayacağım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>11</em></h4><div class=\"pocket\">Su kayayla kavga etmez; etrafından akar ve sonunda vadiyi o biçimlendirir.</div></section>", "counts": {"open": 52, "story": 237, "lessons": 67, "reflect": 16, "use": 90, "pocket": 11}, "total": 473, "var": "<div class=\"v\"><b>punchline</b> Lao Tzu&#x27;ya göre dünyada sudan daha yumuşak bir şey yoktur, ama en sert kayayı delmekte hiçbir güç suyun sabırlı akışını geçemez.</div><div class=\"v\"><b>thirty_sec</b> Yaklaşık iki bin dört yüz yıl önce derlenen Tao Te Ching, gücü sertlikte değil suyun doğasında arar. Su hiçbir engele kafa tutmaz, her çukura uyum sağlar ve en alçak yere akar; yine de vadileri oyan ve kayaları aşındıran odur. Lao Tzu buna &#x27;wu wei&#x27;, yani zorlamadan eylemek der: akıntıyla kavga etmek yerine onu okuyup doğru zamanda hareket etmek.</div><div class=\"v\"><b>key_contrast</b> Kırılan sertlik ve aşındıran esneklik</div>"}}, {"id": 1788, "title": "Aslandan Kaçan Zebra", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>24</em></h4><p>Aslan gittiğinde zebra otlamaya geri döner. Robert Sapolsky&#x27;ye göre insanla zebra arasındaki asıl fark tam burada başlar: zebra alarmı kapatabilir, insan çoğu zaman kapatamaz.</p></section><section class=\"s s-story\"><h4>story <em>231</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> kitabına savanadaki bir sahneyle girer. Zebra otlarken bir aslan belirir ve zebra kaçmaya başlar. O anda beden bir acil durum planına geçer. Kalp hızlanır, kaslara enerji gider, sindirim gibi o an gerekmeyen işler askıya alınır. Bu düzen, tehlikeden kurtulmak için çok iyi çalışır.</p><p>Sonra ya zebra kaçar ya da yenir. Kaçarsa birkaç dakika içinde sakinleşir ve yine ot yer. Alarm kapanmıştır.</p><p class=\"hl\">İnsan bu alarmı aslan olmadan da çalıştırabilir.</p><p>Sapolsky&#x27;ye göre insanlar yalnızca düşünerek bile aynı stres tepkisini devreye sokar. Kira ödemesini, yaklaşan bir sınavı ya da yıllar sonraki bir riski düşünürken beden, sanki bir aslandan kaçıyormuş gibi hazırlanır. Üstelik bu düşünceler aslan gibi gelip gitmez. Günlerce, aylarca sürebilir.</p><p>Zebra için stres kaynağı çoğunlukla fiziksel bir acil durumdur: kaçar ya da yakalanır. İnsanın stres kaynakları ise çoğu zaman fiziksel olmayan, psikolojik ve toplumsal şeylerdir: iş, ilişkiler, para. Beden bunları da bir aslanmış gibi karşılar ama koşacak bir yer yoktur. Hazırlanan enerji kullanılmaz, alarm açık kalır.</p><p>Kitabın adını veren fark da burada ortaya çıkar. Zebra için stres kısa ve nadirdir, çünkü tehlike gerçekten bittiğinde tepki de biter. İnsanda tehlike kafada yaşadığı için tepki bitmez. Sürekli koşmaya hazırlanıp hiç koşmayan bir beden, zamanla bunun bedelini öder.</p><p>Sapolsky bu bedelin neler olduğunu kitabın geri kalanında ayrıntılarıyla anlatır. Bu bölümün sorusu daha basittir: bedeninizi şu an harekete geçiren şey gerçek bir tehlike mi, yoksa sizin kurduğunuz bir düşünce mi?</p></section><section class=\"s s-lessons\"><h4>lessons <em>48</em></h4><div class=\"lesson\"><b>Alarmı çalıştıranın aslan mı düşünce mi olduğuna bakın.</b> Yarınki toplantıda müşterinin kızacağını düşünen kişinin kalbi bugünden hızlanır. Düşünce gerçek bir tehlikeymiş gibi bedeni harekete geçirir ama koşacak bir yer yoktur. Bunu fark ettiğinizde ortada gerçekten çözülecek bir şey olup olmadığını sorabilir ya da kısa bir yürüyüşle alarmı kapatabilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>15</em></h4><div class=\"ask\">Bugün bedeninizi alarma geçiren şey gerçek bir aslan mıydı, yoksa kafanızda dönen bir düşünce mi?</div></section><section class=\"s s-use\"><h4>use <em>72</em></h4><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Akşam yatağa girince yarınki sunum aklınıza geliyor</p><p class=\"say\">&quot;Kalbim hızlandı ama ortada aslan yok, bu bir düşünce. Yarınki işi sabaha bırakıp nefesimi yavaşlatıyorum.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Eşiniz mali bir kaygıyla geriliyor</p><p class=\"say\">&quot;Sapolsky&#x27;nin zebrası aslan gidince rahatlıyor. Rakamlara birlikte bakalım, bu akşam kapatıp yarın devam edelim.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Ekip arkadaşınız sürekli tetikte görünüyor</p><p class=\"say\">&quot;Son zamanlarda hep gergin görünüyorsun. Bu gerçekten acil bir şey mi, yoksa bir endişe mi? Birlikte ayıralım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>11</em></h4><div class=\"pocket\">Zebra tehlike bitince rahatlar; kafanızdaki aslan için alarmı kendiniz kapatmayı deneyin.</div></section>", "counts": {"open": 24, "story": 231, "lessons": 48, "reflect": 15, "use": 72, "pocket": 11}, "total": 401, "var": "<div class=\"v\"><b>punchline</b> Zebra aslan gidince rahatlar; insan aynı alarmı yalnızca bir düşünceyle günlerce açık tutabilir.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky, savanada aslandan kaçan bir zebrayı anlatır. Kalbi hızlanır, kasları enerji alır, sindirimi durur. Aslan gidince alarm kapanır ve zebra yine otlar. İnsanda ise aynı tepki kira, sınav ya da gelecek düşüncesiyle bile devreye girer ve günlerce kapanmaz. Sapolsky&#x27;ye göre sorun alarmın kendisi değil, tehlike kafada yaşadığı için hiç kapanmamasıdır.</div><div class=\"v\"><b>key_contrast</b> Aslan ya da düşünce</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>58</em></h4><p>Serengeti düzlüğünde otlayan bir zebra, çalıların arasından fırlayan bir aslan gördüğü anda canını kurtarmak için depara kalkar. Kalbi deli gibi çarpar, nefesi hızlanır, kanı kaslarına hücum eder. Nörobiyolog Robert M. Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers (Zebralar Neden Ülser Olmaz)</i> kitabına bu kaçış sahnesiyle başlar; çünkü birkaç dakika sonra olacak şey insanla zebra arasındaki en büyük farkı gösterir.</p></section><section class=\"s s-story\"><h4>story <em>249</em></h4><p>Zebra aslandan kaçarken bedeni milyonlarca yıllık evrimin kusursuzlaştırdığı bir acil durum planını devreye sokar. Beyin tehlikeyi görür görmez böbreküstü bezlerine emir gönderir; kana adrenalin ve kortizol pompalanır. Kasların anında enerjiye ihtiyacı olduğu için depolanmış şeker ve yağ kana karışır. O sırada acil olmayan ne varsa kapatılır: sindirim durur, büyüme hormonları baskılanır, bağışıklık beklemeye alınır. O üç dakikalık koşuda öğle yemeğini sindirmenin hiçbir önemi yoktur; tek hedef pençeden kurtulmaktır.</p><p>Zebra ya yakalanır ve hikâye orada biter ya da aslanı atlatıp kurtulur. Aslan vazgeçtiği anda zebranın bedeni alarm şalterini indirir. Birkaç dakika içinde kalp atışı yavaşlar, hormonlar normal seviyesine çekilir ve zebra hiçbir şey olmamış gibi kaldığı yerden otlamaya döner.</p><p>Sapolsky bundan sonra kamerayı modern insana çevirir. Bizim bedenimizde de zebranınkiyle birebir aynı kimyasal sistem çalışır. Evrim bize yeni bir stres donanımı vermemiştir.</p><p class=\"hl\">İnsan, zebranın yalnızca aslan gördüğünde çalıştırdığı o ilkel alarmı tek bir düşünceyle saatlerce ve aylarca açık tutabilir.</p><p>Gece yatağa uzandığınızda aklınıza gelecek ayın kira ödemesi, üç hafta sonraki bir denetim ya da yıllar sonraki emeklilik hesabınız gelir. Odaya giren bir aslan yoktur, koşmanız gereken bir düzlük yoktur; ama beyniniz aynı tehlike düğmesine basar. Kalbiniz hızlanır, kortizol yükselir, sindiriminiz yavaşlar.</p><p>Zebra için stres çok nadir ve birkaç dakikalık bir fırtınadır. Bizim içinse hiç dinmeyen, düşük şiddetli ama sürekli bir yağmura dönüşmüştür. Sürekli koşmaya hazırlanan ama koltuğundan hiç kalkmayan bir beden, sonunda kendi acil durum yakıtıyla kendi dokularını yıpratmaya başlar. Sapolsky&#x27;nin kitabına adını veren gerçek budur: zebralar ülser olmaz, çünkü aslan gidince tehlike biter; biz ise aslanı kafamızın içinde yaşatırız.</p></section><section class=\"s s-lessons\"><h4>lessons <em>58</em></h4><div class=\"lesson\"><b>Beden gerçek tehlike ile zihindeki senaryoyu birbirinden ayırt edemez.</b> Cuma günü yapılacak bir konuşmayı pazartesi gecesinden itibaren kafasında kurup uykusuz kalan bir çalışan, tek bir konuşma için bedenine beş gün boyunca kesintisiz alarm yaşatır. Sizi geren bir düşünce belirdiğinde şu an fiziksel olarak yapabileceğiniz somut bir adım olup olmadığını sormak, gereksiz yere açık kalan alarmı kapatmanıza yardım eder.</div></section><section class=\"s s-reflect\"><h4>reflect <em>23</em></h4><div class=\"ask\">Bugün bedeninizi geren ve kalbinizi hızlandıran şey o an müdahale edebileceğiniz gerçek bir sorun muydu, yoksa henüz gelmemiş bir günün zihninizdeki provası mıydı?</div></section><section class=\"s s-use\"><h4>use <em>109</em></h4><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Gece yatağa girdiğinizde yarınki işleri düşünüp gerildiğinizi fark ettiğinizde</p><p class=\"say\">&quot;Şu an odada bir aslan yok ve gece saat on ikide bu iş için yapabileceğim bir hamle yok. Yapılacak ilk adımı kâğıda yazıp alarmı sabaha kadar kapatacağım.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Ekibinizden biri haftalar sonraki bir ihtimal yüzünden bugünden paniğe kapıldığında</p><p class=\"say\">&quot;Sapolsky&#x27;nin zebra örneğindeki gibi haftalar sonraki ihtimal için bugünden alarmda kalmayalım. Bugün elimizden gelen hazırlığı yapıp gerisini zamanı gelince konuşalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Evde bir yakınınız henüz olmamış bir aksilik üzerine üst üste senaryolar kurduğunda</p><p class=\"say\">&quot;Bedenin şu an bu ihtimali gerçek bir tehlike gibi yaşıyor. Gel sadece yarın sabah atacağımız ilk adımı netleştirelim, bu akşamı dinlenerek geçirelim.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>12</em></h4><div class=\"pocket\">Zebranın alarmı aslan gidince kapanır; henüz gelmemiş tehlikeyi kafanızda taşıyıp bedeninizi yormayın.</div></section>", "counts": {"open": 58, "story": 249, "lessons": 58, "reflect": 23, "use": 109, "pocket": 12}, "total": 509, "var": "<div class=\"v\"><b>punchline</b> Bir zebra aslandan kurtulduktan birkaç dakika sonra sakinleşip otlamaya döner; insan ise aynı stres alarmını tek bir düşünceyle aylarca açık tutar.</div><div class=\"v\"><b>thirty_sec</b> Nörobiyolog Robert Sapolsky, Serengeti&#x27;de aslandan kaçan bir zebranın kalbinin hızlandığını ve kaslarının yakıtla dolduğunu, ama aslan vazgeçince birkaç dakikada her şeyin normale döndüğünü anlatır. İnsanda da aynı ilkel stres sistemi vardır; farkımız, kira ya da gelecek kaygısı gibi düşüncelerle bu alarmı aylarca açık tutmamızdır. Zebralar ülser olmaz, çünkü tehlike geçince stresleri de biter.</div><div class=\"v\"><b>key_contrast</b> Akut kaçış ve kronik düşünce</div>"}}, {"id": 1789, "title": "Bedenin Yakıtı Yanlış Yere Akınca", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>30</em></h4><p>Beyin tehlike algıladığı anda beden, o an gerekmeyen her şeyi kapatmaya başlar: sindirimi, büyümeyi, üremeyi. Robert Sapolsky bu düzeni bir kaynak yönetimi olarak anlatır ve asıl tehlikeyi kapatma tuşunda arar.</p></section><section class=\"s s-story\"><h4>story <em>246</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> kitabında stres tepkisini bir kaynak yönetimi olarak anlatır. Beyin bir tehlike algıladığında adrenalin ve kortizol salgılanır. Kalp hızlanır, kaslara şeker ve yağ gönderilir, tansiyon yükselir.</p><p>Tepkinin bir hızlı, bir de daha yavaş kolu vardır. Adrenalin saniyeler içinde devreye girer. Kortizol biraz sonra gelir ve daha uzun süre etkili olur.</p><p>Aynı anda beden uzun vadeli işleri askıya alır. Sindirim yavaşlar, büyüme ve üreme ile ilgili süreçler bekler, bağışıklık sisteminin bazı işleri geriye çekilir. Mantığı açıktır: kaçarken yemek sindirmenin ya da dokuyu onarmanın sırası değildir. Kısa bir kaçış için bu düzen çok verimlidir, çünkü enerjinin tamamı acil işe yönelir.</p><p class=\"hl\">Asıl sorun, sistemin kapanmayıp haftalarca açık kalmasıdır.</p><p>Sapolsky bu durumun nasıl yıpratıcı hâle geldiğini adım adım gösterir. Uzun süre yüksek kalan stres hormonları tansiyonu ve kalp-damar sistemini zorlar, bağışıklığı zayıflatır, hafızayla ilişkili beyin bölgelerini etkiler ve sindirimi bozar. Bu zararların her biri, o an ertelenmesi mantıklı olan işlerin aylarca ertelenmesinden doğar.</p><p>Sağlık sorunlarının çoğu bu yavaş birikimden gelir: tek bir büyük darbeden değil, her gün biraz daha ertelenen onarımlardan.</p><p>Sapolsky&#x27;nin savı şudur: stresle ilişkili hastalıkların çoğu, tepkinin kendisinden değil, onun gereğinden uzun süre açık kalmasından doğar. Tansiyonun kaçış anında yükselmesi akıllıca bir hamledir. Aynı yükseklik yıllarca sürdüğünde damarlar zorlanır. Savunma, saldıran bir güce dönüşür.</p><p>Bu yüzden Sapolsky stresin kendisini düşman olarak sunmaz. Kısa süreli stres hayat kurtarır. Zarar veren, kapatma düğmesine hiç basılmamasıdır. Bugünkü hayatta düğmeyi açık tutan şey çoğunlukla bir aslan olmaz, bitmeyen küçük baskılar olur: iş yükü, belirsizlik, uykusuz geceler.</p></section><section class=\"s s-lessons\"><h4>lessons <em>44</em></h4><div class=\"lesson\"><b>Ertelediğiniz onarımlar bir gün sıraya gelir.</b> Aylarca yoğun çalışan bir esnaf bu süre boyunca uykusunu, düzenli yemeğini ve hastayken dinlenmeyi erteler. Bunlar bedenin onarım işleridir ve yoğunluk geçmeden yapılmazlar. Bunu bildiğinizde uzun süren bir yoğunluğun içinde bile bir onarım işine küçük bir yer açabilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>9</em></h4><div class=\"ask\">Sürekli acil durum modundaysanız bedeniniz hangi onarımı erteliyor olabilir?</div></section><section class=\"s s-use\"><h4>use <em>67</em></h4><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Haftalardır yeterince uyuyamıyorsunuz</p><p class=\"say\">&quot;Beden acil durumda onarımı erteliyor. Bu hafta iki akşam uykuya öncelik veriyorum, gerisi sıraya girsin.&quot;</p></div><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekip aylardır sürekli yetiştirme modunda</p><p class=\"say\">&quot;Sürekli acil durum herkesin onarımını erteliyor. Bu teslimden sonra bir hafta yeni iş almayalım, toparlanalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Yakınınız yoğunluktan sürekli hasta oluyor</p><p class=\"say\">&quot;Yoğunluk bitmiyor diye bedenin toparlanmasına yer bırakmamak zor. Bu hafta sonu hiçbir plan yapmayalım, dinlenelim.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>9</em></h4><div class=\"pocket\">Stres alarmı hayat kurtarır; kapatmayı unuttuğunuz alarm onarımları erteler.</div></section>", "counts": {"open": 30, "story": 246, "lessons": 44, "reflect": 9, "use": 67, "pocket": 9}, "total": 405, "var": "<div class=\"v\"><b>punchline</b> Sapolsky&#x27;ye göre stres alarmı hayat kurtarır; zarar veren alarmın çalması değil, kapanmamasıdır.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky stres tepkisini bir kaynak yönetimi olarak anlatır. Tehlike algılanınca adrenalin ve kortizol salgılanır, kalp hızlanır, kaslara enerji gider. Aynı anda sindirim, büyüme ve onarım gibi uzun vadeli işler askıya alınır. Kısa bir kaçış için bu mükemmeldir. Haftalarca açık kaldığında ise tansiyon, bağışıklık ve hafıza yıpranır.</div><div class=\"v\"><b>key_contrast</b> Alarm ve onarım</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>42</em></h4><p>Evinizin çatısını onarırken bir anda kasırga çıkarsa, elinizdeki çekici bırakıp pencereleri kapatmaya koşarsınız. Çatı onarımı fırtına geçene kadar bekler. Robert M. Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers (Zebralar Neden Ülser Olmaz)</i> kitabında stres tepkisini tam olarak böyle bir acil bütçe kesintisiyle açıklar.</p></section><section class=\"s s-story\"><h4>story <em>248</em></h4><p>Beyniniz bir tehlike sezdiği saniyede bedenin bütün ekonomi politikası değişir. Adrenalin ve kortizol hormonları kana karışır, kalp atışı ve solunum hızlanır, karaciğerdeki enerji depoları çözülüp bacak kaslarına gönderilir. Kısa süreli bir krizde bu kaynak aktarımı hayat kurtarır.</p><p>Peki kaslara giden bu ek enerji nereden bulunur? Beden, o an acil olmayan bütün uzun vadeli projelerin bütçesini keser. Sindirim sistemi yavaşlatılır. Doku onarımı ve büyüme durdurulur. Üreme hormonları aşağı çekilir. Bağışıklık sistemi bile uzun vadeli taramalarını bırakır. Mantık son derece sağlamdır: önümüzdeki beş dakika içinde bir yırtıcıya yem olacaksanız, mide duvarınızı yenilemenin ya da bir yarayı onarmanın hiçbir acelesi yoktur.</p><p class=\"hl\">Sorun, kısa bir kriz için yapılan bu bütçe kesintisinin haftalarca ve aylarca yürürlükte kalmasıdır.</p><p>Sapolsky, koruyucu mekanizma hiç kapanmadığında bedenin nasıl adım adım hasar aldığını gösterir. Kaslara sürekli yakıt taşımak için yüksek tutulan kan basıncı, zamanla damar duvarlarını aşındırır ve kalp-damar hastalıklarına zemin hazırlar. Sürekli kana pompalanan şeker ve yağ, kullanılmadığı için metabolizmayı bozar. Mide kendi koruyucu mukus tabakasını yenileyemediği ve kan akışı azaldığı için bakterilere ve aside karşı savunmasız kalır. Baskılanan bağışıklık sistemi yüzünden basit enfeksiyonlar bile ağır geçer; uzun süreli yüksek kortizol beynin öğrenme ve hafıza merkezi olan hipokampüsteki bağlantıları zayıflatır.</p><p>Burada Sapolsky çok önemli bir ayrım yapar: stres doğrudan doğruya bir mikrop ya da zehir gibi sizi hasta etmez. Sizi hasta eden şey, bedeninizi korumak için tasarlanmış acil durum sisteminin hiç kapanmaması ve bakım-onarım bütçesini sürekli sıfırda tutmasıdır. Evinizin çatısını her gün yeni bir fırtına korkusuyla aylarca onarmazsanız, evi yıkan şey ilk fırtına değil, sürekli ertelenen bakımdır.</p></section><section class=\"s s-lessons\"><h4>lessons <em>64</em></h4><div class=\"lesson\"><b>Acil durum modu kısa vadede kurtarır, kalıcı olduğunda ise iç onarımı durdurur.</b> Aylarca her haftayı &quot;kriz haftası&quot; ilan edip gece gündüz çalışan bir yazılım ekibi, kısa vadede birkaç özelliği yetiştirse bile kodun bakımını ve kendi dinlenmesini ertelediği için sonunda çok daha büyük arızalarla karşılaşır. Kendi hayatınızda veya işinizde acil durum şalterini ne zaman kapattığınızı takip etmek, uzun vadeli sağlığınızı ve üretiminizi korumanın tek yoludur.</div></section><section class=\"s s-reflect\"><h4>reflect <em>18</em></h4><div class=\"ask\">Son haftalarda sürekli &quot;acil yetiştirme&quot; modunda kaldığınız için kendi bedeninizde veya işinizde hangi temel bakım ve onarımı ertelediniz?</div></section><section class=\"s s-use\"><h4>use <em>105</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekip aylardır aralıksız &quot;acil durum&quot; temposuyla çalıştırılıyor</p><p class=\"say\">&quot;Sapolsky&#x27;nin anlattığı beden ekonomisi gibi, sürekli acil modda kalınca bütün bakım ve onarım duruyor. Bu haftayı yeni kriz açmadan sadece biriken sorunları onarmaya ayıralım.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Haftalardır dinlenmeden çalıştığınızı ve sık sık yorgunluk veya soğuk algınlığı yaşadığınızı fark ettiğinizde</p><p class=\"say\">&quot;Bedenim haftalardır yakıtı sadece acil işlere akıtıyor, onarıma bütçe kalmadı. Bu hafta sonu tüm bildirimleri kapatıp gerçekten dinleneceğim.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Bir arkadaşınız öğle yemeklerini ve uykusunu sürekli iş için feda etmekten övünüyor</p><p class=\"say\">&quot;Kısa bir krizde bu işe yarar ama haftalar sürünce beden onarımı tamamen durduruyor. Bugün en azından yarım saat ekrandan uzaklaşıp yemek yiyelim.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>14</em></h4><div class=\"pocket\">Acil durum yakıtı kısa kaçış içindir; şalteri hiç kapatmazsanız beden kendi onarımına bütçe bulamaz.</div></section>", "counts": {"open": 42, "story": 248, "lessons": 64, "reflect": 18, "use": 105, "pocket": 14}, "total": 491, "var": "<div class=\"v\"><b>punchline</b> Robert Sapolsky&#x27;ye göre stresin kendisi doğrudan hastalık yapmaz; hastalık, acil durum için sindirim, bağışıklık ve doku onarımını askıya alan sistemin hiç kapanmamasından doğar.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky stres tepkisini zekice bir kaynak yönetimi olarak anlatır: tehlike anında adrenalin ve kortizol enerjiyi kaslara akıtırken sindirim, büyüme, doku onarımı ve bağışıklık gibi uzun vadeli işleri askıya alır. Kısa bir kaçış için bu harikadır. Ama sistem haftalarca açık kalırsa tansiyon yükselir, mide savunması zayıflar ve bağışıklık düşer; beden ertelenen onarımın bedelini öder.</div><div class=\"v\"><b>key_contrast</b> Acil kaçış yakıtı ve ertelenen onarım</div>"}}, {"id": 1790, "title": "Serengeti'de Bir Pavyan Sürüsü", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>16</em></h4><p>Robert Sapolsky yazlarını Doğu Afrika&#x27;da yabani pavyan sürülerini izleyerek geçirdi. Bu hayvanları aslanlar değil, birbirleri yoruyordu.</p></section><section class=\"s s-story\"><h4>story <em>230</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> kitabında laboratuvardan çok sahada geçen bir araştırmasını anlatır. Yıllarca yazlarını Doğu Afrika&#x27;da yabani pavyan sürülerini izleyerek geçirdi. Pavyanlar günün büyük kısmını yiyecek aramak ve dinlenmekle geçirir. Gündelik gerilimlerinin çoğu, sürüdeki diğer hayvanlardan gelir.</p><p>Sapolsky sürüde kimin kime baskı kurduğunu, kimin kimden kaçtığını gözlemledi. Aynı hayvanların kanındaki stres hormonlarını da ölçtü.</p><p class=\"hl\">Pek çok durumda tablo şuydu: hiyerarşinin altındaki erkekler, peşlerinde hiçbir aslan olmasa bile daha yüksek stres hormonu taşıyordu.</p><p>Sürekli tetikte olmak, baskı görmek ve kontrolün başkasında olması bedene bir bedel yazıyordu. Ama Sapolsky basit bir &quot;alttakiler hep yıpranır&quot; tablosu çizmedi. Rütbenin kendisi kadar, o rütbenin nasıl yaşandığı önemliydi. Sürünün düzeninin istikrarlı olup olmaması, hayvanın gerçek bir tehditle zararsız bir hareketi ayırt edebilmesi, gerginliğini bir başkasına boşaltabilmesi ve sosyal bağlarının bulunması stres hormonu düzeyini etkiliyordu.</p><p>Aynı konumdaki iki pavyan çok farklı bir yük taşıyabiliyordu. Bu gözlem, Sapolsky&#x27;nin insanlarla ilgili anlattıklarının da arka planını kurar. Sapolsky bunu doğrudan insana taşımaz ama benzer örüntüleri insanlarda da arar: yıpratan çoğu zaman ünvan ya da basamak olmaz, o konumun nasıl deneyimlendiği olur.</p><p>Sapolsky&#x27;nin gözlemlerine göre bazı hayvanlar yenildikten sonra gerginliklerini kendilerinden alttaki bir hayvana yöneltiyordu ve bunu yapabilenlerin stres hormonu daha düşük çıkıyordu. Başkaları ise tımar yoluyla başka hayvanlarla yakınlık kuruyordu. Yani aynı sürü içinde gerginlikle baş etmenin birden fazla yolu vardı, ve her hayvan bunlardan aynı ölçüde yararlanamıyordu.</p><p>Kontrol, öngörülebilirlik ve destek duygusu, aynı basamağın yükünü hafifletebilir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>48</em></h4><div class=\"lesson\"><b>Konumunuzdan çok o konumda nasıl yaşadığınız yıpratır.</b> İki kişi aynı yoğun serviste çalışabilir; birinin yanında güvendiği bir iş arkadaşı vardır, diğeri her vardiyada yalnızdır. Aynı yük birinde hafifler, ötekinde ağırlaşır. Bunu bildiğinizde ünvanınızı ya da yoğunluğunuzu hemen değiştiremeseniz bile güvendiğiniz biriyle konuşmak gibi küçük bir çıkış yolu açabilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>15</em></h4><div class=\"ask\">Kendi sürünüzde gerginliğinizi boşaltabildiğiniz ve güvendiğiniz biri var mı, yoksa hepsini tek başınıza mı taşıyorsunuz?</div></section><section class=\"s s-use\"><h4>use <em>63</em></h4><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Ekibinizden biri sürekli gergin görünüyor</p><p class=\"say\">&quot;Bu işi taşımak kolay değil. Bu ekipte gerginliğini boşaltabildiğin, güvendiğin biri var mı?&quot;</p></div><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Yeni kurallarla ekip belirsizlik yaşıyor</p><p class=\"say\">&quot;Sapolsky&#x27;nin pavyanlarında istikrarsız düzen stres yaratıyordu. Hangi kararın kimde olduğunu yazalım, herkes ne beklediğini bilsin.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Arkadaşınız yoğunluktan yakınıyor</p><p class=\"say\">&quot;Yük ağır, görüyorum. Bu hafta bir akşam yürüyüşe çıkıp sadece konuşsak ister misin?&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Aynı yük, yanınızda güvendiğiniz biri olunca daha hafiftir; bu hafta o insanı arayın.</div></section>", "counts": {"open": 16, "story": 230, "lessons": 48, "reflect": 15, "use": 63, "pocket": 13}, "total": 385, "var": "<div class=\"v\"><b>punchline</b> Sapolsky&#x27;nin pavyanlarını aslanlar değil, birbirleri yoruyordu.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky yıllarca yazlarını Doğu Afrika&#x27;da yabani pavyanları izleyerek geçirdi ve hayvanların stres hormonlarını ölçtü. Sürünün altındaki erkeklerde hormon çoğu zaman daha yüksekti, hiçbir aslan peşlerinde olmasa bile. Ama rütbe tek başına belirleyici değildi. Düzenin istikrarı, gerginliği boşaltabilmek ve sosyal bağlar da fark yaratıyordu.</div><div class=\"v\"><b>key_contrast</b> Rütbe ve yaşanış</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>45</em></h4><p>Doğu Afrika savanında yaşayan bir pavyan, günde ortalama üç saatini yiyecek bulmaya harcar. Karnını doyurmak kolaydır ve yırtıcılar nadiren saldırır. Peki günün geri kalan dokuz saatinde ne yapar? Robert M. Sapolsky&#x27;nin otuz yıl boyunca her yaz gidip yerinde izlediği cevap tanıdıktır: sürüdeki diğer pavyanlarla uğraşır.</p></section><section class=\"s s-story\"><h4>story <em>238</em></h4><p>Nörobiyolog Robert Sapolsky, insanlardaki kronik sosyal stresi anlamak için laboratuvar fareleri yerine Serengeti&#x27;deki vahşi pavyan sürülerini seçti. Çünkü pavyanlar da tıpkı modern insanlar gibi açlıktan ya da aslanlardan çok, kendi sosyal hiyerarşilerinin yarattığı gerilimle yaşar.</p><p>Sapolsky otuz yıl boyunca her yaz çadırını kurdu; sürüde kimin kimi yerinden kaldırdığını, kimin kimin yiyeceğini elinden aldığını, kimin kime tımar yaptığını tek tek not etti. Ardından hayvanları bayıltıcı oklarla kısa süreliğine uyutup kan örnekleri aldı ve stres hormonlarını ölçtü.</p><p>İlk tablo çok netti. Sürünün alt basamaklarındaki pavyanlar, ortalıkta hiçbir yırtıcı yokken ve dinlenirken bile kanlarında sürekli yüksek kortizol taşıyordu. Üst sıradaki bir erkek pavyan kötü bir gün geçirdiğinde gidip alt sıradaki birini ısırıyor, o da hıncını daha alttakinden çıkarıyordu. Ne zaman saldırıya uğrayacağını bilmemek ve kontrolün başkasında olması, alt sıradakilerin tansiyonunu yükseltiyor, damarlarını yıpratıyor ve bağışıklıklarını düşürüyordu.</p><p>Ancak yıllar ilerledikçe Sapolsky tek başına rütbenin her şeyi açıklamadığını gördü. Bazı üst sıradaki pavyanların da kortizolü çok yüksekti; bazı alt sıradakiler ise şaşırtıcı derecede sağlıklıydı.</p><p class=\"hl\">Sağlığı belirleyen şey hiyerarşideki koltuğun numarası değil, o koltuğun nasıl bir ortamda ve kiminle yaşandığıydı.</p><p>Eğer sürüde liderlik kavgası varsa ve hiyerarşi her gün sallanıyorsa, en tepedeki pavyanlar da altındakiler kadar ağır stres yaşıyordu. Daha önemlisi, aynı alt basamakta bulunan iki pavyandan biri diğerleriyle dostluk kuruyor, yan yana oturup birbirlerinin tüylerini tımar ediyor ve bir kavga çıktığında sırtını yaslayabileceği bir müttefik bulabiliyorsa, kanındaki stres hormonları belirgin biçimde daha düşük çıkıyordu. Sosyal bağ, hiyerarşinin sertliğini emen bir tampon görevi görüyordu.</p></section><section class=\"s s-lessons\"><h4>lessons <em>60</em></h4><div class=\"lesson\"><b>Zor bir ortamda yıpranmayı belirleyen şey konumunuzdan çok, yanınızda güvenebileceğiniz birinin olup olmadığıdır.</b> Yoğun ve baskılı bir hastanede nöbet tutan iki genç asistandan, nöbet çıkışı derdini samimiyetle paylaşabildiği bir meslektaşı olanı aynı iş yükünü çok daha az hasarla atlatır. Baskıyı tek başınıza göğüslemek yerine iş veya sosyal çevrenizde güvene dayalı gerçek bir dayanışma kurduğunuzda, dış koşulların üzerinizdeki yıkıcı etkisini azaltırsınız.</div></section><section class=\"s s-reflect\"><h4>reflect <em>17</em></h4><div class=\"ask\">İçinde bulunduğunuz iş ya da yaşam çevresinde, işler gerildiğinde savunmaya geçmeden konuşabildiğiniz ve sırtınızı yaslayabildiğiniz kim var?</div></section><section class=\"s s-use\"><h4>use <em>105</em></h4><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Ekibinize yeni katılan veya zor bir dönemden geçen bir iş arkadaşınızla konuşurken</p><p class=\"say\">&quot;Sapolsky&#x27;nin pavyan araştırmalarında gördüğü gibi, baskılı bir ortamda en büyük farkı güvenilir bir müttefik yaratıyor. Bir yerde sıkışırsan tek başına yüklenme, bana doğrudan söyleyebilirsin.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Bir arkadaşınız iş yerindeki unvan veya statü yarışı yüzünden kendini kötü hissettiğinde</p><p class=\"say\">&quot;Tepedeki koltukta oturanlar da koltuğu kaybetme korkusuyla aynı stresi yaşıyor. Asıl koruyucu olan unvan değil, içeride güvendiğin birkaç insanla kurduğun bağ.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">İş yerinde veya bir grupta gerilimin arttığını hissettiğinizde</p><p class=\"say\">&quot;Bu gerilimi tek başıma içime atmayacağım. Bugün güvendiğim bir arkadaşımla oturup yirmi dakika başka bir şey konuşarak zihnimi boşaltacağım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>11</em></h4><div class=\"pocket\">Hiyerarşideki yerinizden çok, o yeri kiminle yan yana yaşadığınız bedeninizi korur.</div></section>", "counts": {"open": 45, "story": 238, "lessons": 60, "reflect": 17, "use": 105, "pocket": 11}, "total": 476, "var": "<div class=\"v\"><b>punchline</b> Robert Sapolsky&#x27;nin otuz yıl izlediği vahşi pavyanlarda, hiyerarşinin en altındakiler ortalıkta hiçbir aslan yokken bile yüksek stres
