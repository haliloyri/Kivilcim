hormonu taşıyordu; ama dostu olanların kan değerleri çok daha sağlıklıydı.</div><div class=\"v\"><b>thirty_sec</b> Nörobiyolog Robert Sapolsky otuz yıl boyunca Doğu Afrika&#x27;daki vahşi pavyan sürülerini inceledi. Pavyanlar günde sadece birkaç saat yiyecek arıyor, kalan vakitte birbirleriyle uğraşıyordu. Sürünün alt basamağındakiler dinlenirken bile yüksek kortizol taşıyordu. Ancak Sapolsky asıl farkı rütbenin değil, sosyal desteğin yarattığını buldu: sürüde dostu olan ve tüylerini tımar ettirebilen pavyanlar aynı baskıdan çok daha az zarar görüyordu.</div><div class=\"v\"><b>key_contrast</b> Yalnız rütbe ve koruyucu dostluk</div>"}}, {"id": 1791, "title": "Aynı Elektrik, İki Farklı Sıçan", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>26</em></h4><p>İki sıçana aynı şok, aynı sıklıkta veriliyor. Yalnızca birine şoktan önce bir uyarı işareti geliyor. Sapolsky&#x27;ye göre bu küçük fark, hangisinin bedeninin daha çok yıpranacağını belirliyor.</p></section><section class=\"s s-story\"><h4>story <em>247</em></h4><p>Robert Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers</i> kitabında stresin ağırlığını şoktan çok şokun etrafındaki koşullara bağlayan bir deneyi anlatır. İki sıçana aynı şiddette elektrik şoku, aynı sıklıkta verilir. Fiziksel olarak yaşadıkları aynıdır. Tek fark, birinin şoktan önce bir uyarı işareti alması, ötekinin hiçbir şey duymadan şoka yakalanmasıdır.</p><p class=\"hl\">Uyarı alan sıçan, uyarı almayana göre belirgin biçimde daha az ülser geliştirir.</p><p>Deneyin değeri, olayın kendisini sabit tutmasıdır. Şokun sayısı ve şiddeti iki hayvanda aynı olduğu için fark yalnızca hayvanın yaşadığı koşuldan gelir. Sapolsky bunun insanlarda da böyle olabileceğini düşünür: aynı iş yükü iki kişiyi farklı biçimde yıpratabilir.</p><p>Şok aynıdır ama öngörülebilirlik farklıdır. Şokun ne zaman geleceğini bilen hayvan, aradaki zamanlarda gevşeyebilir. Uyarı alamayan hayvan ise sürekli bir sonraki şoku bekler ve bedeni bu bekleyişle yıpranır.</p><p>Sapolsky benzer deneyleri bir araya getirerek stresin ağırlığını belirleyen birkaç etken sayar. Olayın ne kadar öngörülebilir olduğu, üzerinde kontrol olduğu duygusu ve gerginliği boşaltacak bir çıkış bunların başındadır. Durumun daha kötüye gitmediği hissi ve sosyal destek de listeye girer.</p><p>Sapolsky bu bulguyu önemli bir ayrıma bağlar. Gerçek bir tehdit karşısında alarmın açılması yerindedir. Yıpratan olan, tehdit gelmediği zamanlarda da sürekli gelecekmiş gibi beklemektir. Öngörülebilirlik bu beklemeyi kısaltır. Uyarı işareti, şokun gelmediği zamanlarda hayvana güvenli bir alan tanır.</p><p>Bu etkenlerin her biri aynı olayı hafifletebilir. Kitabın gösterdiği, yükün büyüklüğü kadar bedenin o yük karşısında ne kadar hazırlıksız ve çaresiz kaldığıdır. Bir deney hayvanına çevirebileceği bir tekerlek verildiğinde ya da bir insana işini ne zaman yapacağına kendisinin karar verdiği söylendiğinde, aynı yük daha az yıpratıcı olabilir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>54</em></h4><div class=\"lesson\"><b>Belirsizliği küçültmek yükü hafifletir.</b> Bir terzi müşterinin elbiseyi hangi gün isteyeceğini biliyorsa o güne kadar rahat çalışır; &quot;bir gün gelir&quot; denirse her kapı çalışında gerilir. Aynı işi tarihi netleşmiş hâlde yapan kişi, aynı yükü daha az yıpranarak taşır. Kendi işinize bir tarih, bir ön uyarı ya da küçük bir karar alanı eklemek gerginliği azaltabilir.</div></section><section class=\"s s-reflect\"><h4>reflect <em>18</em></h4><div class=\"ask\">Sizi en çok yoran durumda gerçekten çaresiz misiniz, yoksa küçük bir kontrol ya da öngörü alanı açabilir misiniz?</div></section><section class=\"s s-use\"><h4>use <em>70</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Teslim tarihi sürekli belirsiz kalıyor</p><p class=\"say\">&quot;Sıçan deneyindeki fark bir uyarı işaretiydi. Bize de bir tarih lazım: teslim ne zaman, değişirse kim haber verecek?&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Çocuğunuz yarınki sınavdan korkuyor</p><p class=\"say\">&quot;Önce neyi bildiğimizi netleştirelim: sınav kaçta, ne çıkabilir, sen neyi çalıştın? Bilinmeyen azalınca korku da azalır.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Bir sonuç beklerken geriliyorsunuz</p><p class=\"say\">&quot;Sonucun ne zaman çıkacağını öğrenip o güne kadar kendi elimde olan iki şeyi yazacağım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>14</em></h4><div class=\"pocket\">Şok aynıyken uyarı alan sıçanın ülseri azdı; belirsiz işlerinize bir tarih ve uyarı ekleyin.</div></section>", "counts": {"open": 26, "story": 247, "lessons": 54, "reflect": 18, "use": 70, "pocket": 14}, "total": 429, "var": "<div class=\"v\"><b>punchline</b> İki sıçan aynı şoku yedi, ama şoku önceden bilenin ülseri çok daha azdı.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky iki sıçanın aynı şiddette ve sıklıkta elektrik şoku aldığı bir deneyi anlatır. Tek fark, birinin şoktan önce uyarı alması. Uyarı alan sıçan belirgin biçimde daha az ülser geliştirir. Sapolsky&#x27;ye göre bedeni yıpratan yalnızca olay değil, o olayın ne kadar öngörülebilir, kontrol edilebilir ve boşaltılabilir olduğudur.</div><div class=\"v\"><b>key_contrast</b> Şok ve öngörü</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>57</em></h4><p>İki laboratuvar sıçanına aynı gün içinde, aynı şiddette ve aynı sayıda hafif elektrik şoku verilir. İkisinin bedenine giren fiziksel yük milimine kadar aynıdır. Ama deneyin sonunda sıçanlardan birinin midesi ülserle dolarken, diğeri neredeyse hiç yara almaz. Robert M. Sapolsky, <i>Why Zebras Don&#x27;t Get Ulcers (Zebralar Neden Ülser Olmaz)</i> kitabında stres psikolojisinin en temel yasasını bu deneyle anlatır.</p></section><section class=\"s s-story\"><h4>story <em>224</em></h4><p>Deneydeki iki sıçan arasındaki tek fark, şoktan on saniye önce duyulan küçük bir sestir. Birinci sıçan her şoktan önce kısa bir zil sesi duyar. Zil çaldığında birazdan ne olacağını bilir; zil çalmadığı dakikalarda ise güvende olduğundan emindir ve gevşeyebilir. İkinci sıçana ise hiçbir uyarı verilmez. Şok her an gelebilir; bu yüzden hayvan günün her saniyesini şok gelecekmiş gibi kasılarak geçirir.</p><p class=\"hl\">Stresin bedende açtığı yarayı fiziksel darbenin kendisi değil, o darbenin ne zaman geleceğini bilememek ve çaresiz kalmak büyütür.</p><p>Sapolsky bu klasik deneylerin yanına ikinci bir düzeneği koyar: kontrol duygusu. Yine aynı şoku alan bir sıçanın kafesine basabileceği bir pedal konur ve pedala bastığında şokun sıklığını azaltabildiği öğretilir. Daha ilginci, bir süre sonra pedalın elektrik bağlantısı kesilse bile, sıçan sırf pedala basabildiği için —yani elinde bir hamle şansı olduğuna inandığı için— stres hormonları düşük kalır.</p><p>Üçüncü koruyucu unsur ise gerginliği boşaltacak bir çıkıştır. Şok sırasında kafeste kemirebileceği bir tahta parçası ya da koşabileceği bir çark bulunan sıçan, hiçbir çıkış yolu olmayana göre çok daha az ülser geliştirir.</p><p>Sapolsky bütün bu bulguları bir araya getirdiğinde dört psikolojik tampon ortaya çıkar: öngörülebilirlik, kontrol alanı, gerginliği boşaltacak bir çıkış ve işlerin iyiye gittiğine dair geri bildirim. Günlük hayatta bunun karşılığı çok açıktır. Bir saat boyunca yoğun trafikte sıkışıp kalmakla bir saat boyunca tempolu koşmak kalbinizi benzer hızda çalıştırabilir; ama birinde direksiyonda çaresizce beklersiniz, diğerinde ise adımlarınızın kontrolü sizdedir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>68</em></h4><div class=\"lesson\"><b>Belirsizliği daraltmak ve küçük bir karar alanı açmak, aynı yükün yıpratıcılığını yarıya indirir.</b> Dişçi koltuğunda otururken doktorun ne zaman ve kaç saniye işlem yapacağını bilmeyen bir hasta bütün seans boyunca kasılırken, doktor &quot;Şimdi on saniye sürecek, elini kaldırırsan hemen dururum&quot; dediğinde aynı işlemi çok daha sakin geçirir. Sizi yoran bir işte her şeyi değiştiremeseniz bile zamanlamayı veya çalışma sırasını kendi elinize aldığınızda, bedeninize sürekli tetikte kalma zorunluluğunu bıraktırırsınız.</div></section><section class=\"s s-reflect\"><h4>reflect <em>24</em></h4><div class=\"ask\">Şu sıralar sizi en çok geren ve elinizden bir şey gelmediğini düşündüğünüz durumda, zamanlamasını ya da sınırlarını sizin belirleyebileceğiniz hangi küçük alanı geri alabilirsiniz?</div></section><section class=\"s s-use\"><h4>use <em>113</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekip belirsiz bir kriz veya yeniden yapılanma döneminde sürekli diken üstünde çalışıyor</p><p class=\"say\">&quot;Sapolsky&#x27;nin uyarı zili deneyindeki gibi insanları en çok yoran şey ne zaman ne olacağını bilmemek. Her şeyi netleştiremesek bile her pazartesi sabahı bildiklerimizi açıkça paylaşalım ki geri kalan günlerde herkes rahat çalışsın.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Bir ekip arkadaşınız iş yükünün ağırlığından ve sıkışmışlıktan bunalmış durumda</p><p class=\"say\">&quot;İşin kendisini iptal edemeyiz ama hangi sırayla ve günün hangi saatinde yapacağını tamamen sen seç. Küçük bir kontrol alanı bile yükü hafifletir.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Gün boyu belirsiz mesajlar ve bölünmeler yüzünden gerildiğinizi hissettiğinizde</p><p class=\"say\">&quot;Zilin her an çalmasına izin verdiğim için hiç gevşeyemiyorum. Mesajlara her an bakmak yerine günde üç belirli saatte bakacağım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>16</em></h4><div class=\"pocket\">Aynı yük, ne zaman geleceğini bildiğinizde ve küçük bir seçim alanınız olduğunda çok daha az yaralar.</div></section>", "counts": {"open": 57, "story": 224, "lessons": 68, "reflect": 24, "use": 113, "pocket": 16}, "total": 502, "var": "<div class=\"v\"><b>punchline</b> Aynı elektrik şokunu alan iki sıçandan, şoktan önce kısa bir uyarı sesi duyanı ne zaman güvende olduğunu bildiği için çok daha az ülser geliştirir.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky klasik bir laboratuvar deneyini aktarır: iki sıçana birebir aynı şiddette ve sıklıkta elektrik şoku verilir. Tek fark, birincisinin şoktan önce kısa bir uyarı sesi duymasıdır. Ne zaman şok geleceğini ve ne zaman güvende olduğunu bilen sıçan çok daha az ülser geliştirir. Sapolsky&#x27;ye göre bizi yıpratan olayın kendisinden çok öngörülemezlik ve kontrol kaybıdır.</div><div class=\"v\"><b>key_contrast</b> Rastgele darbe ve öngörülebilir kontrol</div>"}}, {"id": 1792, "title": "Barışı Öğrenen Sürü", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>18</em></h4><p>Bir pavyan sürüsünün en saldırgan erkekleri aynı hastalıktan öldü. Geride kalan sürü, Robert Sapolsky&#x27;nin beklemediği bir yöne gitti.</p></section><section class=\"s s-story\"><h4>story <em>261</em></h4><p>Robert Sapolsky, Doğu Afrika&#x27;da yıllarca izlediği Orman Sürüsü adlı bir pavyan grubunu anlatır. Her pavyan sürüsü gibi bu grubu da en saldırgan erkekler yönetiyordu. Alttakilerin hayatı zordu.</p><p>Önceki düzende üst sıradakilerin alttakilere saldırması sıradan bir olaydı ve alttakiler bu yükü bedenlerinde taşıyordu. Sapolsky bunu o yıllarda sürünün normali olarak gözlemliyordu.</p><p>Sonra beklenmedik bir şey oldu. Sürünün yakınındaki bir turist lokantasının çöplüğünde bulaşmış et vardı. Bu etle beslenen en saldırgan erkekler tüberküloza yakalanıp öldü. Geride daha yumuşak huylu erkekler ve dişiler kaldı.</p><p class=\"hl\">Sürünün tarzı değişti: daha az zorbalık, daha çok tımarlaşma, daha az gerginlik.</p><p>Dikkat çekici olan bu değişimin kalıcı olmasıydı. Sürüye dışarıdan yeni erkekler katıldığında bile bu erkekler zamanla sürünün sakin düzenine uyum sağladı. Alttaki bireylerin ölçülen stres hormonları da düştü. Yani değişim davranıştan bedene kadar indi.</p><p>Alttaki bireyler için bunun anlamı basitti: günün içinde daha az tehdit, daha çok dinlenme ve temas. Sapolsky, değişimin hormon ölçümlerinde de görünmesini önemli bulur, çünkü bu, davranıştaki değişimin bedene de ulaştığını gösterir.</p><p>Sapolsky&#x27;nin bundan çıkardığı sonuç, kitabın en umut verici fikirlerinden biridir: bir grubun stres düzeyi biyolojik bir kader değildir. Grubun kültürü değişebilir ve bu değişim bireylerin bedenindeki yükü de değiştirir.</p><p>Bu bir deney değil, rastlantının yarattığı bir durumdur. Sapolsky tek bir sürüyü yıllar içinde izlemiştir ve benzer bir olayı isteyerek üretmek mümkün değildir. Bu yüzden hikâye kesin bir kural değil, bir olasılık gösterir: sürünün tarzı, içindeki bireylerin tek tek biyolojisinden bağımsız biçimde değişebilir.</p><p>Sapolsky bunu insan toplulukları için doğrudan bir tarif gibi sunmaz. Yine de pavyanların hikâyesi, gerginliğin yalnızca bireyin karakterinden değil, çevresindeki toplumsal düzenden de beslendiğini gösterir. Düzen değişince beden de değişir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>47</em></h4><div class=\"lesson\"><b>Bir grubun gerginlik düzeyi öğrenilmiş bir kültürdür.</b> Bir mutfakta şef sürekli bağırıyorsa herkes kendi rolünü korkuyla oynar. Şef değişince ya da biri yeni bir tavır başlatınca aynı mutfak daha sakin çalışabilir. Bunu bildiğinizde bulunduğunuz grubun tonunu sabit saymak yerine, kendi payınıza düşen küçük bir tavır değişikliğini seçebilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>11</em></h4><div class=\"ask\">İçinde bulunduğunuz grupta gerginliği azaltan küçük bir alışkanlığı siz başlatabilir misiniz?</div></section><section class=\"s s-use\"><h4>use <em>66</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Toplantılar hep gergin geçiyor</p><p class=\"say\">&quot;Pavyan sürüsü saldırgan erkekler gidince sakinleşti. Bu hafta herkes konuşmadan önce bir şey için teşekkür etsin, tonu deneyelim.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Evde herkes sinirli</p><p class=\"say\">&quot;Akşam yemeğinde telefonları kaldıralım ve herkes günün iyi geçen bir yanını anlatsın. Bir hafta deneyip bakalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">social</span><p class=\"sit\">Arkadaş grubunda dedikodu yayılıyor</p><p class=\"say\">&quot;Geçen sefer konuşulanlar bana iyi gelmedi. Bu akşam başka bir şeyden konuşsak?&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>11</em></h4><div class=\"pocket\">Sürünün tarzı değişebildi; bulunduğunuz grupta gerginliği düşüren ilk adımı siz atın.</div></section>", "counts": {"open": 18, "story": 261, "lessons": 47, "reflect": 11, "use": 66, "pocket": 11}, "total": 414, "var": "<div class=\"v\"><b>punchline</b> Bir pavyan sürüsünün en saldırgan erkekleri hastalıktan ölünce geriye kalan sürü sakinleşti ve bu sakinlik yıllarca sürdü.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky&#x27;nin izlediği Orman Sürüsü&#x27;nde en saldırgan erkekler bulaşmış etten tüberküloza yakalanıp öldü. Geriye daha yumuşak huylu erkekler ve dişiler kaldı. Zorbalık azaldı, tımarlaşma arttı. Sürüye sonradan katılan erkekler de bu sakin düzene uydu ve alttakilerin stres hormonları düştü. Sapolsky için bu, stres kültürünün bir kader olmadığını gösterir.</div><div class=\"v\"><b>key_contrast</b> Kader değil kültür</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>52</em></h4><p>1980&#x27;lerin ortasında Doğu Afrika&#x27;da Robert M. Sapolsky&#x27;nin yıllardır izlediği &quot;Orman Sürüsü&quot; adlı pavyan grubunun yakınındaki bir turistik tesisin çöplüğünde tüberkülozlu etler birikti. Sürünün en kavgacı ve en baskın erkekleri çöplüğü tekellerine aldı. Kısa süre içinde o saldırgan erkeklerin tamamı hastalanıp öldü ve Sapolsky biyoloji tarihinin en şaşırtıcı doğal deneylerinden birine tanık oldu.</p></section><section class=\"s s-story\"><h4>story <em>262</em></h4><p>O trajik salgından önce Orman Sürüsü, pavyan dünyasının alışıldık sert kurallarıyla yönetiliyordu. Tepedeki alfa erkekler yiyecek kaynaklarını zorbalıkla tutuyor, dişilere ve alt sıradaki erkeklere sık sık saldırıyor, sürüde sürekli bir korku ve yüksek kortizol iklimi estiriyordu. Biyologların çoğu bu sert hiyerarşiyi pavyan türünün değişmez genetik kaderi sayıyordu.</p><p>Fakat çöplükteki bozuk etlere yalnızca en saldırgan, kimseyi yanına yaklaştırmayan erkekler ulaşabildiği için tüberküloz adeta cerrahi bir neşter gibi çalıştı. Sürünün en zorba üyeleri birkaç ay içinde tek tek hayatını kaybetti.</p><p>Geriye dişiler ve kavgadan uzak duran, daha işbirlikçi, sosyal yönü güçlü erkekler kaldı. Sürüdeki erkek-dişi oranı iki katına çıktı ve ortamdaki zorbalık bir anda kesildi.</p><p>Sapolsky bundan sonra olacakları merakla bekledi. Pavyanlar ergenliğe ulaştığında doğdukları sürüden ayrılıp başka sürülere katılır. Yani birkaç yıl içinde dışarıdaki sert sürülerden Orman Sürüsü&#x27;ne yeni, kavgacı genç erkekler gelecekti. Herkes bu yeni gelenlerin boşluğu fırsat bilip eski zorba düzeni yeniden kuracağını düşünüyordu.</p><p class=\"hl\">Oysa yeni gelen kavgacı erkekler sürüyü değiştiremedi; sürü onları kendi barışçıl kültürüne uydurdu.</p><p>Dışarıdan gelen genç bir erkek eski alışkanlığıyla birine hırladığında ya da saldırmaya kalktığında, sürüdeki yerleşik erkekler ve dişiler bu oyuna katılmadı; tam tersine yeni gelene yaklaşıp tüylerini tımar ettiler ve gerilimi düşürdüler. Birkaç ay içinde o sert erkekler de kavgayı bıraktı. Yirmi yıl sonra Sapolsky aynı sürüyü tekrar ölçtüğünde, ilk kuşaktan neredeyse kimse kalmamış olmasına rağmen sürünün hâlâ barışçıl yaşadığını ve alt sıradaki pavyanların bile stres hormonlarının düşük olduğunu gördü.</p><p>Sapolsky&#x27;nin bu olaydan çıkardığı sonuç hem biyoloji hem de insan toplulukları için çok güçlüdür: saldırganlık ve kronik stres kültürü değiştirilemez bir doğa yasası değildir. Bir grubun normları değiştiğinde, o kültür sonradan gelenleri bile iyileştirebilir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>67</em></h4><div class=\"lesson\"><b>Bir grubun stres düzeyini bireylerin mizacından çok, içeride ödüllendirilen kültür belirler.</b> Toplantılarda en çok bağıranın ve başkalarının sözünü kesenin prim yaptığı bir şirkete en sakin insanı da alsanız birkaç ay içinde savunmacı ve gergin birine dönüşür; oysa yardımlaşmanın ve sakinliğin korunduğu bir ekipte en hırçın yeni üye bile sesini alçaltmayı öğrenir. Kendi ekibinizde veya evinizde hangi davranışa alan açtığınızı değiştirdiğinizde, içerideki herkesin stres yükünü kalıcı olarak düşürebilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>23</em></h4><div class=\"ask\">İçinde bulunduğunuz ekipte veya evde farkında olmadan ödüllendirilen gergin bir alışkanlığı kırmak için bu hafta hangi sakin ve işbirlikçi tepkiyi kural hâline getirebilirsiniz?</div></section><section class=\"s s-use\"><h4>use <em>105</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekip toplantısında tartışma sertleştiğinde ve &quot;bizim sektörde işler hep böyle gergin yürür&quot; dendiğinde</p><p class=\"say\">&quot;Sapolsky&#x27;nin Orman Sürüsü&#x27;nde gördüğü gibi gerginlik kaçınılmaz bir kader değil, sadece alışılmış bir kültür. Bugün birbirimizin sözünü kesmeden ve suçlamadan konuşma kuralını başlatalım.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Ekibe yeni katılan biri önceki iş yerinden kalma sert ve savunmacı bir üslupla konuştuğunda</p><p class=\"say\">&quot;Burada bir hata olduğunda suçlu aramıyoruz, birlikte düzeltiyoruz. Rahat olabilirsin, takıldığın yeri açıkça söyleyebilirsin.&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Evde küçük bir aksilikte seslerin hemen yükseldiği bir alışkanlık oluştuğunda</p><p class=\"say\">&quot;Evdeki havayı bizim ilk tepkimiz belirliyor. Bundan sonra bir şey döküldüğünde ya da geciktiğinde önce bağırıp sormak yerine birlikte toplamayı kural yapalım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>14</em></h4><div class=\"pocket\">Stres kültürü biyolojik bir kader değildir; içerideki normu değiştirdiğinizde sonradan gelenler de barışı öğrenir.</div></section>", "counts": {"open": 52, "story": 262, "lessons": 67, "reflect": 23, "use": 105, "pocket": 14}, "total": 523, "var": "<div class=\"v\"><b>punchline</b> Robert Sapolsky&#x27;nin izlediği pavyan sürüsünde en saldırgan erkekler bozuk etten ölünce geriye kalanlar barışçıl bir kültür kurdu ve yirmi yıl boyunca dışarıdan gelen kavgacı erkekler bile bu barışa uyum sağladı.</div><div class=\"v\"><b>thirty_sec</b> Robert Sapolsky&#x27;nin izlediği Orman Sürüsü&#x27;ndeki en saldırgan erkek pavyanlar, bir çöplükteki tüberkülozlu etleri tekellerine alıp ölünce sürüde sadece sakin erkekler ve dişiler kaldı. Zorbalık bitti ve stres hormonları düştü. Asıl sürpriz yıllar sonra yaşandı: dışarıdaki sert sürülerden gelen kavgacı genç erkekler bile birkaç ay içinde bu barışçıl kültüre uyum sağladı. Sapolsky&#x27;ye göre stres kültürü kader değildir.</div><div class=\"v\"><b>key_contrast</b> Zorba hiyerarşi ve öğrenilen barış</div>"}}, {"id": 1793, "title": "Kapını Her Sabah Çalan Ortak", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>30</em></h4><p>Aynı işletmenin iki ayrı rakamı vardır. Birini Bay Piyasa söyler ve her sabah değişir, ötekini işletme kazanır ve yavaş yavaş değişir. Benjamin Graham&#x27;a göre yatırımcının tuzağı bu ikisini aynı sanmaktır.</p></section><section class=\"s s-story\"><h4>story <em>246</em></h4><p>Benjamin Graham, 1949 tarihli <i>The Intelligent Investor</i> kitabında yatırımcıya bir hissenin iki ayrı yüzü olduğunu anlatır: fiyat ve değer.</p><p>Fiyatı Bay Piyasa söyler. Graham&#x27;ın hayal ettirdiği bu iş ortağı her sabah gelir ve payını size satmayı ya da sizinkini almayı önerir. Coşkulu olduğu günlerde yüksek bir rakam ister. Kötümser olduğu günlerde aynı payı çok ucuza vermeye razıdır. Rakam, ortağın o günkü duygusunu taşır.</p><p>Değer ise işletmenin gerçekte ne kazandığıyla ilgilidir. Bu rakam daha yavaş değişir ve Bay Piyasa&#x27;nın sabah keyfine bakmaz. Elinizdeki pay aynı kalırken yalnızca etiket değişir. Etiketi okumak ayrı iştir, etiketle karar vermek ayrı.</p><p class=\"hl\">Fiyat ile değer birbirinden uzaklaştığında Bay Piyasa&#x27;nın ruh hali sizin için bir fırsata dönüşebilir.</p><p>Graham&#x27;a göre hisse senedi almak, bir işletmenin küçük bir parçasına ortak olmaktır. Ekrandaki rakam o ortaklığın günlük etiketidir, ortaklığın kendisi değil. İşletme sizin adınıza çalışır ve kazanır; etiketi okuyan ise Bay Piyasa&#x27;dır.</p><p>Graham bunu katı bir takvime bağlamaz. Vurgusu, ortağın sözünü dinlemek zorunda olmadığınızdır. Fiyat işletmenin değerinin çok altına indiğinde alabilir, çok üstüne çıktığında satmayı düşünebilirsiniz. İkisi arasında bir yerdeyse sadece bekleyebilirsiniz. Her durumda kararı Bay Piyasa vermez, siz verirsiniz.</p><p>Graham&#x27;ın anlattığı tuzak, fiyatı değer sanmaktır. Fiyatı değer sanan kişi, ortak coşkulandığında rakamın yüksekliğini işletmenin iyi olduğuna kanıt sayar. Ortak paniklediğinde rakamın düşüklüğünü işletmenin bittiğine yorar. Aynı işletme hakkında iki ayrı sabah iki ayrı sonuca varır.</p><p>Bu ayrım işletmenin değerini bilmeyi gerektirir, yani biraz çalışma ister. Ama bu çalışma yapıldığında Bay Piyasa&#x27;nın her sabahki teklifi bir zorunluluk olmaktan çıkar ve elinizdeki işe yarar bir bilgiye dönüşür.</p></section><section class=\"s s-lessons\"><h4>lessons <em>55</em></h4><div class=\"lesson\"><b>Fiyatla değeri ayrı hesaplayın.</b> İkinci el bir araba alırken satıcının söylediği rakamla arabanın bakım geçmişinin ve gerçek durumunun ayrı şeyler olduğunu bilirsiniz. İkisini yan yana koyduğunuzda etkileyici bir rakamın ardındaki sorunu görebilir ya da sıradan görünen iyi bir fırsatı kaçırmazsınız. Alışverişte, iş tekliflerinde ya da yatırımda hangi rakamın satıcıya, hangisinin işe ait olduğunu sormak yeter.</div></section><section class=\"s s-reflect\"><h4>reflect <em>19</em></h4><div class=\"ask\">Son büyük kararınızda gördüğünüz rakam işin değerini mi anlatıyordu, yoksa satıcının ya da kalabalığın o günkü ruh halini mi?</div></section><section class=\"s s-use\"><h4>use <em>77</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekip hızla yükselen bir şirketin hissesini almayı tartışıyor</p><p class=\"say\">&quot;Bu rakam ortağın o günkü coşkusu olabilir. Önce şirketin gerçekte ne kazandığına bakalım, sonra fiyata dönelim.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Danışmanınız bir fonun son haftalardaki yükselişini övüyor</p><p class=\"say\">&quot;Fiyat yükselmiş, anladım. Peki bu fonun sahip olduğu işletmelerin kazancı da o kadar artmış mı?&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Fiyatı düşen bir hisseyi almak üzeresiniz</p><p class=\"say\">&quot;Fiyat düştü ama işletme değişti mi? Bay Piyasa&#x27;nın paniği mi bu, yoksa gerçek bir kötüleşme mi?&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>11</em></h4><div class=\"pocket\">Bay Piyasa&#x27;nın söylediği fiyat etikettir; alacağınız şey ise etiketin altındaki işletmedir.</div></section>", "counts": {"open": 30, "story": 246, "lessons": 55, "reflect": 19, "use": 77, "pocket": 11}, "total": 438, "var": "<div class=\"v\"><b>punchline</b> Aynı işletmenin iki rakamı var: Bay Piyasa&#x27;nınki her sabah değişiyor, işletmeninki yavaş yavaş.</div><div class=\"v\"><b>thirty_sec</b> Benjamin Graham bir hisse için iki ayrı rakam olduğunu söyler. Fiyatı, ruh hali değişken bir ortak olan Bay Piyasa söyler: coşkulu günde pahalı, panikli günde ucuz. Değer ise işletmenin gerçekte ne kazandığıdır ve yavaş değişir. Fiyat değerin çok altındaysa alabilir, çok üstündeyse satmayı düşünebilirsiniz. Fiyatı değer sanan kişi ise ortağın ruh halinin peşinden gider.</div><div class=\"v\"><b>key_contrast</b> Fiyat ve değer</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>53</em></h4><p>Ortak olduğunuz dükkânın kapısı her sabah saat dokuzda çalınır. İçeri giren ortağınız kasadaki paraya ya da dükkânın müşterilerine bakmadan bir kâğıda rakam yazar: &quot;Bugün senin payını şu fiyattan alırım ya da kendi payımı aynı fiyattan sana satarım.&quot; Benjamin Graham, 1949&#x27;da <i>The Intelligent Investor (Akıllı Yatırımcı)</i> kitabında hisse senedi piyasasını bu sabah ziyaretiyle somutlaştırır.</p></section><section class=\"s s-story\"><h4>story <em>247</em></h4><p>Benjamin Graham yatırımcılardan kendilerini halka açık bir kalabalığın içinde değil, Bay Piyasa adında tek bir ortakla yarı yarıya kurulmuş özel bir işletmede hayal etmelerini ister. İşletmeniz sağlamdır; düzenli üretim yapar, müşterisi bellidir ve kasasına her yıl ne girdiği hesaplanabilir.</p><p>Gelgelelim ortağınız Bay Piyasa&#x27;nın terazisi bozuktur. O sabah gazetede parlak bir haber okumuşsa ya da hava güneşliyse, şirketin geleceğine dair sınırsız bir iyimserlikle kapınıza gelir ve hisse başına çok yüksek bir rakam söyler. Ertesi hafta ortalıkta karamsar söylentiler dolaştığında ise aynı ortak uykusuz gözlerle kapıda belirir; her şeyin bittiğine inanmıştır ve dün göklere çıkardığı payını üç kuruşa elden çıkarmak ister.</p><p class=\"hl\">Bay Piyasa&#x27;nın her sabah kapıda bağırdığı rakam, işletmenin ne kazandığını değil, ortağınızın o günkü sinir sistemini gösterir.</p><p>Graham&#x27;a göre yatırımcıların yaptığı en pahalı hata, aynı hissenin üzerindeki bu iki farklı etiketi birbirine karıştırmaktır:</p><p>~~Fiyat: Bay Piyasa&#x27;nın her sabah duygularıyla değiştirdiği kapıdaki teklif. :: Değer: İşletmenin varlıkları, üretimi ve gerçekte kasasına koyduğu kazanç.~~</p><p>Ortağınızın her gün kapıyı çalması ilk bakışta yorucu görünebilir. Oysa Graham bu tuhaflığın sabırlı bir ortak için büyük bir nimet olduğunu söyler. Çünkü aranızdaki sözleşmede harika bir madde vardır: Bay Piyasa her sabah fiyat söylemek zorundadır, ama siz onunla el sıkışmak zorunda değilsiniz.</p><p>Fiyat makul sınırlar içindeyken ya da aşırı şiştiğinde kâğıda bakar, gülümser ve işinize devam edersiniz. Ancak Bay Piyasa paniğe kapılıp sağlam işletmenizin payını gerçek değerinin çok altında bir fiyata size satmaya kalktığında, cüzdanınızı çıkarıp alım yaparsınız. Onun öfkesi veya korkusu sizin pusulanız olamaz; sadece hesabınızı doğru yaptığınızda size uygun fiyat sunan bir aracıdır.</p></section><section class=\"s s-lessons\"><h4>lessons <em>57</em></h4><div class=\"lesson\"><b>Fiyat ile değeri birbirine karıştıran, başkasının heyecanını kendi pusulası yapar.</b> Oturduğu mahallede komşusu acil nakit ihtiyacı yüzünden evini değerinin çok altında sattı diye kendi sağlam evinin de bir gecede değersizleştiğini sanıp paniğe kapılan bir ev sahibi, tabeladaki rakamla evin gerçek niteliğini karıştırıyordur. Bir işin veya kararın temel değerini önceden ölçtüğünüzde, etraftaki abartılı teklifleri ve korkuları soğukkanlılıkla süzebilirsiniz.</div></section><section class=\"s s-reflect\"><h4>reflect <em>23</em></h4><div class=\"ask\">Yakın zamanda verdiğiniz önemli bir kararda, uğraştığınız işin gerçek niteliğine mi baktınız, yoksa etrafınızdaki insanların o günkü abartılı övgüsüne veya korkusuna mı uydunuz?</div></section><section class=\"s s-use\"><h4>use <em>107</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Ekip kısa vadeli bir düşüş veya dış yorum yüzünden sağlam giden bir projeden vazgeçmeyi tartışıyor</p><p class=\"say\">&quot;Graham&#x27;ın fiyat ve değer ayrımını unutmayalım. Dışarıdaki bugünkü tepki fiyat; bizim ürünün çözdüğü gerçek sorun ise değer. Değer yerinde duruyorsa panikle yön değiştirmeyelim.&quot;</p></div><div class=\"card\"><span class=\"tag\">self</span><p class=\"sit\">Elinizdeki bir yatırımın veya emeğin günlük dalgalanmalar yüzünden değer kaybettiğini düşünüp kaygılandığınızda</p><p class=\"say\">&quot;Kapıyı çalan bugünkü rakam ortağın ruh hâli. İşin temelinde ve üretiminde bir bozulma yoksa teklifi görmezden gelip bekleyeceğim.&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Bir arkadaşınız piyasadaki sert bir düşüş yüzünden elindekileri zararına satmak üzereyken</p><p class=\"say\">&quot;Şu an gördüğün fiyat, şirketin battığını değil Bay Piyasa&#x27;nın korktuğunu gösteriyor. Satmadan önce şirketin gerçekte ne kazandığına birlikte bakalım.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>13</em></h4><div class=\"pocket\">Fiyat her sabah kapıda değişir, değer ise içeride sabırla üretilir; ikisini birbirine karıştırmayın.</div></section>", "counts": {"open": 53, "story": 247, "lessons": 57, "reflect": 23, "use": 107, "pocket": 13}, "total": 500, "var": "<div class=\"v\"><b>punchline</b> Benjamin Graham&#x27;a göre hissenin fiyatı Bay Piyasa&#x27;nın her sabah duygularıyla bağırdığı tekliftir; değeri ise şirketin içeride gerçekten ürettiği kazançtır.</div><div class=\"v\"><b>thirty_sec</b> Benjamin Graham yatırımcılara her sabah kapınızı çalıp elindeki pay için yeni bir fiyat söyleyen Bay Piyasa&#x27;yı anlatır. Bu ortak iyimser günlerde çok yüksek fiyat ister, korktuğu günlerde ise aynı payı yok pahasına satmaya kalkar. Graham&#x27;ın dersi nettir: fiyat ortağın o günkü ruh hâlidir, değer ise işletmenin gerçek kazancıdır. Ona uymak zorunda değilsiniz; paniğini fırsata çevirebilirsiniz.</div><div class=\"v\"><b>key_contrast</b> Değişken fiyat ve kalıcı değer</div>"}}];
function cnt(c){return ['open','story','lessons','reflect','use','pocket'].map(k=>k+' '+(c[k]||0)).join(' · ')}

 history.replaceState(null,'','#'+d.id)}
