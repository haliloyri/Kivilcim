<script>const D=[{"id": 1785, "title": "Rosenberg: yargı ve ihtiyaç", "claude": {"body": "<section class=\"s s-open\"><h4>open <em>20</em></h4><p>Marshall Rosenberg çatışmaların çoğunda aynı şeyi gördü: insanlar ihtiyaçlarını söylemek yerine karşısındakini yargılıyordu. Yargılayan cümle çabuk çıkar, ama konuşmayı kapatır.</p></section><section class=\"s s-story\"><h4>story <em>262</em></h4><p>Klinik psikolog Marshall Rosenberg, <i>Nonviolent Communication</i> kitabında günlük konuşmanın çatışmayı nasıl büyüttüğünü anlatır. Ona göre insanlar canları yandığında ihtiyaçlarını dile getirmek yerine karşısındakini etiketler: tembel, bencil, saygısız. Etiket karşı tarafı savunmaya iter ve konuşma asıl derdine hiç gelmeden kilitlenir.</p><p>Rosenberg&#x27;in önerdiği yol dört parçadan oluşur: gözlem, duygu, ihtiyaç ve rica. Gözlem, olanı değerlendirme katmadan söylemektir. Duygu, o sırada ne hissettiğinizdir. İhtiyaç, o duygunun arkasındaki karşılanmamış şeydir. Rica ise karşı tarafın yapabileceği somut ve açık bir istektir.</p><p>Bunu tanıdık bir durumda görelim. Aşağıdaki cümleler kitabın kendi örneği değil, onun mantığını gösteren bir çizimdir. Biri üst üste toplantılara geç geliyor olsun. Yargılı cümle şudur: &quot;Sen beni hiç umursamıyorsun.&quot; Dört parçalı hâli ise şöyle olabilir: &quot;Son üç toplantıya yarım saat geç geldin. Beklerken kaygılandım, çünkü işimizin zamanında ilerlemesine ihtiyacım var. Bir dahaki sefer başlama saatinde gelebilir misin?&quot;</p><p class=\"hl\">Rosenberg&#x27;e göre her yargının altında karşılanmamış bir ihtiyaç yatar ve onu adlandırmak çatışmanın tonunu yumuşatır.</p><p>İkinci cümlede karşıdaki kişi hâlâ bir davranışla yüzleşir. Ama karakteri hakkında verilmiş bir hüküm yoktur. Elinde bir olay, bir duygu ve yapabileceği bir rica vardır. Bu yüzden savunmaya geçmek için bir neden azalır.</p><p>Rosenberg ihtiyaçları herkeste ortak olan temel şeyler olarak görür: anlaşılmak, güvende olmak, saygı görmek gibi. İhtiyaç herkesçe tanınabildiği için karşı taraf onu duyduğunda ne dendiğini anlar. Yargı ise yalnızca bir tartışma konusu olur. Ricayı da talepten ayırır. Karşı taraf hayır diyebiliyorsa bu bir ricadır, hayır dediğinde suçlanıyorsa talep.</p><p>Rosenberg aynı dört adımı dinlerken de kullanmayı önerir. Karşınızdaki öfkeli konuşuyorsa onun neyi gördüğünü, ne hissettiğini ve neye ihtiyaç duyduğunu tahmin etmeye çalışırsınız. Böylece konuşma suçlamadan çıkıp iki tarafın ihtiyaçlarına doğru ilerler.</p></section><section class=\"s s-lessons\"><h4>lessons <em>39</em></h4><div class=\"lesson\"><b>Eleştirinin altındaki ihtiyacı arayın.</b> Ev arkadaşınız bulaşıkları lavaboda bırakıyorsa &quot;dağınıksın&quot; demek hızlı çıkar ama kapıyı kapatır. Görünen olayı söyleyip ardından düzene olan ihtiyacınızı belirtirseniz karşınızdaki savunmaya geçmeden dinleyebilir. Bu yol, yargıyı söylemeden önce kendi ihtiyacınızı fark etmenizi de sağlar.</div></section><section class=\"s s-reflect\"><h4>reflect <em>10</em></h4><div class=\"ask\">Son tartışmanızda karşınızdakine söylediğiniz yargının altında hangi karşılanmamış ihtiyaç vardı?</div></section><section class=\"s s-use\"><h4>use <em>85</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Bir iş arkadaşınız ortak dosyayı son anda hazırlıyor</p><p class=\"say\">&quot;Rosenberg&#x27;in dört adımını deniyorum: son iki toplantıda dosya bir saat önce geldi, bu beni geriyor, hazırlanmaya vaktime ihtiyacım var. Cuma öğlene kadar gönderebilir misin?&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Eşiniz yine geç kaldı</p><p class=\"say\">&quot;Bugün yemeğe yarım saat geç geldin, beklerken yalnız hissettim. Birlikte yemek benim için önemli. Geleceksen bir mesaj atar mısın?&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Biri size sert bir eleştiri yöneltti</p><p class=\"say\">&quot;Bunu söylerken yorgun muydun, bir şeye mi ihtiyacın vardı? Önce sana ne olduğunu anlamak istiyorum.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>12</em></h4><div class=\"pocket\">Yargıyı söylemeden önce olanı, hissettiğinizi, ihtiyacınızı ve tek bir ricayı sırayla söyleyin.</div></section>", "counts": {"open": 20, "story": 262, "lessons": 39, "reflect": 10, "use": 85, "pocket": 12}, "total": 428, "var": "<div class=\"v\"><b>punchline</b> Rosenberg&#x27;e göre &quot;sen hep geç kalıyorsun&quot; demek asıl derdi saklar ve karşınızdakini hemen savunmaya iter.</div><div class=\"v\"><b>thirty_sec</b> Psikolog Marshall Rosenberg, insanların canı yandığında ihtiyacını değil yargısını söylediğini gördü. Yargı karşı tarafı savunmaya iter ve konuşma kilitlenir. Önerdiği yol dört adımdır: ne olduğunu değerlendirmeden söyle, ne hissettiğini söyle, hangi ihtiyacın karşılanmadığını söyle ve açık bir rica yap. Ona göre her yargının altında karşılanmamış bir ihtiyaç var ve onu adlandırmak gerginliği yumuşatıyor.</div><div class=\"v\"><b>key_contrast</b> Yargı yerine ihtiyaç</div>"}, "argon": {"body": "<section class=\"s s-open\"><h4>open <em>28</em></h4><p>Kavga ederken en hızlı çıkan cümle çoğu zaman en işe yaramaz olandır. Klinik psikolog Marshall Rosenberg, bu cümlenin konuşmayı neden kapattığını ve yerine ne söylenebileceğini dört adımda anlattı.</p></section><section class=\"s s-story\"><h4>story <em>236</em></h4><p>Klinik psikolog Marshall Rosenberg, 1999 tarihli <i>Nonviolent Communication</i> kitabında çatışmalarda tekrar eden bir şeyi görür: insanlar neye ihtiyaç duyduklarını söylemek yerine karşısındakini yargılar. Yargılanan kişi kendini savunmaya geçer, çünkü söylenen şey bir ihtiyaç değil, onun hakkında verilmiş bir hükümdür. Konuşma da asıl meseleye gelmeden orada takılır.</p><p>Rosenberg&#x27;in önerdiği yol dört parçadır ve sırayla söylenir. Önce gözlem gelir: olanı, değerlendirme katmadan anlatırsınız. Sonra duygu: o sırada ne hissettiğinizi söylersiniz. Üçüncüsü ihtiyaçtır, yani o duygunun altındaki karşılanmamış şey. Dördüncüsü rica: karşı tarafın yapabileceği, net ve uygulanabilir bir istek. Dört adımın hiçbirinde karşınızdakinin karakteri hakkında bir cümle yoktur.</p><p class=\"hl\">Rosenberg&#x27;e göre her yargı, karşılanmamış bir ihtiyacın dolaylı ifadesidir.## Bu yüzden suçlayan cümlenin içinde asıl derdinizi aramak gerekir. Onu bulup adıyla söylediğinizde, yani &quot;şunu yaptın&quot; yerine &quot;şuna ihtiyacım var&quot; dediğinizde karşınızdaki kişi artık bir etiketle değil, bir ihtiyaçla karşılaşır.</p><p>İhtiyaçlar ona göre herkeste ortak, temel şeylerdir: anlaşılmak, güvende olmak, saygı görmek gibi. Herkes bunların ne olduğunu bildiği için ihtiyaç cümlesi karşı tarafa yabancı gelmez. Bir yargı cümlesi ise tartışılır, çünkü kimin haklı olduğu sorusunu açar.</p><p>Rica ile talep arasındaki fark da kitaptaki önemli ayrımlardan biridir. Karşı taraf hayır diyebiliyorsa bu bir ricadır. Hayır dediği için suçlanıyorsa, söylediğiniz şey talep olmuştur.</p><p>Dört adım dinlerken de işe yarar. Karşınızdaki biri size sert bir şey söylediğinde onun neyi gözlemlediğini, ne hissettiğini ve neye ihtiyaç duyduğunu anlamaya çalışırsınız. Karşınızdaki kişi öfkeli konuşuyorsa bile cümlesinin altında bir ihtiyaç aranır. Böylece konuşma suçlamadan ihtiyaçlara doğru yön değiştirir.</p></section><section class=\"s s-lessons\"><h4>lessons <em>63</em></h4><div class=\"lesson\"><b>Eleştiriyi söylemeden önce altındaki ihtiyacı arayın.</b> Ev arkadaşınız bulaşıkları yine lavaboda bıraktıysa &quot;dağınıksın&quot; demek kolaydır ama karşınızdaki hemen savunmaya geçer. Önce gördüğünüzü söyleyip ardından düzenli bir mutfağa ihtiyacınız olduğunu belirtirseniz, ondan ne istediğinizi de açıkça sorabilirsiniz. Bu sırayla konuştuğunuzda, daha ağzınızı açmadan neye ihtiyacınız olduğunu kendinize de söylemiş olursunuz. Hem kendi derdinizi netleştirir hem de karşınızdakine tartışmak yerine cevap verebileceği bir cümle bırakırsınız.</div></section><section class=\"s s-reflect\"><h4>reflect <em>17</em></h4><div class=\"ask\">Son tartışmanızda karşınızdakine söylediğiniz yargının altında sizin için hangi karşılanmamış ihtiyaç saklıydı ve bunu ona nasıl söyleyebilirdiniz?</div></section><section class=\"s s-use\"><h4>use <em>87</em></h4><div class=\"card\"><span class=\"tag\">meeting</span><p class=\"sit\">Bir iş arkadaşınız ortak dosyayı hep son anda gönderiyor</p><p class=\"say\">&quot;Dosya bu hafta teslimden bir saat önce geldi. Bu beni geriyor, çünkü kontrol etmeye vakit istiyorum. Perşembe akşamına kadar gönderebilir misin?&quot;</p></div><div class=\"card\"><span class=\"tag\">family</span><p class=\"sit\">Eşiniz yine geç kaldı</p><p class=\"say\">&quot;Bugün yemeğe yarım saat geç geldin ve beklerken yalnız hissettim. Birlikte yemek benim için önemli. Bir dahaki sefere geç kalacaksan mesaj atar mısın?&quot;</p></div><div class=\"card\"><span class=\"tag\">oneonone</span><p class=\"sit\">Biri size sert bir eleştiri yöneltti</p><p class=\"say\">&quot;Bunu söylerken bir şey seni mi zorluyor? Cevap vermeden önce neye ihtiyacın olduğunu anlamak istiyorum.&quot;</p></div></section><section class=\"s s-pocket\"><h4>pocket <em>12</em></h4><div class=\"pocket\">Yargıyı söylemeden önce olanı, hissettiğinizi, ihtiyacınızı ve tek bir ricayı sırayla söyleyin.</div></section>", "counts": {"open": 28, "story": 236, "lessons": 63, "reflect": 17, "use": 87, "pocket": 12}, "total": 443, "var": "<div class=\"v\"><b>punchline</b> Rosenberg&#x27;e göre kavgada ağzımızdan çıkan yargı, asıl ihtiyacımızı saklar ve karşımızdakini savunmaya iter.</div><div class=\"v\"><b>thirty_sec</b> Psikolog Marshall Rosenberg, insanların canı yandığında ihtiyacını değil yargısını söylediğini gördü. Yargılanan kişi savunmaya geçer, konuşma kilitlenir. Rosenberg dört adım önerir: olanı değerlendirmeden söyle, ne hissettiğini söyle, hangi ihtiyacın karşılanmadığını söyle, sonra açık bir rica yap. Karşı taraf hayır diyebiliyorsa bu rica, diyemiyorsa taleptir.</div><div class=\"v\"><b>key_contrast</b> Yargı yerine ihtiyaç</div>"}}];
function cnt(c){return ['open','story','lessons','reflect','use','pocket'].map(k=>k+' '+(c[k]||0)).join(' · ')}
function show(n){const d=D[n];document.querySelectorAll('#tabs button').forEach((b,i)=>b.classList.toggle('on',i==n));
 for(const [id,k,label] of [['L','claude','Eski sürüm (v1, yedek, veritabanında)'],['R','argon','Yeni sürüm (v2, yeniden yazıldı)']]){const x=d[k];
 document.getElementById(id).innerHTML='<h2>'+label+'</h2><div class="meta">#'+d.id+' · toplam '+x.total+' kelime<br>'+cnt(x.counts)+'</div>'+x.body+'<div class="s"><h4>variants</h4>'+x.var+'</div>'}
 history.replaceState(null,'','#'+d.id)}
D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d.id;b.onclick=()=>show(i);tabs.appendChild(b)});
show(Math.max(0,D.findIndex(d=>'#'+d.id==location.hash)));

</script></body></html>
